<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consolidado · Finanzas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/finanzas_shared.css">
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed');</script>
</head>
<body>
<main class="shell">
  <header class="page-header">
    <div class="brand">
      <img src="/shared-static/img/logo-atc.png" alt="ATC" onerror="this.style.display='none'">
      <div>
        <h1>Consolidado</h1>
        <p class="subtitle">Suma por codigo diario con tope, pagado y diferencia</p>
      </div>
    </div>
    <nav class="actions">
      <a class="btn" href="/venta/finanzas?token={{ token|default('') }}">Volver al panel</a>
      <button class="btn" type="button" onclick="cargar()">Actualizar</button>
    </nav>
  </header>

  <section class="panel">
    <div class="filters">
      <label for="fEstado">Estado</label>
      <select id="fEstado">
        <option value="todos">Todos</option>
        <option value="PENDIENTE">Pendiente</option>
        <option value="PARCIAL">Parcial</option>
        <option value="PAGADO">Pagado</option>
      </select>
      <label for="fQ">Buscar</label>
      <input id="fQ" type="search" placeholder="Codigo, tecnico o tipo gasto...">
    </div>
    <div class="sheet-note">Hoja "Consolidado": suma por codigo diario, monto a pagar, monto pagado y saldo.</div>
  </section>

  <section class="table-wrap">
    <table>
      <thead><tr>
        <th>Codigo Diario</th><th>Tecnico</th><th>Tipo Gasto</th><th>Fecha</th>
        <th style="text-align:right;">Suma</th><th style="text-align:right;">Tope</th>
        <th style="text-align:right;">A Pagar</th><th style="text-align:right;">Pagado</th>
        <th style="text-align:right;">Diferencia</th><th>Estado</th>
      </tr></thead>
      <tbody id="tbody"><tr><td class="empty-cell" colspan="10">Cargando...</td></tr></tbody>
    </table>
  </section>
</main>
<div id="toast"></div>
<script>
const tokenSesion = {{ token|tojson }};
let data = [];
function $(id){return document.getElementById(id);}
function esc(t){const d=document.createElement("div");d.textContent=String(t||"");return d.innerHTML;}
function clp(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}):"$0";}
function badge(estado){const k=String(estado||"").toLowerCase();return `<span class="badge ${esc(k)}">${esc(estado)}</span>`;}
function showToast(t,ok=true){const el=$("toast");el.className=ok?"":"error";el.textContent=t;el.style.display="block";clearTimeout(showToast._id);showToast._id=setTimeout(()=>{el.style.display="none";},2800);}
async function api(url,opt={}){const r=await fetch(url,{headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});const ct=r.headers.get("content-type")||"";const p=ct.includes("application/json")?await r.json():await r.text();if(!r.ok){throw new Error(typeof p==="string"?p:(p?.detail||JSON.stringify(p)));}return p;}
function applyFilter(){
  const estado=$("fEstado").value;
  const q=$("fQ").value.trim().toLowerCase();
  return data.filter(r=>{
    if(estado!=="todos" && r.estadoPago!==estado) return false;
    if(!q) return true;
    return [r.codigo,r.tecnico,r.tipoGasto].some(x=>String(x||"").toLowerCase().includes(q));
  });
}
function render(){
  const rows=applyFilter();
  if(!rows.length){$("tbody").innerHTML=`<tr><td class="empty-cell" colspan="10">Sin resultados.</td></tr>`;return;}
  $("tbody").innerHTML=rows.map(r=>`
    <tr>
      <td class="text-strong">${esc(r.codigo)}</td>
      <td class="text-strong">${esc(r.tecnico||"")}</td>
      <td>${esc(r.tipoGasto||"")}</td>
      <td>${esc(r.fecha||"")}</td>
      <td class="right">${esc(clp(r.suma))}</td>
      <td class="right">${r.tope?esc(clp(r.tope)):'<span class="dash">—</span>'}</td>
      <td class="right text-strong">${esc(clp(r.aPagar))}</td>
      <td class="right">${esc(clp(r.pagado))}</td>
      <td class="right ${r.diferencia>0?'text-strong':''}">${esc(clp(r.diferencia))}</td>
      <td>${badge(r.estadoPago)}</td>
    </tr>
  `).join("");
}
async function cargar(){
  try{data=await api("/api/finanzas/consolidado");render();}
  catch(err){$("tbody").innerHTML=`<tr><td class="empty-cell" colspan="10">Error: ${esc(err.message)}</td></tr>`;showToast("Error: "+err.message,false);}
}
$("fEstado").addEventListener("change",render);
$("fQ").addEventListener("input",render);
cargar();
</script>
<script src="/static/auth-guard.js"></script>
</body></html>
