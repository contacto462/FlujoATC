<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/favicon-180.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Generador de QR por recinto</title>
<link rel="stylesheet" href="/static/base.css">
<style>
:root{
  --bg:#f7f8fa;
  --surface:#fff;
  --border:#e5e7eb;
  --border-strong:#d1d5db;
  --text:#111827;
  --text-soft:#4b5563;
  --muted:#6b7280;
  --header-bg-from:#0b1424;
  --header-bg-to:#111c2f;
  --danger:#c0392b;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-y:auto;font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-size:13px;font-weight:500;display:flex;flex-direction:column;min-height:100vh}

/* ── HERO ─────────────────────────────── */
.hero{
  flex-shrink:0;
  display:flex;align-items:center;gap:20px;
  padding:18px 28px;
  background:linear-gradient(180deg,var(--header-bg-from) 0%,var(--header-bg-to) 100%);
  border-bottom:1px solid rgba(255,255,255,.06);
  box-shadow:0 2px 8px rgba(0,0,0,.28);
}
.hero-logo img{height:54px;width:auto;display:block;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.hero-copy{flex:1;min-width:0}
.hero-copy h1{font-size:19px;font-weight:700;letter-spacing:-.02em;color:#fff;line-height:1.2}
.hero-copy p{margin-top:4px;font-size:12.5px;color:rgba(255,255,255,.6);line-height:1.4}
.hero-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn-hero{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:8px;font-size:12.5px;font-weight:700;
  text-decoration:none;cursor:pointer;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.9);
  transition:background .15s,border-color .15s;white-space:nowrap;
}
.btn-hero:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.24)}
.btn-hero.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.btn-hero.primary:hover{background:#1e40af}
.btn-hero:disabled{opacity:.45;cursor:not-allowed}
.btn-hero:disabled:hover{background:#1d4ed8}

/* ── CONTENIDO ─────────────────────────────── */
.content{
  flex:1;
  padding:24px 28px 32px;
}

.toolbar{
  width:min(1120px,100%);
  margin:0 auto 22px;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  box-shadow:var(--shadow-sm);
}

.field{display:flex;flex-direction:column;gap:6px;flex:1 1 320px}

label{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

select{
  appearance:none;
  border:1px solid var(--border-strong);
  border-radius:10px;
  padding:11px 12px;
  font-size:14px;font-weight:700;color:var(--text);
  background:#fff;
}

.gen-btn{
  border:0;border-radius:10px;
  padding:12px 22px;
  color:#fff;background:#1d4ed8;
  font-weight:800;font-size:13px;
  cursor:pointer;white-space:nowrap;
  transition:background .15s;
}
.gen-btn:hover:not(:disabled){background:#1e40af}
.gen-btn:disabled{opacity:.45;cursor:not-allowed}

.gallery-head{
  width:min(1120px,100%);
  margin:0 auto 12px;
  display:flex;align-items:center;justify-content:space-between;
}
.gallery-head h2{margin:0;font-size:15.5px;font-weight:700;color:var(--text)}
.gallery-head .count{color:var(--muted);font-size:12.5px;font-weight:700}

.grid{
  width:min(1120px,100%);
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}

.card-wrap{
  display:flex;flex-direction:column;gap:8px;
}

.card{
  position:relative;
  background:#fff;
  border:3px solid #f4a672;
  border-radius:20px;
  padding:40px 14px 14px;
  min-height:244px;
  display:grid;gap:8px;align-content:start;
  box-shadow:none;
}

.card-logo{
  position:absolute;
  top:12px;left:14px;
  height:22px;width:auto;
  display:block;
}

.qr-row{
  display:flex;align-items:center;justify-content:center;gap:8px;
}

.qr{
  width:150px;height:150px;flex-shrink:0;
  border:0;border-radius:10px;
  padding:8px;background:#fff;
}
.qr img{width:100%;height:100%;display:block}

.verificador-strip{
  writing-mode:vertical-rl;
  text-orientation:mixed;
  font-size:15px;font-weight:800;letter-spacing:4px;
  color:#1d4ed8;
  padding:6px 3px;
  border-left:2px solid #f4a672;
  align-self:stretch;
  display:flex;align-items:center;justify-content:center;
}

.recinto-nombre{
  text-align:center;font-size:13px;font-weight:800;color:var(--text);
  overflow-wrap:anywhere;
}

.recinto-numero{
  text-align:center;font-size:12px;font-weight:700;color:#1d4ed8;
}

.del-btn{
  border:1px solid var(--border);
  background:#fff;color:var(--danger);
  border-radius:8px;padding:7px 10px;
  font-size:12px;font-weight:800;
  cursor:pointer;align-self:center;
}
.del-btn:hover{background:#fdecea;border-color:#f5c6cb}

.empty{
  width:min(1120px,100%);
  margin:0 auto;
  background:var(--surface);
  border:1px dashed var(--border-strong);
  border-radius:12px;
  padding:24px;color:var(--muted);text-align:center;
}

@media (max-width:900px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .hero{padding:16px}
  .content{padding:16px}
  .toolbar{flex-direction:column;align-items:stretch}
  .grid{grid-template-columns:1fr}
}

@page{
  size:A4 portrait;
  margin:6mm;
}

@media print{
  html,body{
    height:auto !important;
    min-height:0 !important;
    overflow:visible !important;
  }
  body{background:#fff;display:block}
  .hero, .toolbar, .gallery-head, .del-btn{display:none !important}
  .content{padding:0;overflow:visible}
  .grid{
    width:100%;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:5px;
    align-items:start;
    overflow:visible;
  }
  /* El QR (.qr, 150x150) queda intacto: solo se recorta el "marco" alrededor
     (borde, padding, textos) para que entren mas tarjetas por hoja sin
     achicar el codigo. Alto fijo + nombre a 2 lineas max para que todas las
     tarjetas midan lo mismo (si no, un nombre largo desalinea toda la fila
     y el grid de impresion puede desbordar la hoja). Medido para que 5 filas
     x 4 columnas (20 QR) entren en una sola hoja A4 en vez de dejar unos
     pocos sueltos en una segunda hoja casi vacia. */
  .card{
    border-width:1px;
    border-radius:8px;
    padding:20px 6px 3px;
    height:210px;
    min-height:0;
    gap:2px;
    box-shadow:none;
    overflow:hidden;
  }
  .card-logo{
    top:4px;
    left:6px;
    height:14px;
  }
  .qr{
    padding:5px;
  }
  .recinto-nombre{
    font-size:10px;
    line-height:1.2;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .recinto-numero{
    font-size:9px;
  }
  .verificador-strip{
    font-size:10px;letter-spacing:2px;padding:2px;
  }
  .card-wrap,
  .card{
    break-inside:avoid-page;
    page-break-inside:avoid;
    -webkit-column-break-inside:avoid;
  }
}
</style>

</head>
<body>

<header class="hero">
  <div class="hero-logo"><img src="/shared-static/img/logo-atc.png" alt="Logo ATC"></div>
  <div class="hero-copy">
    <h1>Generador de QR por recinto</h1>
    <p>Genera y guarda QR de inicio de turno sin límite, con historial y borrado individual.</p>
  </div>
  <div class="hero-actions">
    <a class="btn-hero" id="btnVolver" href="/guardia">Volver</a>
    <button class="btn-hero" type="button" onclick="window.print()">Imprimir</button>
  </div>
</header>

<div class="content">
  <section class="toolbar">
    <div class="field">
      <label for="recinto">Recinto</label>
      <select id="recinto">
        <option value="">Selecciona un recinto…</option>
        {% set grupos_vistos = [] %}
        {% for r in recintos %}
          {% if r.grupo not in grupos_vistos %}
            {% if grupos_vistos %}</optgroup>{% endif %}
            <optgroup label="{{ r.grupo_label }}">
            {% set _ = grupos_vistos.append(r.grupo) %}
          {% endif %}
          <option value="{{ r.id }}" data-label="{{ r.label }}">{{ r.label }}</option>
        {% endfor %}
        {% if grupos_vistos %}</optgroup>{% endif %}
      </select>
    </div>
    <button class="gen-btn" id="btnGenerar" type="button" disabled>Generar QR</button>
  </section>

  <div class="gallery-head">
    <h2 id="galeriaTitulo">Historial de QR generados</h2>
    <span class="count" id="galeriaCount"></span>
  </div>

  <div id="galeria"></div>
</div>

<script>
  const select = document.getElementById("recinto");
  const btnGenerar = document.getElementById("btnGenerar");
  const galeria = document.getElementById("galeria");
  const galeriaCount = document.getElementById("galeriaCount");
  const galeriaTitulo = document.getElementById("galeriaTitulo");

  function escHtml(s) {
    return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function tarjetaHTML(item) {
    const label = escHtml(item.recinto_label);
    const verificador = escHtml(item.verificador);
    return `
      <div class="card-wrap" data-id="${item.id}">
        <article class="card">
          <img class="card-logo" src="/shared-static/img/logo-atc2.jpeg" alt="Logo ATC">
          <div class="qr-row">
            <div class="qr">
              <img alt="QR ${label} N° ${item.numero}" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(item.target)}">
            </div>
            <div class="verificador-strip" title="Código verificador">${verificador}</div>
          </div>
          <div class="recinto-nombre">${label}</div>
          <div class="recinto-numero">N° ${item.numero}</div>
        </article>
        <button class="del-btn" type="button" onclick="borrarQr(${item.id}, this)">Eliminar</button>
      </div>`;
  }

  function renderGaleria(items) {
    galeria.innerHTML = "";
    if (!items.length) {
      galeria.innerHTML = '<section class="empty">Aún no hay QR generados para este recinto.</section>';
      galeriaCount.textContent = "";
      return;
    }
    const grid = document.createElement("section");
    grid.className = "grid";
    grid.innerHTML = items.map(tarjetaHTML).join("");
    galeria.appendChild(grid);
    galeriaCount.textContent = `${items.length} QR generado(s)`;
  }

  async function cargarGaleria(recintoId) {
    const res = await fetch(`/api/inicio-turno/qr-generados?recinto_id=${encodeURIComponent(recintoId)}`);
    const data = await res.json();
    renderGaleria(data.items || []);
  }

  select.addEventListener("change", () => {
    const recintoId = select.value;
    btnGenerar.disabled = !recintoId;
    if (!recintoId) {
      galeria.innerHTML = "";
      galeriaCount.textContent = "";
      galeriaTitulo.textContent = "Historial de QR generados";
      return;
    }
    const label = select.options[select.selectedIndex].dataset.label;
    galeriaTitulo.textContent = `Historial de QR — ${label}`;
    cargarGaleria(recintoId);
  });

  btnGenerar.addEventListener("click", async () => {
    const recintoId = select.value;
    if (!recintoId) return;
    const label = select.options[select.selectedIndex].dataset.label;
    btnGenerar.disabled = true;
    try {
      const res = await fetch("/api/inicio-turno/qr-generados", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ recinto_id: recintoId, recinto_label: label }),
      });
      if (!res.ok) throw new Error("No se pudo generar el QR");
      const nuevo = await res.json();
      const emptyMsg = galeria.querySelector(".empty");
      if (emptyMsg) galeria.innerHTML = "";
      let grid = galeria.querySelector(".grid");
      if (!grid) {
        grid = document.createElement("section");
        grid.className = "grid";
        galeria.appendChild(grid);
      }
      grid.insertAdjacentHTML("afterbegin", tarjetaHTML(nuevo));
      const total = grid.querySelectorAll(".card-wrap").length;
      galeriaCount.textContent = `${total} QR generado(s)`;
    } catch (err) {
      alert(err.message || "Error al generar el QR");
    } finally {
      btnGenerar.disabled = false;
    }
  });

  async function borrarQr(id, btn) {
    if (!confirm("¿Eliminar este QR? Esta acción no se puede deshacer.")) return;
    btn.disabled = true;
    try {
      const res = await fetch(`/api/inicio-turno/qr-generados/${id}`, { method: "DELETE" });
      if (!res.ok) throw new Error("No se pudo eliminar");
      const card = btn.closest(".card-wrap");
      const grid = card.parentElement;
      card.remove();
      const total = grid.querySelectorAll(".card-wrap").length;
      if (total === 0) {
        renderGaleria([]);
      } else {
        galeriaCount.textContent = `${total} QR generado(s)`;
      }
    } catch (err) {
      alert(err.message || "Error al eliminar");
      btn.disabled = false;
    }
  }
</script>
  <script>
  </script>
  <script src="/static/atc-logo-home.js"></script>
<script src="/static/atc-volver.js"></script>
</body>
</html>
