<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/favicon-180.png">
<link rel="shortcut icon" href="/favicon.ico">

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pruebas de Sonido — ATC</title>
  <link rel="stylesheet" href="/static/base.css">
<style>
:root{
  --bg:#edf2f7;
  --surface:#ffffff;
  --surface-soft:#f8fafc;
  --border:#d8e0ea;
  --text:#111827;
  --muted:#667085;
  --blue-1:#0b1d35;
  --blue-2:#12385f;
  --blue-3:#1d4f7a;
  --accent:#de7b36;
  --green:#16803c;
  --green-bg:#eaf7ef;
  --green-bd:#52a36a;
  --red:#c92a2a;
  --red-bg:#fff1f1;
  --red-bd:#e07777;
  --orange:#de7b36;
  --radius:10px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow-md:0 12px 28px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:"Inter","Segoe UI",system-ui,sans-serif;color:var(--text);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(circle at 12% 0%,rgba(18,56,95,.10),transparent 30%),
    linear-gradient(180deg,#f5f8fb 0%,var(--bg) 56%,#e7edf5 100%);
  min-height:100vh;
  padding:0 0 48px;
}

/* ── header (idéntico a control_protocolos) ── */
.hdr{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,#0b1424 0%,#111c2f 100%);
  display:flex;align-items:center;gap:18px;
  padding:20px 30px;
  min-height:108px;
  border-bottom:1px solid rgba(255,255,255,.06);
  margin-bottom:24px;
}
.hdr-logo{height:68px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.30))}
.hdr-title{flex:1;color:#fff;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.hdr-title small{display:block;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.72);margin-top:6px}
.hdr-right{display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.92)}
.pill.mes{background:rgba(222,123,54,.15);border-color:rgba(222,123,54,.35);color:#f0a86a}
.btn-back{padding:8px 16px;border-radius:9px;border:1px solid rgba(255,255,255,.12);
          background:rgba(255,255,255,.06);color:rgba(255,255,255,.92);font-size:13px;font-weight:700;
          cursor:pointer;text-decoration:none;transition:.15s}
.btn-back:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22)}

/* ── stats bar ── */
.stats{display:flex;align-items:center;gap:0;margin-bottom:20px;padding:0 30px;overflow-x:auto}
.stats-box{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--border);
           border-radius:8px;overflow:hidden;box-shadow:var(--shadow-sm);flex-shrink:0}
.stat{display:flex;align-items:center;gap:8px;padding:12px 22px;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-n{font-size:18px;font-weight:800;color:var(--text)}
.stat-l{font-size:12px;color:var(--muted)}
.stat.ok .stat-n{color:#15803d}
.stat.fail .stat-n{color:#c92a2a}
.stat.solved .stat-n{color:#047857}
.stat.pend .stat-n{color:var(--muted-strong,#475467)}

/* ── sections grid ── */
.sections{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start;padding:0 30px}
@media(max-width:1100px){.sections{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.sections{grid-template-columns:1fr;padding:0 14px}}

.section-col{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:12px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;background:var(--surface-soft)}

/* ── empresa group ── */
.empresa-group{border-bottom:1px solid #eef3f8}
.empresa-group:last-child{border-bottom:none}
.empresa-label{padding:10px 16px 5px;font-size:11px;font-weight:700;color:var(--blue-3);text-transform:uppercase;letter-spacing:.07em}

/* ── sucursal row ── */
.suc-row{display:flex;align-items:center;gap:10px;padding:8px 16px;transition:.12s;border-bottom:1px solid #f0f4f8}
.suc-row:last-child{border-bottom:none}
.suc-row:hover{background:#f8fafc}
.suc-info{flex:1;min-width:0}
.suc-nombre{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suc-dir{font-size:11px;color:var(--muted);white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35;margin-top:2px}
.suc-badges{display:flex;gap:6px;flex-shrink:0}

/* badge estado */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--green-bg);border:1px solid var(--green-bd);color:#15803d}
.badge.fail{background:var(--red-bg);border:1px solid var(--red-bd);color:#c92a2a}
.badge.solved{background:#ecfdf5;border:1px solid #34a36f;color:#047857}
.badge.pend{background:#f1f5f9;border:1px solid #d8e0ea;color:var(--muted)}

/* action buttons */
.act-btn{width:34px;height:34px;border-radius:7px;border:none;background:transparent;cursor:pointer;display:grid;place-items:center;transition:.12s;flex-shrink:0;box-shadow:none}
.act-btn:hover{background:#f1f5f9}
.act-btn svg{width:22px;height:22px}
.act-btn.ok-btn svg{color:#15803d}
.act-btn.ok-btn:hover svg{color:#166534}
.act-btn.fail-btn svg{color:#c92a2a}
.act-btn.fail-btn:hover svg{color:#7f1d1d}
.act-btn.undo-btn{opacity:.45}
.act-btn.undo-btn svg{color:var(--muted);width:17px;height:17px}
.act-btn.undo-btn:hover{opacity:.85}

/* ── modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:100;display:none;place-items:center;padding:24px}
.modal-bg.open{display:grid}
.modal{background:#fff;border-radius:10px;width:min(500px,100%);box-shadow:0 20px 60px rgba(0,0,0,.28);overflow:hidden}
.modal-header{background:#1e293b;border-top:3px solid #f97316;padding:18px 22px 16px}
.modal-header h3{font-size:16px;font-weight:700;color:#f1f5f9;margin:0 0 2px}
.modal-header .modal-sub{font-size:12px;color:#94a3b8;margin:0}
.modal-body{padding:22px}
.modal textarea{width:100%;min-height:90px;padding:11px 13px;border-radius:7px;border:1px solid #d1d5db;background:#fff;color:#1e293b;font-size:14px;font-family:inherit;resize:vertical;outline:none;box-sizing:border-box;transition:border-color .12s,box-shadow .12s}
.modal textarea:focus{border-color:#6b7280;box-shadow:0 0 0 3px rgba(107,114,128,.12)}
.modal-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.modal-btn{padding:9px 20px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.modal-btn.cancel{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.modal-btn.cancel:hover{background:#e2e8f0}
.modal-btn.confirm{background:#f97316;color:#fff;border:1px solid #ea6c0a}
.modal-btn.confirm:hover{background:#ea6c0a}

/* ── toast ── */
.toast{position:fixed;bottom:28px;right:24px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;color:#fff;z-index:200;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.toast.ok-t{background:#15803d}
.toast.fail-t{background:#c92a2a}
.toast.show{opacity:1;transform:translateY(0)}

/* ── loading ── */
.loading{text-align:center;padding:48px;color:var(--muted)}
</style>
</head>
<body>

<header class="hdr">
  <img class="hdr-logo" src="/shared-static/img/logo-atc.png" alt="ATC" onerror="this.style.display='none'"/>
  <div class="hdr-title">
    Pruebas de Sonido
    <small>Seguimiento mensual por sucursal</small>
  </div>
  <div class="hdr-right">
    <span class="pill mes" id="pilMes">—</span>
    <a class="btn-back" id="btnVolver" href="/?form=panelSelector&token={{ token|default('') }}">Volver</a>
  </div>
</header>

<div class="stats">
  <div class="stats-box">
    <div class="stat"><span class="stat-n" id="stTotal">—</span><span class="stat-l">Sucursales</span></div>
    <div class="stat ok"><span class="stat-n" id="stOk">—</span><span class="stat-l">Exitosas</span></div>
    <div class="stat fail"><span class="stat-n" id="stFail">—</span><span class="stat-l">Con falla</span></div>
    <div class="stat solved"><span class="stat-n" id="stSolved">—</span><span class="stat-l">Solucionadas</span></div>
    <div class="stat pend"><span class="stat-n" id="stPend">—</span><span class="stat-l">Pendientes</span></div>
  </div>
</div>

<div class="sections" id="sections">
  <div class="loading">Cargando sucursales…</div>
</div>

<!-- Modal falla -->
<div class="modal-bg" id="modalFalla">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3>Sistema no funciona</h3>
      <p class="modal-sub" id="modalSucNombre">Sucursal</p>
    </div>
    <div class="modal-body">
    <textarea id="obsTexto" placeholder="Describe el problema observado…"></textarea>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="modal-btn confirm" onclick="confirmarFalla()">Crear incidencia</button>
    </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOKEN  = "{{ token|default('') }}";
const MESES  = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const now    = new Date();
const MES_N  = now.getMonth();
const ANIO   = now.getFullYear();

document.getElementById("pilMes").textContent = MESES[MES_N] + " " + ANIO;

let sucursalesData = [];
let pendingFallaSucId = null;

/* ── Utilidades ─────────────────────────────────────── */
function toast(msg, tipo="ok") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast " + (tipo === "ok" ? "ok-t" : "fail-t") + " show";
  setTimeout(() => el.classList.remove("show"), 3200);
}

function cerrarModal() {
  document.getElementById("modalFalla").classList.remove("open");
  pendingFallaSucId = null;
  document.getElementById("obsTexto").value = "";
}

function normOrden(value) {
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9 ]/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

/* ── Carga inicial ──────────────────────────────────── */
async function cargarSucursales() {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 20000);
  try {
    const res = await fetch("/api/pruebas-sonido/sucursales", { signal: controller.signal });
    if (!res.ok) throw new Error("Error " + res.status);
    sucursalesData = await res.json();
    renderizar();
  } catch(e) {
    const msg = e && e.name === "AbortError" ? "La carga demoró demasiado. Reintenta en unos segundos." : "Error al cargar sucursales.";
    document.getElementById("sections").innerHTML = `<div class="loading">${msg}</div>`;
  } finally {
    clearTimeout(timeout);
  }
}

/* ── Render ─────────────────────────────────────────── */
function renderizar() {
  // Stats
  const total = sucursalesData.length;
  const ok   = sucursalesData.filter(s => s.resultado === "exitoso").length;
  const solved = sucursalesData.filter(s => s.resultado === "falla" && s.odt_finalizada).length;
  const fail = sucursalesData.filter(s => s.resultado === "falla" && !s.odt_finalizada).length;
  const pend = total - ok - fail - solved;
  document.getElementById("stTotal").textContent = total;
  document.getElementById("stOk").textContent    = ok;
  document.getElementById("stFail").textContent  = fail;
  document.getElementById("stSolved").textContent = solved;
  document.getElementById("stPend").textContent  = pend;

  // Agrupar por semana y comuna respetando el orden geografico del backend.
  // Dentro de cada comuna, ordenar por direccion para facilitar la ruta tecnica.
  const semanas = [new Map(), new Map(), new Map(), new Map()];
  const ordenadas = [...sucursalesData].sort((a, b) => {
    const semanaA = Number(a.semana || 1);
    const semanaB = Number(b.semana || 1);
    if (semanaA !== semanaB) return semanaA - semanaB;
    const tieneOrdenA = a.orden_comuna !== undefined && a.orden_comuna !== null && a.orden_comuna !== "";
    const tieneOrdenB = b.orden_comuna !== undefined && b.orden_comuna !== null && b.orden_comuna !== "";
    if (tieneOrdenA && tieneOrdenB) {
      const comunaA = Number(a.orden_comuna);
      const comunaB = Number(b.orden_comuna);
      if (comunaA !== comunaB) return comunaA - comunaB;
    } else {
      const comunaCmp = normOrden(a.comuna).localeCompare(normOrden(b.comuna), "es", { numeric: true });
      if (comunaCmp !== 0) return comunaCmp;
    }
    const dirCmp = normOrden(a.orden_direccion || a.direccion).localeCompare(normOrden(b.orden_direccion || b.direccion), "es", { numeric: true });
    if (dirCmp !== 0) return dirCmp;
    return normOrden(a.nombre_sucursal).localeCompare(normOrden(b.nombre_sucursal), "es", { numeric: true });
  });

  for (const s of ordenadas) {
    const si = Math.min(3, Math.max(0, (Number(s.semana || 1) - 1)));
    const com = s.comuna || "Sin comuna";
    if (!semanas[si].has(com)) semanas[si].set(com, []);
    semanas[si].get(com).push(s);
  }

  const cont = document.getElementById("sections");
  cont.innerHTML = "";

  semanas.forEach((comunasMap, ci) => {
    const totalSem = Array.from(comunasMap.values()).reduce((a,b) => a + b.length, 0);
    const col = document.createElement("div");
    col.className = "section-col";
    col.innerHTML = `<div class="section-hdr">Semana ${ci+1} · ${totalSem} sucursales</div>`;

    for (const [com, subs] of comunasMap.entries()) {
      const grp = document.createElement("div");
      grp.className = "empresa-group";
      grp.innerHTML = `<div class="empresa-label">${com}</div>`;
      for (const s of subs) grp.appendChild(renderSucursal(s));
      col.appendChild(grp);
    }
    cont.appendChild(col);
  });
}

function renderSucursal(s) {
  const row = document.createElement("div");
  row.className = "suc-row";
  row.dataset.id = s.id;

  const estado = s.resultado;
  let badgeHtml = "";
  let acciones  = "";

  if (estado === "falla" && s.odt_finalizada) {
    badgeHtml = `<span class="badge solved">✓ Solucionado</span>`;
    if (s.incidencia_odt) badgeHtml += `<span class="badge solved" style="font-size:10px">ODT ${s.incidencia_odt}</span>`;
    acciones = `<button class="act-btn undo-btn" title="Deshacer" onclick="deshacerPrueba(${s.id},${s.prueba_id})">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h10a5 5 0 010 10H5"/><polyline points="7 3 3 7 7 11"/></svg>
    </button>`;
  } else if (estado === "exitoso") {
    badgeHtml = `<span class="badge ok">✓ Exitosa</span>`;
    acciones  = `<button class="act-btn undo-btn" title="Deshacer" onclick="deshacerPrueba(${s.id},${s.prueba_id})">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h10a5 5 0 010 10H5"/><polyline points="7 3 3 7 7 11"/></svg>
    </button>`;
  } else if (estado === "falla") {
    badgeHtml = `<span class="badge fail">✗ Falla</span>`;
    if (s.incidencia_odt) badgeHtml += `<span class="badge fail" style="font-size:10px">ODT ${s.incidencia_odt}</span>`;
    acciones  = `<button class="act-btn undo-btn" title="Deshacer" onclick="deshacerPrueba(${s.id},${s.prueba_id})">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h10a5 5 0 010 10H5"/><polyline points="7 3 3 7 7 11"/></svg>
    </button>`;
  } else {
    badgeHtml = `<span class="badge pend">Pendiente</span>`;
    acciones  = `
      <button class="act-btn ok-btn" title="Exitosa" onclick="marcarExitosa(${s.id})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <button class="act-btn fail-btn" title="No funciona" onclick="abrirModalFalla(${s.id},'${escHtml(s.nombre_sucursal)}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>`;
  }

  row.innerHTML = `
    <div class="suc-info">
      <div class="suc-nombre">${escHtml(s.nombre_sucursal)}</div>
      <div class="suc-dir">${escHtml(s.direccion || "Sin direccion registrada")}</div>
    </div>
    <div class="suc-badges">${badgeHtml}</div>
    ${acciones}`;
  return row;
}

function escHtml(t) {
  return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ── Acciones ───────────────────────────────────────── */
async function marcarExitosa(sucId) {
  try {
    const res = await fetch("/api/pruebas-sonido", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({sucursal_id: sucId, resultado:"exitoso", operador: obtenerOperador()})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Error");
    actualizarLocal(sucId, {resultado:"exitoso", prueba_id: data.prueba_id, odt_finalizada:false});
    renderizar();
    toast("✓ Prueba exitosa registrada" + (data.email_enviado ? " · Email enviado al cliente" : ""));
  } catch(e) {
    toast("Error: " + e.message, "fail");
  }
}

function abrirModalFalla(sucId, nombre) {
  pendingFallaSucId = sucId;
  document.getElementById("modalSucNombre").textContent = nombre;
  document.getElementById("obsTexto").value = "";
  document.getElementById("modalFalla").classList.add("open");
}

async function confirmarFalla() {
  if (!pendingFallaSucId) return;
  const sucId = pendingFallaSucId;
  const obs = document.getElementById("obsTexto").value.trim();
  if (!obs) { document.getElementById("obsTexto").style.borderColor = "rgba(220,38,38,.7)"; return; }
  cerrarModal();
  try {
    const res = await fetch("/api/pruebas-sonido", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({sucursal_id: sucId, resultado:"falla", observacion:obs, operador: obtenerOperador()})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Error");
    actualizarLocal(sucId, {resultado:"falla", prueba_id: data.prueba_id, incidencia_odt: data.incidencia_odt, odt_finalizada:false});
    renderizar();
    toast("Incidencia creada" + (data.incidencia_odt ? ` · ODT ${data.incidencia_odt}` : ""), "fail");
  } catch(e) {
    toast("Error: " + e.message, "fail");
  }
}

async function deshacerPrueba(sucId, pruebaId) {
  if (!pruebaId) return;
  try {
    const res = await fetch("/api/pruebas-sonido/" + pruebaId, {method:"DELETE"});
    if (!res.ok) throw new Error("Error al deshacer");
    actualizarLocal(sucId, {resultado: null, prueba_id: null, incidencia_odt: null, odt_finalizada:false});
    renderizar();
    toast("Prueba eliminada");
  } catch(e) {
    toast("Error: " + e.message, "fail");
  }
}

function actualizarLocal(sucId, cambios) {
  const idx = sucursalesData.findIndex(s => s.id === sucId);
  if (idx !== -1) Object.assign(sucursalesData[idx], cambios);
}

function obtenerOperador() {
  return document.querySelector("[data-operador]")?.dataset.operador || "";
}

// Cerrar modal con Escape
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarModal(); });

cargarSucursales();
</script>
<span data-operador="{{ tecnico|default('') }}" style="display:none"></span>
<script src="/static/auth-guard.js"></script>
  <script src="/static/atc-logo-home.js"></script>
  <script>
  </script>
<script src="/static/atc-volver.js"></script>
</body>
</html>
