<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seleccionar Area</title>
  <style>
    :root {
      --bg: #08161a;
      --bg-2: #10252c;
      --bg-3: #17363d;
      --panel: rgba(9, 18, 24, .88);
      --panel-2: rgba(255, 255, 255, .045);
      --line: rgba(255, 255, 255, .12);
      --text: #f4f8f9;
      --muted: #bed0d6;
      --accent: 190, 104, 48;
      --accent-2: #d8894f;
      --shadow: 0 28px 80px rgba(0, 0, 0, .42);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,.05), transparent 24%),
        radial-gradient(circle at 82% 12%, rgba(216,137,79,.08), transparent 20%),
        linear-gradient(145deg, var(--bg) 0%, var(--bg-2) 42%, var(--bg-3) 100%);
    }

    .shell {
      width: min(820px, 100%);
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .head {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 28px;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(540px 260px at 0% 0%, rgba(216, 137, 79, .13), transparent 70%),
        rgba(10, 18, 24, .58);
    }

    .logo {
      width: 114px;
      height: 72px;
      object-fit: contain;
      padding: 0;
      border-radius: 0;
      border: 0;
      background: transparent;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.08;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .body {
      padding: 26px;
      background: var(--panel);
    }

    .user {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 18px;
      padding: 0;
      border-radius: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
      text-align: right;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    form {
      --area-accent: var(--accent);
      margin: 0;
    }

    .area-soporte,
    .area-servicio-tecnico,
    .area-incidencias,
    .area-coordinacion,
    .area-venta,
    .area-finanzas,
    .area-administracion,
    .area-operaciones,
    .area-bitacora { --area-accent: var(--accent); }

    .card-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    button {
      width: 100%;
      min-height: 82px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid rgba(148, 163, 184, .18);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.032));
      color: inherit;
      padding: 16px 20px;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
      font: inherit;
    }

    button:hover {
      transform: translateY(-2px);
      border-color: rgba(var(--area-accent), .46);
      background: linear-gradient(135deg, rgba(190,104,48,.15), rgba(216,137,79,.09));
      box-shadow: 0 18px 34px rgba(0, 0, 0, .20);
    }

    .icon {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, rgb(var(--area-accent)), var(--accent-2));
      border: 1px solid rgba(255, 255, 255, .12);
      color: white;
      font-weight: 900;
      letter-spacing: 0;
      box-shadow: 0 14px 24px rgba(190, 104, 48, .12);
    }

    .title {
      display: block;
      font-size: 18px;
      font-weight: 850;
      margin: 0;
    }

    .foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 18px 26px;
      border-top: 1px solid var(--line);
      background: rgba(4, 12, 16, .48);
      color: var(--muted);
      font-size: 13px;
    }

    .logout {
      color: #dce7f7;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255,255,255,.04);
      font-weight: 700;
    }

    @media (max-width: 560px) {
      body { padding: 16px; }
      .head { align-items: flex-start; flex-direction: column; }
      h1 { font-size: 24px; }
      .grid { grid-template-columns: 1fr; }
      .foot { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="head">
      <img class="logo" src="/static/img/logo-atc.png" alt="ATC" />
      <div>
        <h1>Escoge donde quieres ingresar</h1>
        <p class="sub">Tu cuenta tiene mas de un acceso habilitado.</p>
      </div>
    </section>

    <section class="body">
      <div class="user">{{ user.name or user.username }}</div>
      <div class="grid">
        {% for area in areas %}
          {% if area.code != "protocolos" %}
          <form class="area-{{ area.code|replace('_', '-') }}" method="post" action="/seleccionar-area">
            <input type="hidden" name="area_code" value="{{ area.code }}" />
            <button type="submit">
              <span class="icon">{{ "OP" if area.code == "incidencias" else area.initials }}</span>
              <span class="title">{{ "Operadores" if area.code == "incidencias" else area.title }}</span>
            </button>
          </form>
          {% endif %}
        {% endfor %}
        {% if bitacora_enabled %}
          <div class="area-bitacora">
            <a class="card-link" href="/bitacora">
              <button type="button">
                <span class="icon">B</span>
                <span class="title">Bitacora</span>
              </button>
            </a>
          </div>
        {% endif %}
      </div>
    </section>

    <section class="foot">
      <a class="logout" href="/logout">Cerrar sesion</a>
    </section>
  </main>
</body>
</html>
