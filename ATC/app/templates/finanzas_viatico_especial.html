<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/favicon-180.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">

<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viatico Especial · Finanzas</title>
  <link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/finanzas_shared.css?v=20260813">
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed');</script>
<style>
.tope-edit{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.tope-edit input{width:124px;padding:7px 9px;border:1px solid var(--border-strong);border-radius:6px;font:inherit;font-size:12.5px;text-align:right;background:#fff;}
.tope-edit input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(29,78,216,.15);}
.tope-hint{font-size:11px;color:var(--text-muted);line-height:1.2;}
.cell-multi{white-space:pre-wrap;line-height:1.45;max-width:240px;font-size:12.5px;color:var(--text-soft);}
.flag-custom{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:600;}
.row-filled td{background:#fbfdff;}
.cell-code-input{width:240px;padding:7px 9px;border:1px solid var(--border-strong);border-radius:6px;font:inherit;background:#fff;}
.cell-code-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(29,78,216,.15);}
.cell-main{color:var(--text);font-weight:600;}
.cell-money{font-variant-numeric:tabular-nums;}
.cell-pay{background:#eefbf2 !important;color:#166534;font-weight:700;}
.toolbar-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
</style>
    <script src="/static/utils.js"></script>
</head>
<body>
<main class="shell">
  <header class="page-header">
    <div class="brand">
      <img src="/shared-static/img/logo-atc.png" alt="ATC" onerror="this.style.display='none'">
      <div>
        <h1>Viatico Especial</h1>
        <p class="subtitle">Viatico real vs tope asignado por codigo diario</p>
      </div>
    </div>
    <nav class="actions">
      <a class="btn" id="btnVolver" href="/venta/finanzas?token={{ token|default('') }}">Volver</a>
      <button class="btn" type="button" onclick="recargarFilas()">Actualizar</button>
    </nav>
  </header>

  <section class="panel">
    <div class="toolbar-inline">
      <button class="btn btn-primary btn-small" id="btnAgregar" type="button" onclick="agregarFila()" style="display:none;">Agregar</button>
    </div>
    <div class="sheet-note">Hoja "Viatico Especial": muestra los viaticos registrados como especiales desde Rendición.</div>
  </section>

  <section class="table-wrap">
    <table>
      <thead><tr>
        <th>Codigo</th><th>Tecnico</th><th>Fecha</th>
        <th>ODT</th><th>Cliente</th><th>Comuna</th>
        <th style="text-align:right;">Viatico Real</th>
        <th style="text-align:right;">Viatico Maximo</th>
        <th style="text-align:right;">A Pagar</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
</main>
<div id="toast"></div>
<script>
const tokenSesion = {{ token|tojson }};
let filaSeq = 0;
let filas = [crearFila()];
let buscarTimers = {};

function crearIdFila(){
  if (window.crypto && typeof window.crypto.randomUUID === "function") {
    return window.crypto.randomUUID();
  }
  filaSeq += 1;
  return `fila-${Date.now()}-${filaSeq}`;
}

function crearFila(){
  return { id: crearIdFila(), codigo:"", data:null, saving:false };
}
function crearFilaConData(data){
  return { id: crearIdFila(), codigo:data?.codigo || "", data:data || null, saving:false };
}
function $(id){return document.getElementById(id);}
function esc(t){const d=document.createElement("div");d.textContent=String(t||"");return d.innerHTML;}
function clp(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}):"$0";}
function showToast(t,ok=true){const el=$("toast");el.className=ok?"":"error";el.textContent=t;el.style.display="block";clearTimeout(showToast._id);showToast._id=setTimeout(()=>{el.style.display="none";},2800);}
function normalizarCodigo(valor){
  return String(valor || "")
    .normalize("NFKC")
    .replace(/[\u00a0\u2007\u202f\u200b\u200c\u200d\ufeff]/g, " ")
    .replace(/[\u2010\u2011\u2012\u2013\u2014\u2212]/g, "-")
    .replace(/\r?\n/g, " ")
    .replace(/\t/g, " ")
    .replace(/\s+/g, " ")
    .replace(/\s*-\s*/g, "-")
    .trim()
    .toUpperCase();
}
function dash(){return '<span class="dash">—</span>';}
function filaPorId(id){return filas.find((f)=>f.id===id);}
function actualizarBotonAgregar(){
  const mostrar = filas.some((f)=>f.data && f.codigo);
  $("btnAgregar").style.display = mostrar ? "inline-flex" : "none";
}
function agregarFila(){
  const ultima = filas[filas.length - 1];
  if (!ultima || ultima.codigo || ultima.data) {
    filas.push(crearFila());
    render();
  }
}
function bindCodeInput(input){
  const rowId = input.dataset.rowId;
  input.addEventListener("input", ()=>{
    const fila = filaPorId(rowId);
    if(!fila) return;
    fila.codigo = normalizarCodigo(input.value);
    input.value = fila.codigo;
    fila.data = null;
    clearTimeout(buscarTimers[rowId]);
    if(!fila.codigo){
      render();
      return;
    }
    buscarTimers[rowId] = setTimeout(()=>cargarFila(rowId), 250);
  });
  input.addEventListener("paste", ()=>{
    setTimeout(()=>{
      const fila = filaPorId(rowId);
      if(!fila) return;
      fila.codigo = normalizarCodigo(input.value);
      input.value = fila.codigo;
      fila.data = null;
      clearTimeout(buscarTimers[rowId]);
      if(!fila.codigo){
        render();
        return;
      }
      buscarTimers[rowId] = setTimeout(()=>cargarFila(rowId), 0);
    },0);
  });
  input.addEventListener("keydown",(ev)=>{
    if(ev.key==="Enter"){
      ev.preventDefault();
      clearTimeout(buscarTimers[rowId]);
      cargarFila(rowId);
    }
  });
}
function bindTopeInput(input){
  const rowId = input.dataset.rowId;
  input.addEventListener("change", ()=>guardarTope(rowId, input));
  input.addEventListener("blur", ()=>guardarTope(rowId, input));
  input.addEventListener("keydown", (ev)=>{
    if(ev.key==="Enter"){
      ev.preventDefault();
      input.blur();
    }
  });
}
function render(){
  if(!filas.length){
    $("tbody").innerHTML = `<tr><td class="empty-cell" colspan="9">No hay viáticos especiales registrados.</td></tr>`;
    actualizarBotonAgregar();
    return;
  }
  $("tbody").innerHTML = filas.map((fila)=>{
    const r = fila.data;
    return `
      <tr class="${r ? 'row-filled' : ''}">
        <td>
          <input
            type="text"
            value="${esc(fila.codigo || "")}"
            placeholder="Pega el codigo aqui"
            autocomplete="off"
            spellcheck="false"
            class="cell-code-input"
            data-row-id="${fila.id}"
          >
        </td>
        <td class="cell-main">${r ? esc(r.tecnico||"") : dash()}</td>
        <td class="cell-main">${r ? esc(r.fecha||"") : dash()}</td>
        <td>${r ? `<div class="cell-multi">${esc(r.odt||"")}</div>` : dash()}</td>
        <td>${r ? `<div class="cell-multi">${esc(r.cliente||"")}</div>` : dash()}</td>
        <td>${r ? `<div class="cell-multi">${esc(r.comuna||"")}</div>` : dash()}</td>
        <td class="right cell-money cell-main">${r ? esc(clp(r.viaticoReal)) : dash()}</td>
        <td class="right">
          ${r ? `
          <div class="tope-edit">
            <input type="number" min="0" step="100" value="${Number(r.viaticoMax||0)}" data-row-id="${fila.id}">
            <div class="tope-hint">Se guarda automaticamente${r.personalizado?'<span class="flag-custom">custom</span>':''}</div>
          </div>` : dash()}
        </td>
        <td class="right cell-money cell-pay">${r ? esc(clp(r.viaticoAPagar)) : dash()}</td>
      </tr>
    `;
  }).join("");
  document.querySelectorAll(".cell-code-input").forEach(bindCodeInput);
  document.querySelectorAll("input[type='number'][data-row-id]").forEach(bindTopeInput);
  actualizarBotonAgregar();
}
async function cargarFila(rowId){
  const fila = filaPorId(rowId);
  if(!fila) return;
  const codigo = normalizarCodigo(fila.codigo);
  fila.codigo = codigo;
  if(!codigo){
    fila.data = null;
    render();
    return;
  }
  try{
    const data = await api(`/api/finanzas/viatico-especial?codigo=${encodeURIComponent(codigo)}`);
    fila.data = Array.isArray(data)
      ? data.find((item) => normalizarCodigo(item?.codigo) === codigo) || null
      : null;
    if(!fila.data){
      showToast(`No existe coincidencia exacta para ${codigo}.`, false);
    } else if (!fila.data.personalizado || Number(fila.data.viaticoMax || 0) <= 0) {
      fila.data.personalizado = false;
      fila.data.viaticoMax = "";
      fila.data.viaticoAPagar = "";
    } else {
      const esUltima = filas[filas.length - 1]?.id === rowId;
      if (esUltima) {
        actualizarBotonAgregar();
      }
    }
    render();
  }catch(err){
    fila.data = null;
    render();
    showToast("Error: "+err.message,false);
  }
}
async function guardarTope(rowId,input){
  const fila = filaPorId(rowId);
  if(!fila || !fila.data || fila.saving) return;
  const raw = String(input.value ?? "").trim();
  const monto = raw === "" ? 0 : Number(raw);
  if(!Number.isFinite(monto) || monto < 0){showToast("Monto invalido",false);return;}
  if(monto !== 0 && Number(fila.data.viaticoMax) === monto) return;
  fila.saving = true;
  input.disabled = true;
  try{
    const tk = encodeURIComponent(tokenSesion||"");
    const resp = await api(`/api/finanzas/viatico-cap/${encodeURIComponent(fila.data.codigo)}?monto=${monto}&token=${tk}`,{method:"PATCH"});
    if(resp?.removed){
      filas = filas.filter((f)=>f.id !== rowId);
      if(!filas.length || filas[filas.length - 1].codigo || filas[filas.length - 1].data){
        filas.push(crearFila());
      }
      showToast(`Tope especial ${fila.data.codigo} eliminado.`);
      render();
      return;
    }
    fila.data.viaticoMax = monto;
    fila.data.viaticoAPagar = Math.min(Number(fila.data.viaticoReal || 0), monto);
    fila.data.personalizado = true;
    fila.saving = false;
    render();
    showToast(`Tope ${fila.data.codigo} actualizado a ${clp(monto)}`);
  }catch(err){
    fila.saving = false;
    input.disabled = false;
    showToast("Error: "+err.message,false);
  }
}
async function recargarFilas(){
  const activas = filas.filter((f)=>f.codigo);
  if(!activas.length){
    await cargarPersistidos();
    return;
  }
  for (const fila of activas){
    await cargarFila(fila.id);
  }
}
async function cargarPersistidos(){
  try{
    const data = await api(`/api/finanzas/viatico-especial?personalizados=true&_=${Date.now()}`, { cache:"no-store" });
    const persistidos = Array.isArray(data)
      ? data.filter((x)=>x?.codigo && x?.personalizado === true && Number(x?.viaticoMax || 0) > 0)
      : [];
    filas = persistidos.map(crearFilaConData);
    render();
  }catch(err){
    filas = [];
    render();
    showToast("Error cargando viaticos especiales: "+err.message,false);
  }
}
cargarPersistidos();
</script>
<script>
</script>
<script src="/static/auth-guard.js"></script>
  <script src="/static/atc-logo-home.js"></script>
<script src="/static/atc-volver.js"></script>
</body></html>
