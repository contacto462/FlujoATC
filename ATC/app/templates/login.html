<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/favicon-180.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar Sesión</title>
  <style>
    :root {
      --bg-1: #0a1c20;
      --bg-2: #10272d;
      --bg-3: #17363d;
      --panel-border: rgba(255, 255, 255, 0.10);
      --text-main: #f4f8f9;
      --text-soft: #c0cfd4;
      --field-bg: #091217;
      --field-border: rgba(194, 210, 218, 0.22);
      --field-focus: rgba(255, 117, 35, 0.65);
      --button-start: #ff6e23;
      --button-end: #ff8b33;
      --button-text: #ffffff;
      --shadow-main: rgba(0, 0, 0, 0.32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 18% 22%, rgba(255, 255, 255, 0.05), transparent 24%),
        radial-gradient(circle at 78% 12%, rgba(255, 125, 53, 0.08), transparent 18%),
        linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 42%, var(--bg-3) 100%);
      overflow: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 30% 65%, rgba(255, 255, 255, 0.03), transparent 28%),
        radial-gradient(circle at 76% 78%, rgba(255, 122, 43, 0.10), transparent 18%);
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      position: relative;
      z-index: 1;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 28px 28px 26px;
      border-radius: 28px;
      background: rgba(9, 22, 26, 0.96);
      border: 1px solid var(--panel-border);
      box-shadow:
        0 30px 70px var(--shadow-main),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .head {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 18px;
      margin-bottom: 24px;
    }

    .title-wrap {
      flex: 1;
      min-width: 0;
    }

    h2 {
      margin: 0;
      font-size: 2.05rem;
      line-height: 1.02;
      letter-spacing: -0.035em;
      font-weight: 800;
    }

    .login-title {
      transform: translateY(5px);
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    label {
      display: block;
      margin: 0 0 8px;
      font-size: 0.96rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #ffffff;
    }

    input, button {
      width: 100%;
      border-radius: 18px;
      font-size: 1rem;
      font-family: inherit;
    }

    input {
      border: 1px solid var(--field-border);
      background: var(--field-bg);
      color: var(--text-main);
      padding: 15px 16px;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }

    input::placeholder { color: #94a6ad; }

    input:focus {
      border-color: var(--field-focus);
      box-shadow: 0 0 0 4px rgba(255, 110, 35, 0.12);
      transform: translateY(-1px);
    }

    button {
      margin-top: 6px;
      padding: 15px 18px;
      border: none;
      color: var(--button-text);
      background: linear-gradient(135deg, var(--button-start) 0%, var(--button-end) 100%);
      font-weight: 800;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(255, 110, 35, 0.25);
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
      box-shadow: 0 16px 30px rgba(255, 110, 35, 0.32);
    }

    button:disabled {
      opacity: .72;
      cursor: wait;
      transform: none;
      filter: none;
    }

    .msg {
      min-height: 22px;
      margin-top: 12px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .ok { color: #59d48a; }
    .err { color: #ff8787; }

    @media (max-width: 640px) {
      .card {
        padding: 22px 18px 20px;
        border-radius: 24px;
      }

      .head {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      h2 { font-size: 1.78rem; }
      .login-title { transform: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <img src="/shared-static/img/logo-atc.png" alt="Logo ATC" style="height:64px;width:auto;display:block;object-fit:contain;flex-shrink:0;" />
        <h2 class="login-title">Iniciar Sesión</h2>
      </div>

      <div class="form-grid">
        <div>
          <label for="nombreTecnico">RUT</label>
          <input id="nombreTecnico" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" inputmode="text" maxlength="10" placeholder="Ej: 12345678-9 o 12345678-K" />
        </div>

        <div>
          <label for="claveTecnico">Clave</label>
          <input id="claveTecnico" type="password" autocomplete="current-password" placeholder="******" />
        </div>

        <button type="button" id="btnLogin">Entrar</button>
      </div>

      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script>
    const nextForm = {{ next_form|default("auto")|tojson }};

    // Al llegar al login (sesión cerrada o expirada) se limpian los borradores
    // locales de trabajo, p. ej. el registro de Cierre y Apertura.
    try {
      Object.keys(localStorage)
        .filter((k) => k.startsWith("cierreAperturaRegistros"))
        .forEach((k) => localStorage.removeItem(k));
    } catch (_) {}

    function setMsg(texto, ok) {
      const el = document.getElementById("msg");
      el.textContent = texto || "";
      el.className = `msg ${ok ? "ok" : "err"}`;
    }

    function generarToken() {
      if (window.crypto?.randomUUID) return crypto.randomUUID();
      return `tok_${Date.now()}_${Math.random().toString(36).slice(2)}`;
    }

    function limpiarSesionLocalAlEntrar() {
      localStorage.removeItem("atc_token");
      localStorage.removeItem("ATC_TOKEN");
      document.cookie = "atc_token=; path=/; max-age=0; samesite=lax";
    }

    const rutInput = document.getElementById("nombreTecnico");

    function formatearRutNumerico(valor) {
      const limpio = String(valor || "").toUpperCase().replace(/[^0-9K]/g, "");
      const soloDigitos = limpio.replace(/K/g, "");
      const tieneK = limpio.includes("K");
      if (tieneK) {
        const cuerpo = soloDigitos.slice(0, 8);
        if (!cuerpo) return "K";
        return `${cuerpo}-K`;
      }
      const cuerpo = soloDigitos.slice(0, 9);
      if (cuerpo.length <= 1) return cuerpo;
      return `${cuerpo.slice(0, -1)}-${cuerpo.slice(-1)}`;
    }

    function aplicarFormatoRut() {
      const formateado = formatearRutNumerico(rutInput.value);
      rutInput.value = formateado;
      requestAnimationFrame(() => {
        rutInput.setSelectionRange(formateado.length, formateado.length);
      });
    }

    async function login() {
      aplicarFormatoRut();
      const nombre = rutInput.value.trim();
      const clave = document.getElementById("claveTecnico").value;

      if (!nombre || !clave) {
        setMsg("Completa usuario y clave.", false);
        return;
      }

      const token = generarToken();
      const btn = document.getElementById("btnLogin");
      btn.disabled = true;
      btn.textContent = "Ingresando...";
      setMsg("", true);

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nombre_tecnico: nombre,
            clave,
            token,
            destino: nextForm,
          }),
        });

        const payload = await res.json();
        if (!res.ok || !payload?.success) {
          throw new Error(payload?.message || payload?.detail || "Credenciales inválidas");
        }

        const tokenGuardado = String(payload?.token || token || "").trim();
        if (tokenGuardado) {
          localStorage.setItem("atc_token", tokenGuardado);
          document.cookie = `atc_token=${encodeURIComponent(tokenGuardado)}; path=/; max-age=${60 * 60 * 18}; samesite=lax`;
        }
        setMsg("Ingreso correcto. Redirigiendo...", true);
        window.location.href = payload.redirect;
      } catch (err) {
        setMsg(err.message || "No se pudo iniciar sesión", false);
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    }

    limpiarSesionLocalAlEntrar();

    rutInput.addEventListener("keydown", (e) => {
      const teclasPermitidas = ["Backspace", "Delete", "Tab", "ArrowLeft", "ArrowRight", "Home", "End", "Enter"];
      if (teclasPermitidas.includes(e.key) || e.ctrlKey || e.metaKey) return;
      if (!/^\d$/.test(e.key) && e.key.toUpperCase() !== "K") e.preventDefault();
    });

    rutInput.addEventListener("input", aplicarFormatoRut);

    rutInput.addEventListener("paste", (e) => {
      e.preventDefault();
      rutInput.value = formatearRutNumerico(e.clipboardData?.getData("text") || "");
    });

    document.getElementById("btnLogin").addEventListener("click", login);
    document.getElementById("claveTecnico").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
