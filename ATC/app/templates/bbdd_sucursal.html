<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/favicon-180.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBDD Sucursales — ATC</title>
  <link rel="stylesheet" href="/static/base.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy-1: #0b1420;
      --navy-2: #162538;
      --navy-3: #1e3248;
      --orange: #ff7a2b;
      --orange-2: #ff9448;
      --bg: #f0f4f8;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --label: #374151;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    .page-header {
      position: sticky; top: 0; z-index: 50;
      background: linear-gradient(180deg, #0b1424 0%, #111c2f 100%);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 30px;
      min-height: 108px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      flex-shrink: 0;
    }
    .header-logo {
      height: 68px; width: auto; object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.30));
    }
    .header-title {
      flex: 1; color: #fff;
      font-size: 20px; font-weight: 700;
      letter-spacing: -.02em; line-height: 1.25;
    }
    .header-title small {
      display: block; font-size: 13.5px; font-weight: 500;
      color: rgba(255,255,255,.72); margin-top: 6px;
      letter-spacing: 0; line-height: 1.45;
    }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .session-user {
      display: inline-flex; align-items: center;
      min-height: 36px; padding: 0 4px;
      color: rgba(255,255,255,.92); font-size: 14px; font-weight: 600; white-space: nowrap;
    }
    .btn-back {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 14px; border-radius: 7px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.92); font-size: 13px; font-weight: 600;
      text-decoration: none; transition: background .15s, border-color .15s; white-space: nowrap;
    }
    .btn-back:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.22); }

    /* ── LAYOUT ── */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 320px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--label);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      transition: border-color .18s;
      outline: none;
    }
    .search-input:focus { border-color: var(--orange); }

    .sidebar-count {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .sidebar-item {
      padding: 11px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background .14s;
      margin-bottom: 2px;
    }
    .sidebar-item:hover { background: #f1f5f9; }
    .sidebar-item.active {
      background: linear-gradient(135deg, var(--navy-1), var(--navy-2));
      color: #fff;
    }

    .item-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sub {
      font-size: 11px;
      margin-top: 2px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-item.active .item-sub { color: rgba(255,255,255,.6); }

    .sidebar-empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── DETAIL PANEL ── */
    .detail-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 12px;
    }

    .detail-empty svg { opacity: .25; }
    .detail-empty p { font-size: 14px; }

    .detail-content {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px 40px;
    }

    .detail-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .detail-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--text);
    }

    .detail-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn-save {
      display: flex; align-items: center; gap: 7px;
      padding: 10px 20px; border-radius: 10px;
      background: var(--orange); border: none;
      color: #fff; font-size: 13px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      transition: background .18s, transform .12s, opacity .18s;
      white-space: nowrap;
    }
    .btn-save:hover { background: var(--orange-2); transform: translateY(-1px); }
    .btn-save:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .btn-avisar {
      display: flex; align-items: center; gap: 7px;
      padding: 10px 20px; border-radius: 10px;
      background: #fef3c7; border: 1px solid #fde68a;
      color: #92400e; font-size: 13px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      transition: background .18s, transform .12s, opacity .18s;
      white-space: nowrap;
    }
    .btn-avisar:hover { background: #fde68a; transform: translateY(-1px); }
    .btn-avisar:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .detail-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .btn-eliminar-sucursal {
      display: flex; align-items: center; gap: 7px;
      padding: 10px 20px; border-radius: 10px;
      background: #fee2e2; border: 1px solid #fecaca;
      color: #b91c1c; font-size: 13px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      transition: background .18s, transform .12s, opacity .18s;
      white-space: nowrap;
      margin-left: auto;
    }
    .btn-eliminar-sucursal:hover { background: #fecaca; transform: translateY(-1px); }
    .btn-eliminar-sucursal:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ── Campos marcados por Bitácora como "falta o está mal" ── */
    .bitacora-banner {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 12.5px;
      color: #92400e;
    }
    .bitacora-banner strong { font-weight: 700; }
    .bitacora-banner .fuera-pagina { color: #b45309; }

    /* ── Banner agregado: mis sucursales con avisos de Bitácora ── */
    .mis-pend-banner {
      margin: 16px 24px 0;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 14px 18px;
    }
    .mis-pend-head {
      font-size: 13.5px;
      color: #92400e;
      margin-bottom: 10px;
    }
    .mis-pend-list { display: flex; flex-direction: column; gap: 8px; }
    .mis-pend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fffefb;
      border: 1px solid #fde68a;
      border-radius: 9px;
      padding: 10px 14px;
      flex-wrap: wrap;
    }
    .mis-pend-item-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .mis-pend-item-title { font-size: 13.5px; font-weight: 700; color: #1f2937; }
    .mis-pend-item-empresa { font-size: 12px; color: #6b7280; }
    .mis-pend-item-campos { font-size: 12px; color: #92400e; }
    .mis-pend-item .btn-avisar { padding: 7px 14px; flex-shrink: 0; }
    .form-field.campo-marcado label { color: #b45309; font-weight: 700; }
    .form-field.campo-marcado input,
    .form-field.campo-marcado select,
    .form-field.campo-marcado .dias-wrap {
      border: 1.5px solid #f59e0b !important;
      background: #fffbeb;
      border-radius: var(--radius);
    }

    /* ── Popup "Avisar que está listo" ── */
    .avisar-modal-overlay {
      position: fixed; inset: 0; z-index: 40;
      display: none; align-items: center; justify-content: center;
      padding: 20px; background: rgba(11,20,32,.55);
    }
    .avisar-modal-overlay.is-open { display: flex; }
    .avisar-modal {
      width: min(480px, 100%);
      background: #fff; border-radius: 14px;
      padding: 24px 26px; box-shadow: 0 24px 60px rgba(11,20,32,.25);
    }
    .avisar-modal h3 { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .avisar-modal-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
    .avisar-resumen {
      display: flex; flex-direction: column; gap: 4px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 14px; margin-bottom: 14px; max-height: 180px; overflow-y: auto;
    }
    .avisar-resumen-row { font-size: 12.5px; color: var(--text); }
    .avisar-resumen-label { font-weight: 700; color: var(--muted); }
    .avisar-resumen-check {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 4px 0; cursor: pointer;
    }
    .avisar-resumen-check input[type="checkbox"] { margin-top: 2px; accent-color: var(--orange); cursor: pointer; }
    .avisar-modal textarea {
      width: 100%; padding: 9px 11px; font-size: 13px; font-family: inherit;
      border: 1px solid var(--border); border-radius: var(--radius); resize: vertical;
      min-height: 70px;
    }
    .avisar-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .avisar-modal-actions button {
      padding: 9px 18px; border-radius: 9px; font-size: 13px; font-weight: 700;
      font-family: inherit; cursor: pointer; border: none;
    }
    .avisar-modal-actions button:first-child { background: var(--bg); color: var(--muted); }
    .avisar-modal-actions .btn-save { background: var(--orange); color: #fff; }

    /* ── FORM GRID ── */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-field label {
      font-size: 11px;
      font-weight: 700;
      color: var(--label);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .form-field input {
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      transition: border-color .18s;
      outline: none;
    }
    .form-field input:focus { border-color: var(--orange); }
    .form-field input[readonly] {
      background: var(--bg);
      color: var(--muted);
      cursor: default;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 28px; right: 28px;
      padding: 12px 20px; border-radius: 12px;
      font-size: 13px; font-weight: 600;
      color: #fff; z-index: 200;
      transform: translateY(20px); opacity: 0;
      transition: transform .25s, opacity .25s;
      pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok { background: #16a34a; }
    .toast.err { background: #dc2626; }

    /* ── LOADING ── */
    .loading-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      gap: 10px;
    }

    .dias-wrap {
      display: flex; flex-wrap: wrap; gap: 6px 10px;
      padding: 8px 10px; border-radius: 10px;
      border: 1.5px solid var(--border); background: #fafbfc;
    }
    .dia-label {
      font-size: 12.5px; font-weight: 500; color: var(--text);
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      padding: 3px 6px; border-radius: 6px; transition: background .14s;
    }
    .dia-label:hover { background: #f1f5f9; }
    .dia-label input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 15px; height: 15px; flex-shrink: 0;
      border: 2px solid #cbd5e1; border-radius: 4px;
      background: #fff; cursor: pointer; position: relative;
      transition: border-color .15s, background .15s;
    }
    .dia-label input[type="checkbox"]:checked { background: var(--orange); border-color: var(--orange); }
    .dia-label input[type="checkbox"]:checked::after {
      content: ''; position: absolute; left: 50%; top: 45%;
      width: 4px; height: 8px;
      border: 2px solid #fff; border-top: none; border-left: none;
      transform: translate(-50%, -50%) rotate(45deg);
    }
    select { width: 100%; padding: 9px 12px; font-size: 13px; font-family: inherit;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: #fff; color: var(--text); cursor: pointer;
      transition: border-color .18s; outline: none; }
    select:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,122,43,.1); }
    input[type="time"] { width: 100%; padding: 9px 12px; font-size: 13px; font-family: inherit;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: #fff; color: var(--text); outline: none; transition: border-color .18s; }
    input[type="time"]:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,122,43,.1); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid var(--border);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
  </style>
</head>
<body>

  <header class="page-header">
    <img class="header-logo" src="/shared-static/img/logo-atc.png" alt="ATC" onerror="this.style.display='none'">
    <div class="header-title">
      Base de Datos — Sucursales
      <small>Consulta y edición de sucursales registradas</small>
    </div>
    <div class="header-actions">
      <div class="session-user" id="usuarioActual">Cargando...</div>
      <a id="btnVolver" href="#" class="btn-back">Volver</a>
    </div>
  </header>

  <div id="misPendientesBanner"></div>

  <div class="workspace" id="workspace">
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      Cargando sucursales…
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="avisar-modal-overlay" id="avisarModalOverlay">
    <div class="avisar-modal">
      <h3>Avisar que está listo</h3>
      <p class="avisar-modal-sub">Se le avisa al equipo de Bitácora que ya corregiste esta sucursal.</p>
      <p class="avisar-modal-sub" id="avisarFirma" style="margin-top:-10px;"></p>
      <div id="avisarResumenCampos" class="avisar-resumen"></div>
      <label class="field-label-sm">Observación (opcional)</label>
      <textarea id="avisarObsInput" placeholder="Cualquier detalle adicional…"></textarea>
      <div class="avisar-modal-actions">
        <button type="button" onclick="cerrarModalAvisar()">Cancelar</button>
        <button type="button" class="btn-save" id="avisarConfirmarBtn" onclick="confirmarAvisarListo()">Enviar aviso</button>
      </div>
    </div>
  </div>

  <script>
    const qsToken = new URLSearchParams(window.location.search).get("token") || "";
    const withToken = (url) => {
      const sep = url.includes("?") ? "&" : "?";
      return qsToken ? `${url}${sep}token=${encodeURIComponent(qsToken)}` : url;
    };
    document.getElementById("btnVolver").href = withToken("/venta/panel-selector");


    async function cargarUsuarioActual() {
      const el = document.getElementById("usuarioActual");
      if (!el) return;
      try {
        const response = await fetch(`/api/venta/usuario-actual?token=${encodeURIComponent(qsToken)}`);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data?.detail || "No se pudo cargar el usuario actual.");
        const nombre = String(data?.usuario || data?.nombre || data?.username || "").trim();
        el.textContent = nombre || "Sesión activa";
      } catch (_err) {
        el.textContent = "Sesión activa";
      }
    }

    let allHeaders = [];
    let allRows = [];
    let activeRowIndex = null;

    /* ── TOAST ── */
    let toastTimer = null;
    function showToast(msg, type = "ok") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = `toast ${type} show`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.classList.remove("show"); }, 3000);
    }

    /* ── INIT ── */
    async function init() {
      try {
        const res = await fetch(withToken("/api/venta/sucursales/tabla"));
        if (!res.ok) throw new Error("No se pudo cargar la tabla de sucursales.");
        const data = await res.json();
        allHeaders = data.headers || [];
        allRows = data.rows || [];
        buildUI();
      } catch (e) {
        document.getElementById("workspace").innerHTML =
          `<div class="loading-state" style="color:#dc2626">${e.message}</div>`;
      }
    }

    /* ── BUILD UI ── */
    function buildUI() {
      const ws = document.getElementById("workspace");
      ws.innerHTML = `
        <aside class="sidebar">
          <div class="sidebar-header">
            <div class="sidebar-title">Sucursales</div>
            <input class="search-input" id="searchInput" type="text" placeholder="Buscar por empresa, sucursal, RUT…" autocomplete="off">
            <div class="sidebar-count" id="sidebarCount"></div>
          </div>
          <div class="sidebar-list" id="sidebarList"></div>
        </aside>
        <div class="detail-panel" id="detailPanel">
          <div class="detail-empty" id="detailEmpty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <p>Selecciona una sucursal para editarla</p>
          </div>
          <div class="detail-content" id="detailContent" style="display:none"></div>
        </div>
      `;
      document.getElementById("searchInput").addEventListener("input", filtrarLista);
      renderList(allRows);
    }

    /* ── RENDER LIST ── */
    function renderList(rows) {
      const list = document.getElementById("sidebarList");
      const count = document.getElementById("sidebarCount");
      list.innerHTML = "";

      if (!rows.length) {
        list.innerHTML = '<div class="sidebar-empty">Sin resultados</div>';
        count.textContent = "";
        return;
      }

      count.textContent = `${rows.length} sucursal${rows.length !== 1 ? "es" : ""}`;

      rows.forEach((row) => {
        const originalIndex = allRows.indexOf(row);
        /* headers: [id, rut_empresa, nombre_empresa, nombre_sucursal, direccion, ...] */
        const empresa = String(row[2] || "—");
        const sucursal = String(row[3] || "—");
        const rut = String(row[1] || "");

        const item = document.createElement("div");
        item.className = "sidebar-item" + (originalIndex === activeRowIndex ? " active" : "");
        item.dataset.index = originalIndex;
        item.innerHTML = `
          <div class="item-name">${sucursal}</div>
          <div class="item-sub">${empresa}${rut ? " · " + rut : ""}</div>
        `;
        item.addEventListener("click", () => selectSucursal(originalIndex));
        list.appendChild(item);
      });
    }

    /* ── FILTER ── */
    function filtrarLista() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      if (!q) { renderList(allRows); return; }
      const filtered = allRows.filter(row => {
        return [1, 2, 3, 4].some(i => String(row[i] || "").toLowerCase().includes(q));
      });
      renderList(filtered);
    }

    /* ── SELECT ── */
    function selectSucursal(index) {
      activeRowIndex = index;
      document.querySelectorAll(".sidebar-item").forEach(el => {
        el.classList.toggle("active", Number(el.dataset.index) === index);
      });
      renderDetail(index);
    }

    /* ── FIELD TYPE MAP ── */
    // 0=ID 1=RUT* 2=NombreEmpresa* 3=NombreSucursal 4=Direccion 5=Region 6=Comuna
    // 7=ReferenciaUbicacion 8=ProveedorInternet 9=ProveedorElectricidad 10=NroClienteElectricidad
    // 11=HorarioApertura 12=HorarioCierre 13=DiasFuncionamiento 14=LatitudLongitud
    // 15=EmailEnvioFacturas 16=NombreEmergencia
    // * = readonly (not updated by API)
    const SUCU_READONLY = new Set([0, 1, 2]);
    const SUCU_FIELD_TYPES = {
      5:  'select-region',
      6:  'select-comuna',
      8:  'select-internet',
      9:  'select-electricidad',
      11: 'time',
      12: 'time',
      13: 'dias',
      15: 'email',
    };
    const DIAS_SEMANA = ["Lunes","Martes","Miercoles","Jueves","Viernes","Sabado","Domingo"];

    function buildSucuField(index, j, header, val) {
      const id = `field-${index}-${j}`;
      const base = `id="${id}" data-original="${escHtml(val)}" data-col="${j}"`;
      const ft = SUCU_FIELD_TYPES[j];

      if (SUCU_READONLY.has(j)) {
        return `<input type="text" ${base} value="${escHtml(val)}" readonly>`;
      }
      if (ft === 'select-region' || ft === 'select-comuna' || ft === 'select-internet' || ft === 'select-electricidad') {
        const onChange = ft === 'select-region'
          ? `onchange="onSucuRegionChange(${index})"` : "";
        return `<select ${base} ${onChange}><option value="${escHtml(val)}">${escHtml(val)||'Cargando...'}</option></select>`;
      }
      if (ft === 'time') {
        return `<input type="time" ${base} value="${escHtml(val)}">`;
      }
      if (ft === 'dias') {
        const checked = val.split(',').map(d => d.trim());
        const boxes = DIAS_SEMANA.map(d =>
          `<label class="dia-label"><input type="checkbox" value="${d}" ${checked.includes(d)?'checked':''}> ${d}</label>`
        ).join('');
        return `<div id="${id}" class="dias-wrap" data-original="${escHtml(val)}">${boxes}</div>`;
      }
      if (ft === 'email') {
        return `<input type="email" ${base} value="${escHtml(val)}">`;
      }
      return `<input type="text" ${base} value="${escHtml(val)}">`;
    }

    /* ── RENDER DETAIL ── */
    function renderDetail(index) {
      const row = allRows[index];
      const empty = document.getElementById("detailEmpty");
      const content = document.getElementById("detailContent");
      empty.style.display = "none";
      content.style.display = "block";

      const sucursalName = String(row[3] || "Sucursal");
      const empresaName = String(row[2] || "");

      const fields = allHeaders.map((header, j) => {
        const val = row[j] !== null && row[j] !== undefined ? String(row[j]) : "";
        return `
          <div class="form-field" data-field-col="${j}">
            <label>${escHtml(header)}</label>
            ${buildSucuField(index, j, header, val)}
          </div>`;
      }).join("");

      content.innerHTML = `
        <div class="detail-topbar">
          <div>
            <div class="detail-title">${escHtml(sucursalName)}</div>
            <div class="detail-sub">${escHtml(empresaName)}</div>
          </div>
          <div class="detail-actions">
            <button class="btn-avisar" id="btnAvisarListo" onclick="avisarSucursalLista(${index})" title="Avisar a Bitácora que ya corregiste lo que faltaba" style="display:none;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
              Avisar que está listo
            </button>
            <button class="btn-eliminar-sucursal" id="btnEliminarSucursal" onclick="eliminarSucursal(${index})" title="Eliminar esta sucursal">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
              Eliminar sucursal
            </button>
          </div>
        </div>
        <div id="bitacoraBanner"></div>
        <div class="form-grid">${fields}</div>
      `;

      // async load selects
      const regionVal = String(row[5]||''), comunaVal = String(row[6]||'');
      loadSucuRegiones(`field-${index}-5`, regionVal, index, comunaVal);
      loadSucuProveedores(`field-${index}-8`, '/api/venta/proveedores/internet', 'proveedores', String(row[8]||''));
      loadSucuProveedores(`field-${index}-9`, '/api/venta/proveedores/electricidad', 'proveedores', String(row[9]||''));
      cargarRevisionBitacora(index);
      bindAutoSaveSucursal(index);
    }

    /* ── ELIMINAR SUCURSAL: borrado real (no deshabilitar) — arrastra
       contactos de emergencia, personas autorizadas, guardias e info
       extra asociados (pedido explicito, ago 2026). ── */
    async function eliminarSucursal(index) {
      const row = allRows[index];
      if (!row) return;
      const nombre = String(row[3] || "esta sucursal");
      const empresa = String(row[2] || "");
      const confirmado = confirm(
        `¿Eliminar "${nombre}"${empresa ? ` (${empresa})` : ""}?\n\n` +
        "Se borran también sus contactos de emergencia, personas autorizadas y guardias asociados. Esta acción no se puede deshacer."
      );
      if (!confirmado) return;

      const id = row[0];
      const btn = document.getElementById("btnEliminarSucursal");
      if (btn) { btn.disabled = true; btn.textContent = "Eliminando…"; }
      try {
        const res = await fetch(withToken(`/api/venta/sucursales/${encodeURIComponent(id)}`), { method: "DELETE" });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: "Error al eliminar." }));
          throw new Error(typeof err.detail === "string" ? err.detail : "Error al eliminar.");
        }
        allRows.splice(index, 1);
        activeRowIndex = null;
        document.getElementById("detailContent").style.display = "none";
        document.getElementById("detailEmpty").style.display = "";
        filtrarLista();
        showToast("Sucursal eliminada.", "ok");
      } catch (e) {
        showToast(e.message || "Error al eliminar.", "err");
        if (btn) { btn.disabled = false; btn.innerHTML = 'Eliminar sucursal'; }
      }
    }

    /* ── AUTO-GUARDADO: cada campo se guarda solo al perder el foco / cambiar,
       ya no hay botón "Guardar cambios" — mismo criterio que Información
       Cliente (doble clic + guardado automático). ── */
    function bindAutoSaveSucursal(index) {
      allHeaders.forEach((header, j) => {
        if (j === 0 || SUCU_READONLY.has(j)) return;
        if (SUCU_FIELD_TYPES[j] === 'dias') {
          const wrap = document.getElementById(`field-${index}-${j}`);
          wrap?.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
            cb.addEventListener('change', () => guardarSucursal(index));
          });
          return;
        }
        const el = document.getElementById(`field-${index}-${j}`);
        el?.addEventListener('change', () => guardarSucursal(index));
      });
    }

    /* ── REVISIÓN BITÁCORA: qué marcó como falta/mal, resaltar y mostrar botón ── */
    // Solo las claves que tienen una columna editable en esta página; el resto
    // (plan_cuadrante, cámaras, códigos, teléfonos, internet ATC, personas
    // autorizadas) viven en Información Clientes — se avisan en el banner, no acá.
    // "Contacto de emergencia" NO está acá: el campo NombreEmergencia (col 16) de
    // esta página es solo un nombre suelto, no el registro completo (teléfono, rut,
    // email). El registro real se agrega/corrige en Información Clientes — por eso
    // ese campo se trata como "de la otra página" aunque exista una columna acá.
    const SUCU_CAMPO_A_COL = {
      direccion_sucursal: 4,
      referencia_ubicacion: 7,
      proveedor_internet_cliente: 8,
      compania_electricidad: 9,
      numero_cliente_electricidad: 10,
      horario_apertura: 11,
      horario_cierre: 12,
      horario_habil: 13,
      latitud_longitud: 14,
      email_facturas: 15,
    };
    const SUCU_CAMPO_LABEL = {
      direccion_sucursal: "Dirección",
      latitud_longitud: "Latitud, Longitud",
      referencia_ubicacion: "Referencia ubicación",
      email_facturas: "Correo",
      horario_apertura: "Horario de apertura",
      horario_cierre: "Horario de cierre",
      horario_habil: "Días hábiles",
      compania_electricidad: "Compañía electricidad",
      numero_cliente_electricidad: "N° cliente electricidad",
      proveedor_internet_cliente: "Proveedor internet cliente",
      contacto: "Contacto",
      contactos_emergencia: "Contacto de emergencia",
      plan_cuadrante: "Plan cuadrante",
      carabineros: "Carabineros",
      bomberos: "Bomberos",
      seguridad_ciudadana: "Seguridad ciudadana",
      camaras_contratadas: "Cámaras a instalar",
      camaras_televigiladas: "Cámaras televigiladas",
      codigo_p2p: "Código P2P",
      codigo_dss: "Código DSS",
      telefono_porton: "Teléfono portón",
      telefono_recepcion: "Teléfono recepción",
      internet_atc: "Internet ATC",
      personas_autorizadas: "Personas autorizadas",
    };

    let sucursalRevisionCache = {};

    async function cargarRevisionBitacora(index) {
      const row = allRows[index];
      const rowId = Number(row[0]);
      const btnAvisar = document.getElementById("btnAvisarListo");
      const banner = document.getElementById("bitacoraBanner");
      try {
        const res = await fetch(withToken(`/api/venta/sucursales/${rowId}/revision-bitacora`));
        if (!res.ok) return;
        const data = await res.json();
        // el usuario pudo cambiar de sucursal mientras esta llamada estaba en vuelo
        if (activeRowIndex !== index) return;
        sucursalRevisionCache[rowId] = data;

        document.querySelectorAll(".form-field.campo-marcado").forEach(el => el.classList.remove("campo-marcado"));
        const campos = data.campos || [];
        if (btnAvisar) btnAvisar.style.display = (data.pendiente && campos.length) ? "flex" : "none";
        const enEstaPagina = [];
        const enOtraPagina = [];
        campos.forEach(campo => {
          const col = SUCU_CAMPO_A_COL[campo];
          if (col !== undefined) {
            enEstaPagina.push(campo);
            const field = document.querySelector(`.form-field[data-field-col="${col}"]`);
            if (field) field.classList.add("campo-marcado");
          } else {
            enOtraPagina.push(campo);
          }
        });
        data.enEstaPagina = enEstaPagina;
        data.enOtraPagina = enOtraPagina;

        if (data.pendiente && campos.length) {
          const partes = [];
          if (data.observacion) {
            partes.push(`<div>Observación de Bitácora: "${escHtml(data.observacion)}"</div>`);
          }
          banner.innerHTML = `<div class="bitacora-banner">${partes.join("")}</div>`;
        } else {
          banner.innerHTML = "";
        }
      } catch (e) {
        // silencioso: no bloquea la edición si esto falla
      }
    }

    function getDiasValue(index) {
      const wrap = document.getElementById(`field-${index}-13`);
      if (!wrap) return '';
      return Array.from(wrap.querySelectorAll('input:checked')).map(cb => cb.value).join(', ');
    }

    function escHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    /* ── CATALOG LOADERS ── */
    async function loadSucuRegiones(selId, currentRegion, index, currentComuna) {
      const sel = document.getElementById(selId);
      if (!sel) return;
      try {
        const res = await fetch(withToken('/api/venta/catalogo/regiones'));
        if (!res.ok) throw new Error("No se pudo cargar regiones");
        const data = await res.json();
        const regiones = Array.isArray(data.regiones) ? data.regiones : [];
        if (!regiones.length) throw new Error("Catalogo de regiones vacio");
        const opts = regiones.map(r =>
          `<option value="${escHtml(r)}"${r===currentRegion?' selected':''}>${escHtml(r)}</option>`
        ).join('');
        sel.innerHTML = `<option value="">Seleccionar región</option>${opts}`;
        if (currentRegion) sel.value = currentRegion;
        sel.dataset.original = currentRegion;
      } catch { sel.innerHTML = `<option value="${escHtml(currentRegion)}">${escHtml(currentRegion)||'No se pudieron cargar regiones'}</option>`; }
      if (currentRegion) loadSucuComunas(`field-${index}-6`, currentRegion, currentComuna);
    }

    async function loadSucuComunas(selId, region, currentComuna) {
      const sel = document.getElementById(selId);
      if (!sel) return;
      sel.innerHTML = '<option value="">Cargando...</option>';
      if (!region) { sel.innerHTML = '<option value="">Selecciona región primero</option>'; return; }
      try {
        const res = await fetch(withToken(`/api/venta/catalogo/comunas?region=${encodeURIComponent(region)}`));
        if (!res.ok) throw new Error("No se pudo cargar comunas");
        const data = await res.json();
        const comunas = Array.isArray(data.comunas) ? data.comunas : [];
        if (!comunas.length) throw new Error("Catalogo de comunas vacio");
        const opts = comunas.map(c =>
          `<option value="${escHtml(c)}"${c===currentComuna?' selected':''}>${escHtml(c)}</option>`
        ).join('');
        sel.innerHTML = `<option value="">Seleccionar comuna</option>${opts}`;
        if (currentComuna) sel.value = currentComuna;
        sel.dataset.original = currentComuna;
      } catch { sel.innerHTML = `<option value="${escHtml(currentComuna)}">${escHtml(currentComuna)||'No se pudieron cargar comunas'}</option>`; }
    }

    function onSucuRegionChange(index) {
      const regionSel = document.getElementById(`field-${index}-5`);
      if (!regionSel) return;
      loadSucuComunas(`field-${index}-6`, regionSel.value, '');
    }

    async function loadSucuProveedores(selId, endpoint, key, currentVal) {
      const sel = document.getElementById(selId);
      if (!sel) return;
      try {
        const res = await fetch(withToken(endpoint));
        const data = await res.json();
        const opts = (data[key] || []).map(p =>
          `<option value="${escHtml(p)}"${p===currentVal?' selected':''}>${escHtml(p)}</option>`
        ).join('');
        sel.innerHTML = `<option value="">Seleccionar</option>${opts}`;
        if (currentVal) sel.value = currentVal;
        sel.dataset.original = currentVal;
      } catch { sel.innerHTML = `<option value="${escHtml(currentVal)}">${escHtml(currentVal)||'Error'}</option>`; }
    }

    /* ── SAVE ── */
    async function guardarSucursal(index) {
      const row = allRows[index];
      const rowId = Number(row[0]);
      const values = [String(rowId)];

      allHeaders.forEach((header, j) => {
        if (j === 0) return;
        if (SUCU_FIELD_TYPES[j] === 'dias') {
          values.push(getDiasValue(index));
        } else {
          const el = document.getElementById(`field-${index}-${j}`);
          values.push(el ? el.value : String(row[j] || ""));
        }
      });

      try {
        const res = await fetch(withToken("/api/venta/sucursales/tabla/guardar-fila"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ row_id: rowId, values })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: "Error al guardar" }));
          throw new Error(typeof err.detail === "string" ? err.detail : "Error al guardar");
        }

        /* update local data */
        allHeaders.forEach((_, j) => {
          if (j === 0) return;
          if (SUCU_FIELD_TYPES[j] === 'dias') {
            const wrap = document.getElementById(`field-${index}-13`);
          if (wrap) { allRows[index][j] = getDiasValue(index); wrap.dataset.original = getDiasValue(index); }
        } else {
          const el = document.getElementById(`field-${index}-${j}`);
            if (el) { allRows[index][j] = el.value; el.dataset.original = el.value; }
        }
        });

        showToast("Cambios guardados correctamente", "ok");

        const updatedItem = document.querySelector(`.sidebar-item[data-index="${index}"]`);
        if (updatedItem) {
          updatedItem.querySelector(".item-name").textContent = String(allRows[index][3] || "—");
          updatedItem.querySelector(".item-sub").textContent =
            String(allRows[index][2] || "—") + (allRows[index][1] ? " · " + allRows[index][1] : "");
        }
      } catch (e) {
        showToast(e.message || "Error al guardar", "err");
      }
    }

    let avisarSucursalIndexActual = null;

    function primerNombreUsuarioActual() {
      const texto = (document.getElementById("usuarioActual")?.textContent || "").trim();
      if (!texto || texto === "Cargando..." || texto === "Sesión activa") return "";
      return texto.split(/\s+/).filter(Boolean)[0] || "";
    }

    function avisarSucursalLista(index) {
      avisarSucursalIndexActual = index;
      const row = allRows[index];
      const rowId = Number(row[0]);
      // Solo lo corregible en esta página — lo de Información Clientes no se
      // ofrece acá para no avisar por algo que no se tocó desde acá.
      const campos = (sucursalRevisionCache[rowId] || {}).enEstaPagina || [];
      const resumenDiv = document.getElementById("avisarResumenCampos");
      if (campos.length) {
        resumenDiv.innerHTML = campos.map(campo => {
          const col = SUCU_CAMPO_A_COL[campo];
          const label = SUCU_CAMPO_LABEL[campo] || campo;
          const valor = col !== undefined ? (String(row[col] || "").trim() || "-") : "-";
          return `<label class="avisar-resumen-row avisar-resumen-check">
            <input type="checkbox" data-avisar-campo="${escHtml(campo)}" checked />
            <span><span class="avisar-resumen-label">${escHtml(label)}:</span> ${escHtml(valor)}</span>
          </label>`;
        }).join("");
      } else {
        resumenDiv.innerHTML = '<div class="avisar-resumen-row">Bitácora no marcó campos de esta página.</div>';
      }
      const nombre = primerNombreUsuarioActual();
      const firmaDiv = document.getElementById("avisarFirma");
      if (firmaDiv) firmaDiv.textContent = nombre ? `Vas a avisar como ${nombre}.` : "";
      document.getElementById("avisarObsInput").value = "";
      document.getElementById("avisarModalOverlay").classList.add("is-open");
    }

    function cerrarModalAvisar() {
      document.getElementById("avisarModalOverlay").classList.remove("is-open");
      avisarSucursalIndexActual = null;
    }

    async function confirmarAvisarListo() {
      if (avisarSucursalIndexActual === null) return;
      const index = avisarSucursalIndexActual;
      const row = allRows[index];
      const rowId = Number(row[0]);
      const mensaje = document.getElementById("avisarObsInput").value.trim();
      const campos = Array.from(
        document.querySelectorAll("#avisarResumenCampos input[data-avisar-campo]:checked")
      ).map(i => i.dataset.avisarCampo);
      const btn = document.getElementById("avisarConfirmarBtn");
      btn.disabled = true;
      btn.textContent = "Enviando…";
      try {
        const res = await fetch(withToken(`/api/venta/sucursales/${rowId}/avisar-listo`), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensaje, campos })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "No se pudo enviar el aviso.");
        cerrarModalAvisar();
        showToast(`Aviso enviado a Bitácora (${(data.enviado_a || []).length} destinatario${(data.enviado_a || []).length === 1 ? "" : "s"}).`, "ok");
        if (activeRowIndex === index) cargarRevisionBitacora(index);
      } catch (e) {
        showToast(e.message || "No se pudo enviar el aviso.", "err");
      } finally {
        btn.disabled = false;
        btn.textContent = "Enviar aviso";
      }
    }

    /* ── Banner agregado: mis sucursales con avisos de Bitácora ── */
    const CAMPO_LABELS_BANNER = {
      direccion_sucursal: "Dirección",
      latitud_longitud: "Latitud, Longitud",
      referencia_ubicacion: "Referencia ubicación",
      contacto: "Contacto",
      horario_apertura: "Horario de apertura",
      horario_cierre: "Horario de cierre",
      horario_habil: "Días hábiles",
      telefono_porton: "Teléfono portón",
      telefono_recepcion: "Teléfono recepción",
      compania_electricidad: "Compañía electricidad",
      numero_cliente_electricidad: "N° cliente electricidad",
      proveedor_internet_cliente: "Proveedor internet cliente",
      internet_atc: "Internet ATC",
      contactos_emergencia: "Contacto de emergencia",
      personas_autorizadas: "Personas autorizadas",
    };

    async function cargarMisPendientesBitacora() {
      const cont = document.getElementById("misPendientesBanner");
      if (!cont) return;
      try {
        const res = await fetch(withToken("/api/venta/sucursales/mis-pendientes-bitacora"));
        if (!res.ok) return;
        const data = await res.json();
        const pendientes = data.pendientes || [];
        if (!pendientes.length) { cont.innerHTML = ""; return; }
        cont.innerHTML = `
          <div class="mis-pend-banner">
            <div class="mis-pend-head">
              <strong>Bitácora marcó ${pendientes.length} sucursal${pendientes.length !== 1 ? "es" : ""} tuya${pendientes.length !== 1 ? "s" : ""} con información pendiente</strong>
            </div>
            <div class="mis-pend-list">
              ${pendientes.map((p) => `
                <div class="mis-pend-item">
                  <div class="mis-pend-item-info">
                    <span class="mis-pend-item-title">${escHtml(p.nombre_sucursal || "-")}</span>
                    <span class="mis-pend-item-empresa">${escHtml(p.nombre_empresa || "-")}</span>
                    <span class="mis-pend-item-campos">Falta: ${(p.campos || []).map((c) => escHtml(CAMPO_LABELS_BANNER[c] || c)).join(", ")}</span>
                  </div>
                  <button type="button" class="btn-avisar" data-ir-sucursal="${p.sucursal_id}">Revisar</button>
                </div>
              `).join("")}
            </div>
          </div>
        `;
        cont.querySelectorAll("[data-ir-sucursal]").forEach((btn) => {
          btn.addEventListener("click", () => irASucursalPendiente(Number(btn.dataset.irSucursal)));
        });
      } catch (_) {}
    }

    function irASucursalPendiente(sucursalId) {
      const index = allRows.findIndex((row) => Number(row[0]) === sucursalId);
      if (index === -1) return;
      const searchInput = document.getElementById("searchInput");
      if (searchInput) searchInput.value = "";
      renderList(allRows);
      selectSucursal(index);
      document.getElementById("detailPanel")?.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    document.addEventListener("DOMContentLoaded", () => {
      cargarUsuarioActual();
      init().then(cargarMisPendientesBitacora);
    });
  </script>
<script src="/static/auth-guard.js"></script>
  <script src="/static/atc-logo-home.js"></script>
<script src="/static/atc-volver.js"></script>
