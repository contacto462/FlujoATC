<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seleccionar Area</title>
  <style>
    :root {
      --bg: #08111f;
      --bg-2: #111827;
      --panel: rgba(15, 23, 42, .88);
      --panel-2: rgba(255, 255, 255, .045);
      --line: rgba(148, 163, 184, .22);
      --text: #e8eef8;
      --muted: #9fb0c8;
      --accent: 54, 95, 141;
      --shadow: 0 28px 80px rgba(0, 0, 0, .42);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 520px at 18% 0%, rgba(54, 95, 141, .18), transparent 62%),
        radial-gradient(760px 460px at 95% 12%, rgba(45, 111, 106, .12), transparent 58%),
        linear-gradient(180deg, var(--bg), var(--bg-2) 58%, #0a1020);
    }

    .shell {
      width: min(820px, 100%);
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .head {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 28px;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(540px 260px at 0% 0%, rgba(54, 95, 141, .12), transparent 70%),
        rgba(15, 23, 42, .54);
    }

    .logo {
      width: 84px;
      height: 68px;
      object-fit: contain;
      padding: 10px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.08;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .body {
      padding: 26px;
      background: var(--panel);
    }

    .user {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: #dce7f7;
      font-weight: 700;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    form {
      --area-accent: var(--accent);
      margin: 0;
    }

    .area-soporte { --area-accent: 48, 130, 96; }
    .area-servicio-tecnico { --area-accent: 178, 103, 51; }
    .area-incidencias { --area-accent: 89, 98, 126; }
    .area-coordinacion { --area-accent: 70, 150, 180; }
    .area-venta { --area-accent: 174, 144, 61; }
    .area-finanzas { --area-accent: 35, 101, 78; }
    .area-administracion { --area-accent: 64, 108, 170; }
    .area-operaciones { --area-accent: 111, 121, 136; }

    button {
      width: 100%;
      min-height: 82px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid rgba(148, 163, 184, .18);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.032));
      color: inherit;
      padding: 16px 20px;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
      font: inherit;
    }

    button:hover {
      transform: translateY(-2px);
      border-color: rgba(var(--area-accent), .42);
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.04));
      box-shadow: 0 18px 34px rgba(0, 0, 0, .20);
    }

    .icon {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(var(--area-accent), .34), rgba(var(--area-accent), .18));
      border: 1px solid rgba(var(--area-accent), .46);
      color: white;
      font-weight: 900;
      letter-spacing: 0;
    }

    .title {
      display: block;
      font-size: 18px;
      font-weight: 850;
      margin: 0;
    }

    .foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 18px 26px;
      border-top: 1px solid var(--line);
      background: rgba(2, 6, 23, .35);
      color: var(--muted);
      font-size: 13px;
    }

    .logout {
      color: #dce7f7;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255,255,255,.04);
      font-weight: 700;
    }

    @media (max-width: 560px) {
      body { padding: 16px; }
      .head { align-items: flex-start; flex-direction: column; }
      h1 { font-size: 24px; }
      .grid { grid-template-columns: 1fr; }
      .foot { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="head">
      <img class="logo" src="/static/img/logo-atc.png" alt="ATC" />
      <div>
        <h1>Escoge donde quieres ingresar</h1>
        <p class="sub">Tu cuenta tiene mas de un acceso habilitado.</p>
      </div>
    </section>

    <section class="body">
      <div class="user">{{ user.name or user.username }}</div>
      <div class="grid">
        {% for area in areas %}
          {% if area.code != "protocolos" %}
          <form class="area-{{ area.code|replace('_', '-') }}" method="post" action="/seleccionar-area">
            <input type="hidden" name="area_code" value="{{ area.code }}" />
            <button type="submit">
              <span class="icon">{{ "OP" if area.code == "incidencias" else area.initials }}</span>
              <span class="title">{{ "Operadores" if area.code == "incidencias" else area.title }}</span>
            </button>
          </form>
          {% endif %}
        {% endfor %}
      </div>
    </section>

    <section class="foot">
      <span>Acceso unificado ATC</span>
      <a class="logout" href="/logout">Cerrar sesion</a>
    </section>
  </main>
</body>
</html>
