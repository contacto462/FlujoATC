<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Clientes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F1F1F1;
            color: #333333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .contenedor {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: #333333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #333333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #DDDDDD;
            border-radius: 5px;
            background-color: #FFFFFF;
            color: #333333;
        }
        .alerta {
            background-color: #ffcc00;
            color: #333;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #FFA500;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover { background-color: #FF8C00; }
    </style>
</head>
<body>
<div class="contenedor">
    <h1>Registrar Clientes</h1>
    <div class="alerta">
        Antes de registrar un cliente, revisa si ya existe para evitar duplicados.
    </div>

    <form id="formularioClientes">
        <label for="rut">RUT Empresa</label>
        <input type="text" id="rut" placeholder="Ingrese el RUT" required>

        <label for="razonSocial">Razon Social</label>
        <input type="text" id="razonSocial" placeholder="Ingrese la razon social" required>

        <label for="giro">Giro</label>
        <input type="text" id="giro" placeholder="Ingrese el giro" required>

        <label for="direccion">Direccion Empresa (Casa Matriz)</label>
        <input type="text" id="direccion" placeholder="Ingrese la direccion" required>

        <label for="region">Region</label>
        <select id="region" required>
            <option value="" disabled selected>Seleccione una Region</option>
        </select>

        <label for="comuna">Comuna</label>
        <select id="comuna" required>
            <option value="" disabled selected>Seleccione una Comuna</option>
        </select>

        <label for="emailFacturas">Email Envio Facturas</label>
        <input type="email" id="emailFacturas" placeholder="Ingrese el email" required>

        <label for="nombreRepresentante">Nombre Representante Legal</label>
        <input type="text" id="nombreRepresentante" placeholder="Ingrese el nombre del representante legal" required>

        <label for="rutRepresentante">RUT Representante Legal</label>
        <input type="text" id="rutRepresentante" placeholder="Ingrese el RUT del representante legal" required>

        <label for="telefono">Telefono</label>
        <input type="text" id="telefono" value="+569" required maxlength="13">

        <label for="emailRepresentante">Email Representante Legal</label>
        <input type="email" id="emailRepresentante" placeholder="Ingrese el email" required>

        <button id="btnRegistrar" type="button">Registrar Cliente</button>
    </form>
</div>

<input type="hidden" id="ejecutivoVenta">

<script>
    function formatearRUT(rut) {
        if (!rut) return "";
        const limpio = rut.replace(/[^0-9Kk]/g, "").toUpperCase();
        if (limpio.length < 2) return limpio;
        return limpio.slice(0, -1) + "-" + limpio.slice(-1);
    }

    function formatearTelefono() {
        const input = document.getElementById("telefono");
        if (!input.value.startsWith("+569")) input.value = "+569";
        input.value = "+569" + input.value.slice(4).replace(/\D/g, "");
        if (input.value.length > 13) input.value = input.value.slice(0, 13);
    }

    function evitarBorrarPrefijo(event) {
        const input = document.getElementById("telefono");
        if ((event.key === "Backspace" || event.key === "Delete") && input.selectionStart <= 4) {
            event.preventDefault();
        }
    }

    async function cargarUsuarioActual() {
        const response = await fetch("/api/venta/usuario-actual");
        if (!response.ok) throw new Error("No se pudo obtener el usuario actual.");
        const data = await response.json();
        document.getElementById("ejecutivoVenta").value = data.username || "";
    }

    async function cargarRegiones() {
        const response = await fetch("/api/venta/catalogo/regiones");
        if (!response.ok) throw new Error("No se pudo cargar el catalogo de regiones.");
        const data = await response.json();

        const regionSelect = document.getElementById("region");
        regionSelect.innerHTML = '<option value="" disabled selected>Seleccione una Region</option>';
        (data.regiones || []).forEach(region => {
            const option = document.createElement("option");
            option.value = region;
            option.textContent = region;
            regionSelect.appendChild(option);
        });
    }

    async function cargarComunas(region) {
        const response = await fetch("/api/venta/catalogo/comunas?region=" + encodeURIComponent(region));
        if (!response.ok) throw new Error("No se pudo cargar el catalogo de comunas.");
        const data = await response.json();

        const comunaSelect = document.getElementById("comuna");
        comunaSelect.innerHTML = '<option value="" disabled selected>Seleccione una Comuna</option>';
        (data.comunas || []).forEach(comuna => {
            const option = document.createElement("option");
            option.value = comuna;
            option.textContent = comuna;
            comunaSelect.appendChild(option);
        });
    }

    async function verificarRutExiste(rut) {
        const response = await fetch("/api/venta/clientes/verificar-rut?rut=" + encodeURIComponent(rut));
        if (!response.ok) throw new Error("No se pudo verificar el RUT.");
        const data = await response.json();
        return Boolean(data.exists);
    }

    async function enviarFormulario() {
        const boton = document.getElementById("btnRegistrar");
        boton.disabled = true;
        boton.textContent = "Registrando...";

        try {
            const rutFormateado = formatearRUT(document.getElementById("rut").value.trim());
            const existe = await verificarRutExiste(rutFormateado);
            if (existe) {
                alert("Error: El RUT ya esta registrado.");
                return;
            }

            const payload = {
                ejecutivo: document.getElementById("ejecutivoVenta").value,
                rut: rutFormateado,
                razonSocial: document.getElementById("razonSocial").value.trim(),
                giro: document.getElementById("giro").value.trim(),
                direccion: document.getElementById("direccion").value.trim(),
                region: document.getElementById("region").value.trim(),
                comuna: document.getElementById("comuna").value.trim(),
                emailFacturas: document.getElementById("emailFacturas").value.trim(),
                nombreRepresentante: document.getElementById("nombreRepresentante").value.trim(),
                rutRepresentante: formatearRUT(document.getElementById("rutRepresentante").value.trim()),
                telefono: document.getElementById("telefono").value.trim(),
                emailRepresentante: document.getElementById("emailRepresentante").value.trim()
            };

            const response = await fetch("/api/venta/clientes", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const err = await response.json().catch(() => ({ detail: "Error al registrar el cliente." }));
                throw new Error(err.detail || "Error al registrar el cliente.");
            }

            alert("Cliente registrado con exito.");
            document.getElementById("formularioClientes").reset();
            document.getElementById("telefono").value = "+569";
        } catch (error) {
            alert(error.message || "Error inesperado al registrar.");
        } finally {
            boton.disabled = false;
            boton.textContent = "Registrar Cliente";
        }
    }

    document.addEventListener("DOMContentLoaded", async function () {
        document.getElementById("rut").addEventListener("input", function () {
            this.value = formatearRUT(this.value);
        });
        document.getElementById("rutRepresentante").addEventListener("input", function () {
            this.value = formatearRUT(this.value);
        });
        document.getElementById("telefono").addEventListener("input", formatearTelefono);
        document.getElementById("telefono").addEventListener("keydown", evitarBorrarPrefijo);
        document.getElementById("btnRegistrar").addEventListener("click", enviarFormulario);
        document.getElementById("region").addEventListener("change", function () {
            if (this.value) cargarComunas(this.value).catch(err => alert(err.message));
        });

        try {
            await Promise.all([cargarUsuarioActual(), cargarRegiones()]);
        } catch (error) {
            alert(error.message || "No se pudo inicializar el formulario.");
        }
    });
</script>
</body>
</html>
