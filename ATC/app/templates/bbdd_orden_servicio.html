<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/favicon-180.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBDD Orden de Servicio — ATC</title>
  <link rel="stylesheet" href="/static/base.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy-1: #0b1420;
      --navy-2: #162538;
      --navy-3: #1e3248;
      --orange: #ff7a2b;
      --orange-2: #ff9448;
      --orange-dark: #e8691f;
      --bg: #f0f4f8;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --label: #374151;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    .page-header {
      position: sticky; top: 0; z-index: 50;
      background: linear-gradient(180deg, #0b1424 0%, #111c2f 100%);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 30px;
      min-height: 108px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      flex-shrink: 0;
    }
    .header-logo {
      height: 68px; width: auto; object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.30));
    }
    .header-title {
      flex: 1; color: #fff;
      font-size: 20px; font-weight: 700;
      letter-spacing: -.02em; line-height: 1.25;
    }
    .header-title small {
      display: block; font-size: 13.5px; font-weight: 500;
      color: rgba(255,255,255,.72); margin-top: 6px;
      letter-spacing: 0; line-height: 1.45;
    }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .session-user {
      display: inline-flex; align-items: center;
      min-height: 36px; padding: 0 4px;
      color: rgba(255,255,255,.92); font-size: 14px; font-weight: 600; white-space: nowrap;
    }
    .btn-back {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 14px; border-radius: 7px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.92); font-size: 13px; font-weight: 600;
      text-decoration: none; transition: background .15s, border-color .15s; white-space: nowrap;
    }
    .btn-back:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.22); }

    /* ── LAYOUT ── */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 180px 1fr;
      overflow: hidden;
    }

    /* ── SIDEBAR (list) ── */
    /* ── SIDEBAR (list) ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-top {
      flex-shrink: 0;
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .sidebar-top-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 10px;
    }

    .search-wrap { position: relative; }

    .search-wrap svg {
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      font-size: 13px; font-family: inherit;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg); color: var(--text);
      transition: border-color .18s, box-shadow .18s;
    }
    .search-input:focus {
      outline: none; border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,122,43,.1);
      background: #fff;
    }

    .sidebar-count {
      font-size: 11px; color: var(--muted);
      margin-top: 8px; text-align: right;
    }

    .client-list {
      flex: 1; overflow-y: auto; padding: 8px 8px;
    }
    .client-list::-webkit-scrollbar { width: 4px; }
    .client-list::-webkit-scrollbar-track { background: transparent; }
    .client-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

    .client-item {
      padding: 10px 12px; border-radius: 10px;
      cursor: pointer; transition: background .14s;
      border: 1.5px solid transparent; margin-bottom: 3px;
    }
    .client-item:hover { background: #f1f5f9; }
    .client-item.active { background: #fff5ef; border-color: rgba(255,122,43,.35); }

    .client-item-name {
      font-size: 13.5px; font-weight: 600; color: var(--text);
      line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .client-item.active .client-item-name { color: var(--orange); }

    .client-item-sub {
      font-size: 11.5px; color: var(--muted);
      margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .list-empty {
      padding: 40px 16px; text-align: center;
      color: var(--muted); font-size: 13px;
    }

    /* ── DETAIL PANEL ── */
    .detail-panel { display: flex; flex-direction: column; overflow: hidden; }

    .detail-panel-inner {
      flex: 1; overflow-y: auto; padding: 28px 32px 48px;
    }
    .detail-panel-inner::-webkit-scrollbar { width: 5px; }
    .detail-panel-inner::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

    .empty-state {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; color: var(--muted); text-align: center; padding: 40px;
    }
    .empty-state-icon {
      width: 64px; height: 64px; border-radius: 18px;
      background: #f1f5f9; display: flex; align-items: center; justify-content: center;
    }
    .empty-state h3 { font-size: 17px; font-weight: 700; color: var(--text); }
    .empty-state p { font-size: 13px; max-width: 280px; line-height: 1.5; }

    /* Detail header */
    .detail-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
    }

    .detail-title { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }

    .detail-id-badge {
      font-size: 11.5px; font-weight: 700; color: var(--muted);
      background: #f1f5f9; border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 10px; margin-top: 4px; display: inline-block;
    }

    /* ── SECTION DIVIDER ── */
    .section-sep {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
      margin: 28px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 7px;
      grid-column: 1 / -1;
    }
    .section-sep-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--orange); flex-shrink: 0;
    }

    /* ── FIELD GRID ── */
    .fields-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px 18px;
    }

    .field { display: flex; flex-direction: column; }

    .field label {
      font-size: 11.5px; font-weight: 700; color: var(--label);
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%; padding: 9px 12px;
      font-size: 13.5px; font-family: inherit;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: #fff; color: var(--text);
      transition: border-color .18s, box-shadow .18s;
    }
    .field textarea { resize: vertical; min-height: 60px; overflow-wrap: break-word; }
    textarea[style*="display:none"] { display: none !important; }

    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,122,43,.1);
    }
    .field input.changed, .field select.changed, .field textarea.changed {
      border-color: #f59e0b; background: #fffbeb;
    }
    .field select { cursor: pointer; }

    /* ── single-line input style shared with textarea ── */
    .field input.short {
      width: 100%; padding: 9px 12px;
      font-size: 13.5px; font-family: inherit;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: #fff; color: var(--text);
      transition: border-color .18s, box-shadow .18s;
    }
    .field input.short:focus {
      outline: none; border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,122,43,.1);
    }

    /* ── TOGGLE BUTTON ── */
    .btn-toggle {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 13px; background: #f8fafc;
      border: 1.5px solid var(--border); border-radius: 9px;
      font-size: 13px; font-weight: 600; font-family: inherit;
      color: var(--muted); cursor: pointer; transition: all .18s;
      width: auto;
    }
    .btn-toggle svg { flex-shrink: 0; }
    .btn-toggle:hover { background: #fff5ef; border-color: var(--orange); color: var(--orange); }
    .btn-toggle-hide {
      background: #fff5ef; border-color: rgba(255,122,43,.4);
      color: var(--orange); margin-top: 6px;
    }
    .btn-toggle-hide:hover { background: #ffe8d6; }

    /* ── CHECKBOX GRID ── */
    .checkbox-grid {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px 8px; margin-top: 8px; padding: 8px 10px;
      background: #fafbfc; border-radius: 10px;
      border: 1.5px solid var(--border);
      max-width: 100%;
    }
    .checkbox-grid label {
      font-size: 12.5px; font-weight: 500; color: var(--text);
      text-transform: none; letter-spacing: 0;
      display: flex; align-items: center; gap: 7px; cursor: pointer;
      padding: 4px 6px; border-radius: 6px; transition: background .14s;
    }
    .checkbox-grid label:hover { background: #f1f5f9; }
    .checkbox-grid input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 15px; height: 15px; flex-shrink: 0;
      border: 2px solid #cbd5e1; border-radius: 4px;
      background: #fff; cursor: pointer;
      transition: border-color .15s, background .15s;
      position: relative;
    }
    .checkbox-grid input[type="checkbox"]:checked {
      background: var(--orange); border-color: var(--orange);
    }
    .checkbox-grid input[type="checkbox"]:checked::after {
      content: '';
      position: absolute; left: 50%; top: 45%;
      width: 4px; height: 8px;
      border: 2px solid #fff; border-top: none; border-left: none;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    /* ── FILE PICKER ── */
    .file-picker { position: relative; }
    .file-picker input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 2; width: 100%; height: 100%;
    }
    .file-picker-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; border-radius: 10px;
      border: 1.5px dashed var(--border);
      background: #fafbfc; cursor: pointer;
      transition: border-color .18s, background .18s;
      pointer-events: none;
    }
    .file-picker:hover .file-picker-btn {
      border-color: var(--orange); background: #fff5ef;
    }
    .file-picker-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--bg); display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--muted);
    }
    .file-picker-text { min-width: 0; }
    .file-picker-name {
      font-size: 13px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .file-picker-hint { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .attached-files {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #fafbfc;
    }
    .attached-file {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }
    .attached-file-main { min-width: 0; }
    .attached-file-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .attached-file-meta {
      margin-top: 2px;
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .attached-file-link {
      flex-shrink: 0;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--orange-dark);
      background: #fff7ed;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
    }
    .attached-file-note {
      flex-shrink: 0;
      max-width: 220px;
      padding: 6px 10px;
      border-radius: 8px;
      color: var(--muted);
      background: var(--bg-soft, #f3f4f6);
      font-size: 11.5px;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .attached-empty {
      color: var(--muted);
      font-size: 13px;
      padding: 4px 2px;
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 12px 20px; border-radius: 12px;
      font-size: 13.5px; font-weight: 700; color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      transform: translateY(80px); opacity: 0;
      transition: transform .28s cubic-bezier(.34,1.56,.64,1), opacity .24s;
      z-index: 999; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: #16a34a; }
    .toast.error   { background: #dc2626; }

    @media (max-width: 1024px) {
      .file-upload-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 280px; }
      .detail-panel-inner { padding: 20px 18px 40px; }
    }

    @media (max-width: 640px) {
      .fields-grid { grid-template-columns: 1fr; }
      .checkbox-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <img class="header-logo" src="/shared-static/img/logo-atc.png" alt="ATC" onerror="this.style.display='none'">
    <div class="header-title">
      Base de Datos — Órdenes de Servicio
      <small>Consulta y edición de órdenes de servicio registradas</small>
    </div>
    <div class="header-actions">
      <div class="session-user" id="usuarioActual">Cargando...</div>
      <a id="btnVolver" href="#" class="btn-back">Volver</a>
    </div>
  </header>

  <div class="workspace">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <p class="sidebar-top-title">Órdenes de Servicio</p>
        <div class="search-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="searchInput" class="search-input" type="text" placeholder="Buscar ODS..." oninput="filtrarLista()">
        </div>
        <p class="sidebar-count" id="sidebarCount"></p>
      </div>
      <div class="client-list" id="clientList">
        <div class="list-empty">Cargando...</div>
      </div>
    </aside>

    <!-- DETAIL -->
    <section class="detail-panel">
      <div class="detail-panel-inner" id="detailPanel">
        <div class="empty-state">
          <div class="empty-state-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </div>
          <h3>Selecciona una ODS</h3>
          <p>Elige una orden de servicio de la lista para ver y editar sus datos.</p>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const qsToken = new URLSearchParams(window.location.search).get("token") || "";
    const withToken = (url) => {
      const sep = url.includes("?") ? "&" : "?";
      return qsToken ? `${url}${sep}token=${encodeURIComponent(qsToken)}` : url;
    };
    document.getElementById("btnVolver").href = withToken("/venta/panel-selector");


    async function cargarUsuarioActual() {
      const el = document.getElementById("usuarioActual");
      if (!el) return;
      try {
        const response = await fetch(`/api/usuario-actual?token=${encodeURIComponent(qsToken)}`);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data?.detail || "No se pudo cargar el usuario actual.");
        const nombre = String(data?.usuario || data?.nombre || data?.username || "").trim();
        el.textContent = nombre ? `${nombre}` : "Sesión activa";
      } catch (_err) {
        el.textContent = "Sesión activa";
      }
    }

    let allODS = [];   // [{codigo, sucursal}]
    let activeODS = null;

    /* ── TOAST ── */
    function showToast(msg, type = "success") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.classList.remove("show"), 3000);
    }

    /* ── LOAD DATA ── */
    async function init() {
      try {
        const res = await fetch(withToken("/api/venta/ods/lista"));
        if (!res.ok) throw new Error("No se pudo cargar la lista de ODS.");
        const data = await res.json();
        allODS = data.ods || [];
        renderList(allODS);
      } catch (err) {
        document.getElementById("clientList").innerHTML =
          `<div class="list-empty">${err.message || "Error cargando datos."}</div>`;
      }
    }

    /* ── RENDER LIST ── */
    function normalizeODS(item) {
      if (typeof item === 'string') return { codigo: item, sucursal: '' };
      return { codigo: item.codigo || '', sucursal: item.sucursal || '' };
    }

    function renderList(items) {
      const container = document.getElementById("clientList");
      const count = document.getElementById("sidebarCount");
      if (!items.length) {
        container.innerHTML = '<div class="list-empty">Sin resultados</div>';
        count.textContent = "";
        return;
      }
      count.textContent = `${items.length} ODS`;
      container.innerHTML = items.map(raw => {
        const { codigo, sucursal } = normalizeODS(raw);
        return `
        <div class="client-item${activeODS === codigo ? ' active' : ''}" data-ods="${escAttr(codigo)}" onclick="selectODS('${escAttr(codigo)}')">
          <div class="client-item-name">${escHTML(codigo)}</div>
          ${sucursal ? `<div class="client-item-sub">${escHTML(sucursal)}</div>` : ''}
        </div>`;
      }).join('');
    }

    /* ── FILTER ── */
    function filtrarLista() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      renderList(q ? allODS.filter(raw => {
        const { codigo, sucursal } = normalizeODS(raw);
        return codigo.toLowerCase().includes(q) || sucursal.toLowerCase().includes(q);
      }) : allODS);
    }

    /* ── SELECT ODS ── */
    async function selectODS(ods) {
      activeODS = ods;
      filtrarLista();

      const panel = document.getElementById("detailPanel");
      panel.innerHTML = `
        <div class="detail-header">
          <div>
            <div class="detail-title">${escHTML(ods)}</div>
            <span class="detail-id-badge">ODS ${escHTML(ods)}</span>
          </div>
        </div>

        <div class="fields-grid">
          <!-- DATOS DEL CLIENTE -->
          <div class="section-sep" style="margin-top:0"><span class="section-sep-dot"></span>Datos del Cliente</div>
          <div class="field"><label>RUT</label><input type="text" id="rut"></div>
          <div class="field"><label>Razón Social</label><input type="text" id="razonSocial"></div>
          <div class="field"><label>Nombre Sucursal</label><input type="text" id="nombreSucursal"></div>
          <div class="field"><label>Dirección Sucursal</label><input type="text" id="direccionSucursal"></div>

          <!-- TIPO DE SERVICIO -->
          <div class="section-sep"><span class="section-sep-dot"></span>Tipo de Servicio</div>
          <div class="field" style="grid-column:span 2">
            <button class="btn-toggle" onclick="toggleServicio()" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
              Seleccionar servicios
            </button>
            <div id="servicios-wrapper" class="checkbox-grid">
              <label><input type="checkbox" value="Televigilancia" onchange="actualizarVisibilidadBBDD()"> Televigilancia</label>
              <label><input type="checkbox" value="Alarma" onchange="actualizarVisibilidadBBDD()"> Alarma</label>
              <label><input type="checkbox" value="Guardia" onchange="actualizarVisibilidadBBDD()"> Guardia</label>
              <label><input type="checkbox" value="Instalacion" onchange="actualizarVisibilidadBBDD()"> Instalación</label>
              <label><input type="checkbox" value="Upgrade" onchange="actualizarVisibilidadBBDD()"> Upgrade</label>
              <label><input type="checkbox" value="Downgrade" onchange="actualizarVisibilidadBBDD()"> Downgrade</label>
              <label><input type="checkbox" value="Servicio Tecnico" onchange="actualizarVisibilidadBBDD()"> Servicio Técnico</label>
              <label><input type="checkbox" value="Monitoreo Adicional" onchange="actualizarVisibilidadBBDD()"> Monitoreo Adicional</label>
              <label><input type="checkbox" value="Desinstalacion" onchange="actualizarVisibilidadBBDD()"> Desinstalación</label>
            </div>
          </div>

          <!-- DATOS COMERCIALES (condicionales) -->
          <div class="section-sep" id="sep-comercial" style="display:none"><span class="section-sep-dot"></span>Datos Comerciales</div>

          <div class="field" id="sec-tipo-plan" style="display:none">
            <label>Tipo Plan</label>
            <select id="tipoPlan">
              <option value="">Seleccione...</option>
              <option>Plan Full</option>
              <option>Plan Mixto</option>
            </select>
          </div>
          <div class="field">
            <label>Tipo Cliente</label>
            <select id="tipoCliente">
              <option value="">Seleccione...</option>
              <option>EMPRESA</option>
              <option>DOMICILIO</option>
              <option>STRIP CENTER</option>
              <option>MUNICIPALIDAD</option>
              <option>CONDOMINIO</option>
            </select>
          </div>
          <div class="field" id="sec-agua-bano" style="display:none">
            <label>Agua Potable y Baño</label>
            <select id="aguaBano">
              <option value="">Seleccione...</option>
              <option value="Si">Sí</option>
              <option value="No">No</option>
            </select>
          </div>

          <!-- CÁMARAS (condicional) -->
          <div class="section-sep" id="sep-camaras" style="display:none"><span class="section-sep-dot"></span>Cámaras</div>
          <div class="field" id="sec-cam-instalar" style="display:none"><label>N° Cámaras a Instalar</label><input type="number" id="camInstalar" min="0"></div>
          <div class="field" id="sec-cam-vigilar" style="display:none"><label>N° Cámaras a Vigilar</label><input type="number" id="camVigilar" min="0"></div>
          <div class="field" id="sec-cam-desins" style="display:none"><label>N° Cámaras a Desinstalar</label><input type="number" id="camDesinstalar" min="0"></div>

          <!-- MONITOREO ADICIONAL (condicional) -->
          <div class="section-sep" id="sep-monitoreo" style="display:none"><span class="section-sep-dot"></span>Monitoreo Adicional</div>
          <div class="field" id="sec-monitoreo-desde" style="display:none"><label>Desde</label><input type="date" id="diasMonitoreoDesde"></div>
          <div class="field" id="sec-monitoreo-hasta" style="display:none"><label>Hasta</label><input type="date" id="diasMonitoreoHasta"></div>
          <div class="field" id="sec-monitoreo-horario" style="display:none"><label>Nuevo Horario</label><input type="time" id="horario"></div>

          <!-- VALORES A COBRAR (condicional) -->
          <div class="section-sep" id="sep-montos" style="display:none"><span class="section-sep-dot"></span>Valores a Cobrar</div>
          <div id="contenedor-montos" style="display:contents"></div>

          <!-- INFORMACIÓN ADICIONAL -->
          <div class="section-sep"><span class="section-sep-dot"></span>Información Adicional</div>
          <div class="field">
            <label>Materiales</label>
            <button class="btn-toggle" id="btn-materiales" onclick="toggleField('materiales','btn-materiales')" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
              Ver Materiales
            </button>
            <textarea id="materiales" style="display:none;"></textarea>
            <button class="btn-toggle btn-toggle-hide" id="anular-btn-materiales" style="display:none;" onclick="toggleField('materiales','btn-materiales')" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
              Ocultar
            </button>
          </div>
          <div class="field">
            <label>Consideraciones</label>
            <button class="btn-toggle" id="btn-consideraciones" onclick="toggleField('consideraciones','btn-consideraciones')" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
              Ver Consideraciones
            </button>
            <textarea id="consideraciones" style="display:none;"></textarea>
            <button class="btn-toggle btn-toggle-hide" id="anular-btn-consideraciones" style="display:none;" onclick="toggleField('consideraciones','btn-consideraciones')" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
              Ocultar
            </button>
          </div>
          <div class="field">
            <label>Observación</label>
            <button class="btn-toggle" id="btn-observacion" onclick="toggleField('observacion','btn-observacion')" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
              Ver Observación
            </button>
            <textarea id="observacion" style="display:none;"></textarea>
            <button class="btn-toggle btn-toggle-hide" id="anular-btn-observacion" style="display:none;" onclick="toggleField('observacion','btn-observacion')" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
              Ocultar
            </button>
          </div>

          <!-- ARCHIVOS ADJUNTOS -->
          <div class="section-sep"><span class="section-sep-dot"></span>Archivos Adjuntos</div>
          <div class="field" style="grid-column:1 / -1">
            <label>Archivos actuales</label>
            <div class="attached-files" id="archivosExistentes">
              <div class="attached-empty">Cargando archivos adjuntos...</div>
            </div>
          </div>
          <div class="field">
            <label>Agregar Cotización</label>
            <div class="file-picker">
              <input type="file" class="archivo-nuevo" data-tipo-documento="Cotizacion" data-servicio="General" accept=".pdf,.doc,.docx" onchange="updateFilePicker(this,'cotizacion-name'); guardarCambiosODS();">
              <div class="file-picker-btn">
                <div class="file-picker-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
                <div class="file-picker-text"><div class="file-picker-name" id="cotizacion-name">Seleccionar archivo</div><div class="file-picker-hint">PDF, DOC, DOCX</div></div>
              </div>
            </div>
          </div>
          <div class="field">
            <label>Agregar Contrato</label>
            <div class="file-picker">
              <input type="file" class="archivo-nuevo" data-tipo-documento="Contrato" data-servicio="General" accept=".pdf,.doc,.docx" onchange="updateFilePicker(this,'contrato-name'); guardarCambiosODS();">
              <div class="file-picker-btn">
                <div class="file-picker-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15l2 2 4-5"/></svg></div>
                <div class="file-picker-text"><div class="file-picker-name" id="contrato-name">Seleccionar archivo</div><div class="file-picker-hint">PDF, DOC, DOCX</div></div>
              </div>
            </div>
          </div>
          <div class="field">
            <label>Agregar Layout</label>
            <div class="file-picker">
              <input type="file" class="archivo-nuevo" data-tipo-documento="Layout" data-servicio="Instalacion" accept="image/*,.pdf" onchange="updateFilePicker(this,'layout-name'); guardarCambiosODS();">
              <div class="file-picker-btn">
                <div class="file-picker-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>
                <div class="file-picker-text"><div class="file-picker-name" id="layout-name">Seleccionar archivo</div><div class="file-picker-hint">Imagen o PDF</div></div>
              </div>
            </div>
          </div>
          <div class="field">
            <label>Agregar Orden de Compra (OC)</label>
            <div class="file-picker">
              <input type="file" class="archivo-nuevo" data-tipo-documento="ODC" data-servicio="Instalacion" accept=".pdf,.doc,.docx" onchange="updateFilePicker(this,'oc-name'); guardarCambiosODS();">
              <div class="file-picker-btn">
                <div class="file-picker-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
                <div class="file-picker-text"><div class="file-picker-name" id="oc-name">Seleccionar archivo</div><div class="file-picker-hint">PDF, DOC, DOCX</div></div>
              </div>
            </div>
          </div>
        </div>
      `;

      /* load data into form */
      try {
        const res = await fetch(withToken("/api/venta/ods/detalle?codigo=" + encodeURIComponent(ods)));
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: "No se pudo cargar la ODS." }));
          throw new Error(typeof err?.detail === "string" ? err.detail : "No se pudo cargar la ODS.");
        }
        const datos = await res.json();
        poblarFormulario(datos);
      } catch (e) {
        showToast(e.message || "Error al cargar la ODS.", "error");
      }
    }

    /* ── POPULATE FORM ── */
    function poblarFormulario(datos) {
      const camposSimples = [
        "rut","razonSocial","direccionSucursal","nombreSucursal",
        "tipoCliente","camInstalar","camVigilar","camDesinstalar",
        "diasAdicional","horario","diasMonitoreoDesde","diasMonitoreoHasta",
        "tipoPlan","aguaBano","materiales","consideraciones","observacion"
      ];
      camposSimples.forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.value = datos[id] || "";
      });
      setSelectValue("aguaBano", normalizarSiNo(datos.aguaBano || ""));
      renderArchivosExistentes(datos.archivos || []);

      // Set service checkboxes
      const serviciosSeleccionados = (datos.tipoServicio || "").split("|").map(s => s.trim());
      document.querySelectorAll('#servicios-wrapper input[type="checkbox"]')
        .forEach((cb) => { cb.checked = serviciosSeleccionados.includes(cb.value); });

      // Show checkbox grid if any services selected
      if (serviciosSeleccionados.some(s => s)) {
        document.getElementById("servicios-wrapper").style.display = "grid";
      }

      // Update conditional visibility
      actualizarVisibilidadBBDD();

      // Parse stored montoACobrar string into individual fields
      const montoStr = datos.montoACobrar || "";
      if (montoStr) {
        montoStr.split("\n").forEach(line => {
          const colonIdx = line.indexOf(":");
          if (colonIdx < 0) return;
          const label = line.slice(0, colonIdx).trim();
          const val = line.slice(colonIdx + 1).trim();
          const id = MONTO_LABEL_TO_ID[label];
          if (id) {
            const el = document.getElementById(id);
            if (el) el.value = val;
          }
        });
      }
    }

    function normalizarSiNo(value) {
      const raw = String(value || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      if (["si", "sí", "s", "true", "1"].includes(raw)) return "Si";
      if (["no", "n", "false", "0"].includes(raw)) return "No";
      return String(value || "").trim();
    }

    function setSelectValue(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      const target = String(value || "").trim();
      const option = Array.from(el.options || []).find(opt => String(opt.value || opt.textContent || "").trim() === target);
      el.value = option ? option.value : target;
    }

    function esArchivoReal(ruta) {
      // Distingue un archivo real (URL o path con extension) de placeholders de
      // texto libre como "No Requiere" o notas aclaratorias sin archivo adjunto.
      const val = String(ruta || "").trim();
      if (!val) return false;
      if (/^https?:\/\//i.test(val)) return true;
      return /\.[a-z0-9]{2,5}$/i.test(val);
    }

    function renderArchivosExistentes(archivos) {
      const cont = document.getElementById("archivosExistentes");
      if (!cont) return;
      const lista = Array.isArray(archivos) ? archivos : [];
      if (!lista.length) {
        cont.innerHTML = '<div class="attached-empty">No hay archivos adjuntos registrados.</div>';
        return;
      }
      cont.innerHTML = lista.map((archivo) => {
        const tipo = archivo.tipoDocumento || "Archivo";
        const esReal = esArchivoReal(archivo.rutaArchivo);
        const nombre = archivo.nombreArchivo || (esReal ? archivo.rutaArchivo : "") || "Sin nombre";
        const servicio = archivo.servicio || "General";
        const fecha = archivo.createdAt || "";
        const url = esReal ? withToken(archivo.downloadUrl || "") : "";
        const nota = !esReal ? String(archivo.rutaArchivo || "").trim() : "";
        return `
          <div class="attached-file">
            <div class="attached-file-main">
              <div class="attached-file-title">${escHTML(tipo)} · ${escHTML(nombre)}</div>
              <div class="attached-file-meta">${escHTML(servicio)}${fecha ? " · " + escHTML(fecha) : ""}</div>
            </div>
            ${url ? `<a class="attached-file-link" href="${escAttr(url)}" target="_blank" rel="noopener">Ver</a>` : (nota ? `<span class="attached-file-note">${escHTML(nota)}</span>` : "")}
          </div>
        `;
      }).join("");
    }

    /* ── MONTO LABEL MAP ── */
    const MONTO_LABEL_TO_ID = {
      "Valor Servicio Mensual":    "monto_servicio_mensual",
      "Valor Instalacion Total":   "monto_instalacion_total",
      "Valor Instalación Total":   "monto_instalacion_total",
      "Valor Servicio Tecnico":    "monto_servicio_tecnico",
      "Valor Servicio Técnico":    "monto_servicio_tecnico",
      "Valor Desinstalacion":      "monto_desinstalacion",
      "Valor Desinstalación":      "monto_desinstalacion",
      "Valor Upgrade":             "monto_upgrade",
      "Valor Downgrade":           "monto_downgrade",
      "Valor Monitoreo Adicional": "monto_monitoreo_adicional",
    };

    /* ── VISIBILITY LOGIC (mirrors RegistroODS) ── */
    function actualizarVisibilidadBBDD() {
      const sel = Array.from(
        document.querySelectorAll('#servicios-wrapper input[type="checkbox"]:checked')
      ).map(cb => cb.value);

      const tecnico = sel.some(s => ["Televigilancia","Instalacion","Upgrade","Downgrade"].includes(s));
      const monitoreo = sel.includes("Monitoreo Adicional");
      const desins = sel.includes("Desinstalacion");
      const instalacion = sel.includes("Instalacion");
      const hayServicios = sel.length > 0;
      const aguaTieneValor = Boolean(String(document.getElementById("aguaBano")?.value || "").trim());

      show("sep-comercial",       tecnico || instalacion);
      show("sec-tipo-plan",       tecnico);
      show("sec-agua-bano",       instalacion || aguaTieneValor);
      show("sep-camaras",         tecnico || desins);
      show("sec-cam-instalar",    tecnico);
      show("sec-cam-vigilar",     tecnico);
      show("sec-cam-desins",      desins);
      show("sep-monitoreo",       monitoreo);
      show("sec-monitoreo-desde", monitoreo);
      show("sec-monitoreo-hasta", monitoreo);
      show("sec-monitoreo-horario", monitoreo);
      show("sep-montos",          hayServicios);

      actualizarMontosBBDD(sel);
    }

    function show(id, visible) {
      const el = document.getElementById(id);
      if (el) el.style.display = visible ? "" : "none";
    }

    function actualizarMontosBBDD(servicios) {
      const contenedor = document.getElementById("contenedor-montos");
      if (!contenedor) return;

      const campos = [];
      if (servicios.includes("Instalacion")) {
        campos.push(["monto_instalacion_total", "Valor Instalación Total"]);
        campos.push(["monto_servicio_mensual",  "Valor Servicio Mensual"]);
      }
      if (servicios.some(s => ["Televigilancia","Alarma","Guardia"].includes(s)) && !campos.find(c => c[0] === "monto_servicio_mensual"))
        campos.push(["monto_servicio_mensual", "Valor Servicio Mensual"]);
      if (servicios.includes("Servicio Tecnico"))    campos.push(["monto_servicio_tecnico",    "Valor Servicio Técnico"]);
      if (servicios.includes("Desinstalacion"))      campos.push(["monto_desinstalacion",      "Valor Desinstalación"]);
      if (servicios.includes("Upgrade"))             campos.push(["monto_upgrade",             "Valor Upgrade"]);
      if (servicios.includes("Downgrade"))           campos.push(["monto_downgrade",           "Valor Downgrade"]);
      if (servicios.includes("Monitoreo Adicional")) campos.push(["monto_monitoreo_adicional", "Valor Monitoreo Adicional"]);

      // preserve existing values
      const prevValues = {};
      contenedor.querySelectorAll("input[data-monto]").forEach(el => {
        prevValues[el.id] = el.value;
      });

      contenedor.innerHTML = campos.map(([id, label]) =>
        `<div class="field">
          <label>${label}</label>
          <input type="text" id="${id}" data-monto="1" placeholder="Ej: UF o CLP + IVA" value="${escAttr(prevValues[id]||'')}">
        </div>`
      ).join('');
    }

    /* ── FILE TO BASE64 ── */
    async function archivoABase64(input) {
      return new Promise((resolve) => {
        if (!input || !input.files || !input.files.length) { resolve(null); return; }
        const archivo = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => resolve({
          nombre: archivo.name,
          tipo: archivo.type || "application/octet-stream",
          data: String(e.target?.result || ""),
          tipoDocumento: input.dataset.tipoDocumento || "",
          servicio: input.dataset.servicio || "General"
        });
        reader.readAsDataURL(archivo);
      });
    }

    /* ── SAVE ── */
    async function guardarCambiosODS() {
      try {
        if (!activeODS) throw new Error("Selecciona una ODS.");

        const datos = { selectorODS: activeODS };
        const campos = [
          "rut","razonSocial","direccionSucursal","nombreSucursal",
          "tipoPlan","aguaBano","tipoCliente","camInstalar","camVigilar","camDesinstalar",
          "diasMonitoreoDesde","diasMonitoreoHasta","diasAdicional","horario",
          "materiales","consideraciones","observacion"
        ];
        campos.forEach((id) => datos[id] = document.getElementById(id)?.value || "");
        datos.tipoServicio = Array.from(
          document.querySelectorAll('#servicios-wrapper input[type="checkbox"]:checked')
        ).map(cb => cb.value).join(", ");

        // Build montoACobrar from dynamic monto fields
        const montoLines = Array.from(document.querySelectorAll('#contenedor-montos input[data-monto]'))
          .map(el => {
            const label = el.previousElementSibling?.textContent?.trim();
            const val = el.value.trim();
            return (label && val) ? `${label}: ${val}` : null;
          }).filter(Boolean);
        datos.montoACobrar = montoLines.join("\n");

        const archivos = [];
        for (const input of document.querySelectorAll(".archivo-nuevo")) {
          const archivo = await archivoABase64(input);
          if (archivo) archivos.push(archivo);
        }
        if (archivos.length) datos.archivos = archivos;

        const res = await fetch(withToken("/api/venta/ods/guardar"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: "No se pudo guardar la ODS." }));
          throw new Error(typeof err?.detail === "string" ? err.detail : "No se pudo guardar la ODS.");
        }

        showToast("Guardado correctamente ✓", "success");
        if (archivos.length) {
          // Se subió al menos un archivo nuevo: recarga para mostrarlo en
          // "Archivos actuales" y limpiar el selector (si no, ese mismo archivo
          // se volvería a adjuntar en el próximo guardado automático).
          await selectODS(activeODS);
        }
      } catch (e) {
        showToast(e.message || "Error al guardar", "error");
      }
    }

    /* ── TOGGLE HELPERS ── */
    function toggleField(f, b) {
      const field = document.getElementById(f);
      const btn = document.getElementById(b);
      const an = document.getElementById("anular-" + b);
      const visible = field.style.display === "block";
      field.style.display = visible ? "none" : "block";
      btn.style.display = visible ? "inline-flex" : "none";
      if (an) an.style.display = visible ? "none" : "inline-flex";
    }

    function toggleServicio() {
      const div = document.getElementById("servicios-wrapper");
      div.style.display = div.style.display === "grid" ? "none" : "grid";
    }

    /* ── FILE PICKER LABEL ── */
    function updateFilePicker(input, labelId) {
      const label = document.getElementById(labelId);
      if (!label) return;
      if (input.files && input.files.length) {
        label.textContent = input.files[0].name;
        label.style.color = "var(--orange)";
      } else {
        label.textContent = "Seleccionar archivo";
        label.style.color = "";
      }
    }

    function escHTML(str) {
      return String(str || '').replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
      );
    }
    function escAttr(str) {
      return String(str || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    /* ── AUTO-GUARDADO: cualquier campo del formulario (texto, select, checkbox
       de servicios, montos dinámicos) guarda solo al cambiar — ya no hay botón
       "Guardar cambios". Los inputs de archivo (.archivo-nuevo) quedan afuera:
       tienen su propio guardado inmediato en su onchange (ver arriba), porque
       si entraran acá el archivo seleccionado se re-adjuntaría en cada guardado
       automático posterior hasta que el usuario lo borrara a mano. ── */
    document.getElementById("detailPanel")?.addEventListener("change", (e) => {
      if (e.target.closest(".archivo-nuevo")) return;
      if (e.target.matches(".archivo-nuevo")) return;
      guardarCambiosODS();
    });

    cargarUsuarioActual();
    init();
  </script>
<script src="/static/auth-guard.js"></script>
  <script src="/static/atc-logo-home.js"></script>
<script src="/static/atc-volver.js"></script>
</body>
