<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/favicon-180.png">
<link rel="shortcut icon" href="/favicon.ico">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mis Rendiciones</title>
  <style>
    :root {
      --bg-1: #09181c;
      --bg-2: #10262d;
      --bg-3: #163840;
      --panel-bg: rgba(9, 22, 26, 0.94);
      --panel-border: rgba(255, 255, 255, 0.10);
      --text-main: #f4f8f9;
      --text-soft: #b9cbd1;
      --cell-bg: rgba(8, 18, 22, 0.96);
      --cell-alt: rgba(12, 27, 32, 0.96);
      --cell-border: rgba(188, 207, 214, 0.10);
      --orange-1: #ff6e23;
      --orange-2: #ff8b33;
      --orange-3: #e85d14;
      --shadow: 0 22px 50px rgba(0, 0, 0, 0.24);
    }

    html, body {
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
      padding: 34px 36px 44px;
      color: var(--text-main);
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.05), transparent 24%),
        radial-gradient(circle at 82% 12%, rgba(255, 125, 53, 0.08), transparent 18%),
        linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 42%, var(--bg-3) 100%);
      background-attachment: fixed;
    }

    .encabezado-principal {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
      max-width: 1320px;
      margin: 0 auto 22px;
      padding: 18px 22px;
      border-radius: 26px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
    }

    .marca-principal {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .logo-principal {
      height: 72px;
      width: auto;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .titulo-central {
      margin: 0;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .subtitulo {
      margin: 4px 0 0;
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.5;
    }

    .sesion-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    #sesionInfo {
      font-weight: 700;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 8px 14px;
    }

    .toolbar-panel,
    .tabla-shell {
      max-width: 1320px;
      margin: 0 auto 22px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .toolbar-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 18px;
      flex-wrap: wrap;
    }

    .toolbar-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text-soft);
      font-size: 14px;
      font-weight: 700;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      height: 30px;
      border-radius: 999px;
      padding: 0 10px;
      background: rgba(255, 139, 51, 0.22);
      border: 1px solid rgba(255, 139, 51, 0.45);
      color: #ffe2c8;
      font-weight: 800;
      font-size: 13px;
    }

    .toolbar-actions { display: inline-flex; align-items: center; gap: 10px; }

    .tabla-shell { padding: 14px; }
    .tabla-scroll {
      overflow-x: auto;
      border-radius: 18px;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 1420px;
      border-collapse: collapse;
      table-layout: fixed;
      background: transparent;
      border-radius: 18px;
      overflow: hidden;
      font-size: 14px;
    }

    th, td {
      padding: 11px 10px;
      text-align: center;
      border: 1px solid var(--cell-border);
      vertical-align: middle;
      word-break: break-word;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: linear-gradient(135deg, var(--orange-3) 0%, var(--orange-2) 100%);
      color: white;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tbody td { background: var(--cell-bg); color: var(--text-main); }
    tbody tr:nth-child(even) td { background: var(--cell-alt); }
    .text-left { text-align: left; }

    a { color: #9dd3ff; text-decoration: none; font-weight: 700; }
    a:hover { text-decoration: underline; color: #ffffff; }

    button {
      padding: 10px 16px;
      background: #111b1f;
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: transform 0.18s ease, background-color 0.18s ease;
    }

    button:hover { background: #1a272c; transform: translateY(-1px); }

    .btn-primario {
      background: linear-gradient(135deg, var(--orange-1) 0%, var(--orange-2) 100%);
      box-shadow: 0 12px 24px rgba(255, 110, 35, 0.20);
    }

    .btn-secundario {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }

    .estado-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .estado-pill.pendiente {
      background: rgba(245, 158, 11, 0.22);
      border-color: rgba(245, 158, 11, 0.52);
      color: #ffe7bc;
    }

    .estado-pill.aceptado {
      background: rgba(52, 211, 153, 0.22);
      border-color: rgba(52, 211, 153, 0.52);
      color: #d8fff2;
    }

    .estado-pill.rechazado {
      background: rgba(239, 68, 68, 0.24);
      border-color: rgba(239, 68, 68, 0.52);
      color: #ffd8d8;
    }

    .estado-cargando,
    .estado-vacio {
      max-width: 1320px;
      margin: 0 auto;
      text-align: center;
      color: var(--text-soft);
      padding: 20px;
      font-weight: 700;
    }

    #toast {
      position: fixed;
      top: 20px;
      right: 20px;
      max-width: 360px;
      z-index: 10000;
      background: #323232;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 16px 28px rgba(0, 0, 0, 0.28);
      display: none;
      line-height: 1.4;
      font-size: 13px;
    }

    #toast.error { background: rgba(103, 26, 26, 0.98); border-color: rgba(239, 68, 68, 0.52); }

    @media (max-width: 900px) {
      body {
        padding: calc(14px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom));
        background:
          linear-gradient(180deg, #071316 0%, #10282e 48%, #0f3237 100%);
        background-attachment: scroll;
      }

      .encabezado-principal,
      .toolbar-panel,
      .tabla-shell,
      .estado-cargando,
      .estado-vacio {
        width: 100%;
        max-width: none;
        box-sizing: border-box;
      }

      .encabezado-principal {
        grid-template-columns: 1fr;
        gap: 14px;
        margin-bottom: 14px;
        padding: 14px;
        border-radius: 18px;
      }

      .marca-principal {
        gap: 12px;
      }

      .logo-principal {
        height: 54px;
      }

      .titulo-central {
        font-size: 27px;
        line-height: 1.1;
      }

      .sesion-panel {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        width: 100%;
      }

      #sesionInfo {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: center;
      }

      .toolbar-panel {
        margin-bottom: 14px;
        padding: 12px;
        border-radius: 18px;
      }

      .toolbar-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
      }

      button {
        min-height: 44px;
        padding: 11px 12px;
        font-size: 16px;
      }
    }
    @media (max-width: 760px) {
      .tabla-scroll {
        max-width: 100vw;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      table th,
      table td {
        overflow-wrap: normal !important;
        word-break: normal !important;
      }
    }

    @media (max-width: 640px) {
      body {
        padding-left: 10px;
        padding-right: 10px;
      }

      .marca-principal {
        align-items: flex-start;
      }

      .titulo-central {
        font-size: 24px;
      }

      .subtitulo {
        font-size: 13px;
        line-height: 1.35;
      }

      .sesion-panel {
        grid-template-columns: 1fr;
      }

      .sesion-panel .btn-secundario {
        width: 100%;
      }

      .toolbar-panel {
        align-items: stretch;
      }

      .toolbar-left {
        justify-content: space-between;
        width: 100%;
      }

      .tabla-shell {
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .tabla-scroll {
        max-width: none;
        overflow: visible;
        border-radius: 0;
      }

      table,
      thead,
      tbody,
      tr,
      th,
      td {
        display: block;
      }

      table {
        min-width: 0;
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 12px;
        font-size: 14px;
        overflow: visible;
      }

      thead {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      tbody tr {
        overflow: hidden;
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        background: rgba(8, 18, 22, 0.96);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18);
      }

      tbody td,
      tbody tr:nth-child(even) td {
        display: grid;
        grid-template-columns: minmax(105px, 38%) minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        min-height: 42px;
        padding: 10px 12px;
        border-width: 0 0 1px;
        text-align: left;
        background: transparent;
        overflow-wrap: anywhere !important;
        word-break: normal !important;
      }

      tbody td:last-child {
        border-bottom: 0;
      }

      tbody td::before {
        content: attr(data-label);
        color: var(--text-soft);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      tbody td:first-child {
        grid-template-columns: 1fr auto;
        background: rgba(255, 139, 51, 0.12);
        font-weight: 800;
      }

      tbody td:first-child::before {
        content: "Rendicion";
      }

      tbody td:nth-child(8),
      tbody td:nth-child(9) {
        align-items: stretch;
      }

      tbody td:nth-child(8) a,
      tbody td:nth-child(9) a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 9px 12px;
        border-radius: 12px;
        background: rgba(157, 211, 255, 0.12);
        border: 1px solid rgba(157, 211, 255, 0.28);
        text-align: center;
      }

      .estado-pill {
        width: fit-content;
        min-height: 28px;
      }

      #toast {
        top: auto;
        right: 10px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        left: 10px;
        max-width: none;
      }
    }

    @media (max-width: 390px) {
      body {
        padding-left: 8px;
        padding-right: 8px;
      }

      .encabezado-principal,
      .toolbar-panel {
        border-radius: 16px;
      }

      .titulo-central {
        font-size: 22px;
      }

      .subtitulo {
        display: none;
      }

      .toolbar-actions {
        grid-template-columns: 1fr;
      }

      tbody td,
      tbody tr:nth-child(even) td {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      tbody td:first-child {
        grid-template-columns: 1fr auto;
      }
    }
  </style>
    <script src="/static/utils.js"></script>
</head>
<body>
  <div class="encabezado-principal">
    <div class="marca-principal">
      <img src="/shared-static/img/logo-atc.png" alt="Logo ATC" class="logo-principal" />
      <div>
        <h1 class="titulo-central">Mis Rendiciones</h1>
        <p class="subtitulo">Aqui puedes revisar el estado de tus rendiciones sin realizar acciones.</p>
      </div>
    </div>
    <div class="sesion-panel">
      <span id="sesionInfo"></span>
      <button type="button" class="btn-secundario" onclick="cerrarSesion()">Cerrar sesion</button>
    </div>
  </div>

  <div class="toolbar-panel">
    <div class="toolbar-left">
      Total
      <span id="contadorRegistros" class="pill">0</span>
    </div>
    <div class="toolbar-actions">
      <a id="btnVolver" class="btn-secundario" href="/?form=tecnicos&token={{ token|default('') }}">Volver</a>
      <button type="button" class="btn-primario" onclick="cargarRendiciones()">Actualizar</button>
    </div>
  </div>

  <div id="estadoCarga" class="estado-cargando">Cargando rendiciones...</div>

  <div id="tablaWrapper" class="tabla-shell" style="display:none;">
    <div class="tabla-scroll">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Tipo de Gasto</th>
            <th>Fecha de Documento</th>
            <th>Monto Total</th>
            <th>Documento</th>
            <th>Cliente</th>
            <th>ODT</th>
            <th>Rendiciones</th>
            <th>Imagen</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="tablaBody"></tbody>
      </table>
    </div>
  </div>

  <div id="estadoVacio" class="estado-vacio" style="display:none;">No tienes rendiciones registradas.</div>
  <div id="toast"></div>

  <script>
    const tokenPlantilla = {{ token|tojson }};
    const tecnicoPlantilla = {{ tecnico|tojson }};
    let tokenSesion = "";
    let tecnicoSesion = "";

    function normalizarTexto(valor) {
      return String(valor || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = String(text || "");
      return div.innerHTML;
    }

    function mostrarError(texto) {
      const t = document.getElementById("toast");
      if (!t) return;
      t.className = "error";
      t.textContent = texto;
      t.style.display = "block";
      clearTimeout(mostrarError._id);
      mostrarError._id = setTimeout(() => { t.style.display = "none"; }, 2800);
    }

    function obtenerTokenActivo() {
      const qp = new URLSearchParams(window.location.search).get("token") || "";
      const ls = localStorage.getItem("atc_token") || "";
      const base = String(tokenPlantilla || "").trim();
      const token = qp || ls || base;
      if (token) localStorage.setItem("atc_token", token);
      return token;
    }


    function montoCLP(valor) {
      const n = Number(valor);
      if (!Number.isFinite(n)) return String(valor || "");
      return n.toLocaleString("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 });
    }

    function crearEnlaceSeguro(url, texto) {
      const href = String(url || "").trim();
      if (!href) return "";
      return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(texto)}</a>`;
    }

    function extraerEnlaces(valor, etiqueta, idRendicion) {
      const texto = String(valor || "").trim();
      if (!texto) return "";
      const partes = texto.split(/\r?\n|;/).map((x) => x.trim()).filter(Boolean);
      const enlaces = [];
      partes.forEach((chunk) => {
        const matchFormula = chunk.match(/=HYPER(?:LINK|VINCULO)\(\s*"([^"]+)",\s*"([^"]+)"\s*\)/i);
        if (matchFormula?.[1]) {
          enlaces.push(crearEnlaceSeguro(matchFormula[1], `${etiqueta} ${idRendicion}`));
          return;
        }
        const matchAbsolute = chunk.match(/(https?:\/\/[^\s")]+)/i);
        if (matchAbsolute?.[1]) {
          enlaces.push(crearEnlaceSeguro(matchAbsolute[1], `${etiqueta} ${idRendicion}`));
          return;
        }
        const matchRelative = chunk.match(/(\/[^\s")<>]+)/i);
        if (matchRelative?.[1]) {
          enlaces.push(crearEnlaceSeguro(matchRelative[1], `${etiqueta} ${idRendicion}`));
        }
      });
      return enlaces.filter(Boolean).join("<br>");
    }

    function documentoTexto(row) {
      const doc = String(row?.documento || "").trim();
      if (doc) return doc;
      const tipo = String(row?.tipoDocumento || "").trim();
      const nro = String(row?.nroDocumento || "").trim();
      return [tipo, nro].filter(Boolean).join(" ");
    }

    function estadoRevision(row) {
      const raw = String(row?.estadoRevision || "").trim() || "Pendiente";
      const n = normalizarTexto(raw);
      if (n.includes("acept")) return { text: "Aceptado", css: "aceptado" };
      if (n.includes("rechaz")) return { text: "Rechazado", css: "rechazado" };
      return { text: "Pendiente", css: "pendiente" };
    }

    function setEstadoVista({ cargando = false, mostrarTabla = false, vacio = false }) {
      const estadoCarga = document.getElementById("estadoCarga");
      const tablaWrapper = document.getElementById("tablaWrapper");
      const estadoVacio = document.getElementById("estadoVacio");
      if (estadoCarga) estadoCarga.style.display = cargando ? "block" : "none";
      if (tablaWrapper) tablaWrapper.style.display = mostrarTabla ? "block" : "none";
      if (estadoVacio) estadoVacio.style.display = vacio ? "block" : "none";
    }

    function actualizarContador(total) {
      const el = document.getElementById("contadorRegistros");
      if (el) el.textContent = String(total);
    }

    async function validarSesion() {
      tokenSesion = obtenerTokenActivo();
      if (!tokenSesion) {
        window.location.href = "/?form=login&next=auto";
        return false;
      }
      try {
        const data = await api(`/api/usuario-actual?token=${encodeURIComponent(tokenSesion)}`);
        const usuario = String(data?.usuario || "").trim();
        if (!usuario || usuario === "Desconocido") {
          window.location.href = "/?form=login&next=auto";
          return false;
        }
        tecnicoSesion = usuario;
        document.getElementById("sesionInfo").textContent = usuario;
        return true;
      } catch (_) {
        window.location.href = "/?form=login&next=auto";
        return false;
      }
    }

    async function cerrarSesion() {
      try {
        if (tokenSesion) {
          await fetch(`/api/logout?token=${encodeURIComponent(tokenSesion)}`, { method: "POST" });
        }
      } catch (_) {
        // Ignorado: siempre redireccionamos.
      }
      window.location.href = "/?form=login&next=auto";
    }

    function volverATecnicos() {
      const q = tokenSesion ? `&token=${encodeURIComponent(tokenSesion)}` : "";
      window.location.href = `/?form=tecnicos${q}`;
    }

    function renderTabla(rows) {
      const tbody = document.getElementById("tablaBody");
      if (!tbody) return;
      tbody.innerHTML = "";

      const registros = Array.isArray(rows) ? rows : [];
      actualizarContador(registros.length);

      if (!registros.length) {
        setEstadoVista({ cargando: false, mostrarTabla: false, vacio: true });
        return;
      }

      const fragment = document.createDocumentFragment();
      registros.forEach((row) => {
        const idRendicion = row?.id ?? "";
        const estado = estadoRevision(row);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td data-label="ID">${escapeHtml(idRendicion)}</td>
          <td data-label="Tipo de Gasto">${escapeHtml(row?.tipoGasto || "")}</td>
          <td data-label="Fecha">${escapeHtml(row?.fechaDocumento || "")}</td>
          <td data-label="Monto">${escapeHtml(montoCLP(row?.montoTotal))}</td>
          <td data-label="Documento">${escapeHtml(documentoTexto(row))}</td>
          <td data-label="Cliente" class="text-left">${escapeHtml(row?.cliente || "")}</td>
          <td data-label="ODT">${escapeHtml(row?.odt || "")}</td>
          <td data-label="Rendicion">${extraerEnlaces(row?.urlInforme, "Rendicion", idRendicion)}</td>
          <td data-label="Imagen">${extraerEnlaces(row?.urlBoleta, "Imagen", idRendicion)}</td>
          <td data-label="Estado"><span class="estado-pill ${escapeHtml(estado.css)}">${escapeHtml(estado.text)}</span></td>
        `;
        fragment.appendChild(tr);
      });
      tbody.appendChild(fragment);
      setEstadoVista({ cargando: false, mostrarTabla: true, vacio: false });
    }

    async function cargarRendiciones() {
      setEstadoVista({ cargando: true, mostrarTabla: false, vacio: false });
      try {
        const tecnicoObjetivo = String(tecnicoSesion || tecnicoPlantilla || "").trim();
        const params = new URLSearchParams();
        if (tecnicoObjetivo) params.set("tecnico", tecnicoObjetivo);
        params.set("pendientes", "false");
        const data = await api(`/api/rendiciones?${params.toString()}`);
        renderTabla(Array.isArray(data) ? data : []);
      } catch (err) {
        setEstadoVista({ cargando: false, mostrarTabla: false, vacio: true });
        mostrarError(`Error cargando rendiciones: ${err.message}`);
      }
    }

    window.addEventListener("load", async () => {
      const ok = await validarSesion();
      if (!ok) return;
      await cargarRendiciones();
