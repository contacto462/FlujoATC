<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/favicon-180.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal Cliente · Cambiar clave</title>
  <style>
    :root {
      --bg-1: #0a1c20;
      --bg-2: #10272d;
      --bg-3: #17363d;
      --panel-border: rgba(255, 255, 255, 0.10);
      --text-main: #f4f8f9;
      --text-soft: #c0cfd4;
      --field-bg: #091217;
      --field-border: rgba(194, 210, 218, 0.22);
      --field-focus: rgba(255, 117, 35, 0.65);
      --button-start: #ff6e23;
      --button-end: #ff8b33;
      --button-text: #ffffff;
      --shadow-main: rgba(0, 0, 0, 0.32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 18% 22%, rgba(255, 255, 255, 0.05), transparent 24%),
        radial-gradient(circle at 78% 12%, rgba(255, 125, 53, 0.08), transparent 18%),
        linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 42%, var(--bg-3) 100%);
      overflow: hidden;
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      position: relative;
      z-index: 1;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 28px 28px 26px;
      border-radius: 28px;
      background: rgba(9, 22, 26, 0.96);
      border: 1px solid var(--panel-border);
      box-shadow: 0 30px 70px var(--shadow-main), inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    h2 { margin: 0 0 4px; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; }
    .subtitle { margin: 0 0 22px; color: var(--text-soft); font-size: 0.92rem; }

    .form-grid { display: grid; gap: 14px; }

    label { display: block; margin: 0 0 8px; font-size: 0.96rem; font-weight: 700; color: #ffffff; }

    input, button { width: 100%; border-radius: 18px; font-size: 1rem; font-family: inherit; }

    input {
      border: 1px solid var(--field-border);
      background: var(--field-bg);
      color: var(--text-main);
      padding: 15px 16px;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    input:focus {
      border-color: var(--field-focus);
      box-shadow: 0 0 0 4px rgba(255, 110, 35, 0.12);
      transform: translateY(-1px);
    }

    button {
      margin-top: 6px;
      padding: 15px 18px;
      border: none;
      color: var(--button-text);
      background: linear-gradient(135deg, var(--button-start) 0%, var(--button-end) 100%);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(255, 110, 35, 0.25);
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.04); }
    button:disabled { opacity: .72; cursor: wait; transform: none; filter: none; }

    .msg { min-height: 22px; margin-top: 12px; font-size: 0.95rem; font-weight: 700; }
    .ok { color: #59d48a; }
    .err { color: #ff8787; }

    @media (max-width: 640px) {
      .card { padding: 22px 18px 20px; border-radius: 24px; }
      h2 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>Define tu nueva clave</h2>
      <p class="subtitle">Hola {{ display_name }}, es tu primer ingreso al portal. Por seguridad, define una clave propia antes de continuar.</p>

      <div class="form-grid">
        <div>
          <label for="claveNueva">Nueva clave</label>
          <input id="claveNueva" type="password" autocomplete="new-password" placeholder="Mínimo 4 caracteres" />
        </div>
        <div>
          <label for="claveConfirmar">Confirmar clave</label>
          <input id="claveConfirmar" type="password" autocomplete="new-password" placeholder="Repite la clave" />
        </div>
        <button type="button" id="btnGuardar">Guardar y continuar</button>
      </div>

      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script>
    function setMsg(texto, ok) {
      const el = document.getElementById("msg");
      el.textContent = texto || "";
      el.className = `msg ${ok ? "ok" : "err"}`;
    }

    async function guardar() {
      const nueva = document.getElementById("claveNueva").value;
      const confirmar = document.getElementById("claveConfirmar").value;

      if (nueva.length < 4) {
        setMsg("La clave debe tener al menos 4 caracteres.", false);
        return;
      }
      if (nueva !== confirmar) {
        setMsg("Las claves no coinciden.", false);
        return;
      }

      const btn = document.getElementById("btnGuardar");
      btn.disabled = true;
      btn.textContent = "Guardando...";
      setMsg("", true);

      try {
        const res = await fetch("/api/portal-cliente/cambiar-clave", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: nueva }),
        });
        const payload = await res.json();
        if (!res.ok || !payload?.ok) {
          throw new Error(payload?.detail || "No se pudo guardar la clave.");
        }
        setMsg("Clave actualizada. Redirigiendo...", true);
        window.location.href = "/portal-cliente";
      } catch (err) {
        setMsg(err.message || "No se pudo guardar la clave.", false);
        btn.disabled = false;
        btn.textContent = "Guardar y continuar";
      }
    }

    document.getElementById("btnGuardar").addEventListener("click", guardar);
    document.getElementById("claveConfirmar").addEventListener("keydown", (e) => {
      if (e.key === "Enter") guardar();
    });
  </script>
</body>
</html>
