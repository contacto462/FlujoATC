<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/favicon-180.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal Cliente · Iniciar Sesión</title>
  <style>
    :root {
      --bg-1: #0a1c20;
      --bg-2: #10272d;
      --bg-3: #17363d;
      --panel-border: rgba(255, 255, 255, 0.10);
      --text-main: #f4f8f9;
      --text-soft: #c0cfd4;
      --field-bg: #091217;
      --field-border: rgba(194, 210, 218, 0.22);
      --field-focus: rgba(255, 117, 35, 0.65);
      --button-start: #ff6e23;
      --button-end: #ff8b33;
      --button-text: #ffffff;
      --shadow-main: rgba(0, 0, 0, 0.32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 18% 22%, rgba(255, 255, 255, 0.05), transparent 24%),
        radial-gradient(circle at 78% 12%, rgba(255, 125, 53, 0.08), transparent 18%),
        linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 42%, var(--bg-3) 100%);
      overflow: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 30% 65%, rgba(255, 255, 255, 0.03), transparent 28%),
        radial-gradient(circle at 76% 78%, rgba(255, 122, 43, 0.10), transparent 18%);
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      position: relative;
      z-index: 1;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 28px 28px 26px;
      border-radius: 28px;
      background: rgba(9, 22, 26, 0.96);
      border: 1px solid var(--panel-border);
      box-shadow:
        0 30px 70px var(--shadow-main),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .head {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 18px;
      margin-bottom: 8px;
    }

    .title-wrap { flex: 1; min-width: 0; }

    h2 {
      margin: 0;
      font-size: 2.05rem;
      line-height: 1.02;
      letter-spacing: -0.035em;
      font-weight: 800;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--text-soft);
      font-size: 0.92rem;
    }

    .form-grid { display: grid; gap: 14px; }

    label {
      display: block;
      margin: 0 0 8px;
      font-size: 0.96rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #ffffff;
    }

    input, button {
      width: 100%;
      border-radius: 18px;
      font-size: 1rem;
      font-family: inherit;
    }

    input {
      border: 1px solid var(--field-border);
      background: var(--field-bg);
      color: var(--text-main);
      padding: 15px 16px;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }

    input::placeholder { color: #94a6ad; }

    input:focus {
      border-color: var(--field-focus);
      box-shadow: 0 0 0 4px rgba(255, 110, 35, 0.12);
      transform: translateY(-1px);
    }

    button {
      margin-top: 6px;
      padding: 15px 18px;
      border: none;
      color: var(--button-text);
      background: linear-gradient(135deg, var(--button-start) 0%, var(--button-end) 100%);
      font-weight: 800;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(255, 110, 35, 0.25);
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
      box-shadow: 0 16px 30px rgba(255, 110, 35, 0.32);
    }

    button:disabled {
      opacity: .72;
      cursor: wait;
      transform: none;
      filter: none;
    }

    .msg {
      min-height: 22px;
      margin-top: 12px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .ok { color: #59d48a; }
    .err { color: #ff8787; }

    @media (max-width: 640px) {
      .card { padding: 22px 18px 20px; border-radius: 24px; }
      .head { flex-direction: column; align-items: flex-start; gap: 12px; }
      h2 { font-size: 1.78rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <img src="/shared-static/img/logo-atc.png" alt="Logo ATC" style="height:64px;width:auto;display:block;object-fit:contain;flex-shrink:0;" />
        <h2>Portal Cliente</h2>
      </div>
      <p class="subtitle"></p>

      <div class="form-grid">
        <div>
          <label for="usuarioInput">Usuario o RUT</label>
          <input id="usuarioInput" type="text" autocomplete="username" placeholder="Usuario de tu empresa o tu RUT" />
        </div>

        <div>
          <label for="claveInput">Contraseña</label>
          <input id="claveInput" type="password" autocomplete="current-password" placeholder="******" />
        </div>

        <button type="button" id="btnLogin">Entrar</button>
      </div>

      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script>
    function setMsg(texto, ok) {
      const el = document.getElementById("msg");
      el.textContent = texto || "";
      el.className = `msg ${ok ? "ok" : "err"}`;
    }

    async function login() {
      const username = document.getElementById("usuarioInput").value.trim();
      const password = document.getElementById("claveInput").value;

      if (!username || !password) {
        setMsg("Completa usuario y contraseña.", false);
        return;
      }

      const btn = document.getElementById("btnLogin");
      btn.disabled = true;
      btn.textContent = "Ingresando...";
      setMsg("", true);

      try {
        const res = await fetch("/api/portal-cliente/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const payload = await res.json();
        if (!res.ok || !payload?.ok) {
          throw new Error(payload?.detail || "Credenciales inválidas");
        }
        setMsg("Ingreso correcto. Redirigiendo...", true);
        window.location.href = payload.redirect || "/portal-cliente";
      } catch (err) {
        setMsg(err.message || "No se pudo iniciar sesión", false);
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    }

    document.getElementById("btnLogin").addEventListener("click", login);
    document.getElementById("claveInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
    document.getElementById("usuarioInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
