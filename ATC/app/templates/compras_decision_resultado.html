<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/favicon-180.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">

  <meta charset="UTF-8">
  <title>{{ titulo }} – Alguien Te Cuida</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f6fa; padding: 40px; margin: 0; }
    .card {
      background: #fff; padding: 30px; border-radius: 10px;
      max-width: 520px; margin: auto; text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }
    .badge {
      display: inline-block; margin-top: 12px;
      padding: 6px 14px; border-radius: 999px;
      font-size: 13px; font-weight: 700; color: #fff;
      background: {{ color }};
    }
    p { font-size: 15px; line-height: 1.6; margin-top: 20px; }
    img { height: 60px; margin-bottom: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://i.imgur.com/VgLG9Ei.png" alt="Alguien Te Cuida">
    <h2>{{ titulo }}</h2>
    <span class="badge" style="background:{{ color }};">{{ titulo | upper }}</span>
    <p>{{ mensaje }}</p>
  </div>
</body>
</html>
