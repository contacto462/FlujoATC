<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabla Protocolos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-1:#08161a;
      --bg-2:#10252c;
      --bg-3:#17363d;
      --surface:rgba(255,255,255,.06);
      --surface-2:rgba(255,255,255,.04);
      --border:rgba(255,255,255,.11);
      --text:#f4f8f9;
      --muted:#bed0d6;
      --orange:#ff6e23;
      --orange-2:#ff8b33;
      --teal:#1f9c83;
      --ok-bg:rgba(37,196,131,.14);
      --ok-color:#83ffc4;
      --ok-border:rgba(37,196,131,.28);
      --bad-bg:rgba(255,116,116,.13);
      --bad-color:#ffb3b3;
      --bad-border:rgba(255,116,116,.24);
      --radius:20px;
      --shadow:0 24px 56px rgba(0,0,0,.32);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 16% 10%,rgba(255,255,255,.04),transparent 22%),
        radial-gradient(circle at 84% 8%,rgba(255,118,43,.09),transparent 20%),
        linear-gradient(145deg,var(--bg-1) 0%,var(--bg-2) 44%,var(--bg-3) 100%);
      min-height:100%;
      padding:28px 24px 40px;
    }
    .shell{width:min(1440px,100%);margin:0 auto}

    /* ── header ── */
    .page-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:28px;
      flex-wrap:wrap;
    }
    .page-header-left{display:flex;align-items:center;gap:16px}
    .header-icon{
      width:52px;height:52px;border-radius:16px;
      background:linear-gradient(135deg,#2f5b72,#24495c);
      display:grid;place-items:center;font-size:22px;font-weight:800;
      flex-shrink:0;box-shadow:0 10px 22px rgba(0,0,0,.22);
    }
    .page-header h1{font-size:26px;font-weight:800;letter-spacing:-.025em}
    .page-header p{color:var(--muted);font-size:14px;margin-top:3px}
    .nav-btns{display:flex;gap:10px;flex-wrap:wrap}
    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:9px 16px;border-radius:12px;font-size:13px;font-weight:700;
      border:1px solid var(--border);background:var(--surface-2);
      color:var(--text);cursor:pointer;text-decoration:none;transition:all .18s ease;
    }
    .btn:hover{background:rgba(255,255,255,.085);border-color:rgba(255,255,255,.2)}
    .btn-primary{
      background:linear-gradient(135deg,var(--orange),var(--orange-2));
      border-color:rgba(255,118,43,.5);color:#fff;
    }
    .btn-primary:hover{filter:brightness(1.08)}

    /* ── card ── */
    .card{
      border:1px solid var(--border);border-radius:var(--radius);
      background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
      box-shadow:var(--shadow);padding:20px;margin-bottom:16px;
    }

    /* ── filters ── */
    .filters{
      display:grid;
      grid-template-columns:1.2fr 1.2fr .85fr .72fr .72fr auto;
      gap:14px;align-items:end;
    }
    .field-group label{
      display:block;font-size:12px;font-weight:700;color:var(--muted);
      text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px;
    }
    input,select{
      width:100%;height:40px;padding:0 12px;
      border:1px solid rgba(255,255,255,.13);border-radius:11px;
      background:#0b1a1f;color:var(--text);font-size:13px;font-family:inherit;
      outline:none;transition:border-color .18s,box-shadow .18s;
      appearance:auto;
    }
    input::placeholder{color:rgba(255,255,255,.3)}
    input:focus,select:focus{
      border-color:rgba(255,118,43,.6);
      box-shadow:0 0 0 3px rgba(255,118,43,.11);
    }

    /* ── meta bar ── */
    .meta-bar{
      display:flex;align-items:center;justify-content:space-between;
      gap:14px;flex-wrap:wrap;
    }
    .meta-bar .count{font-size:13px;font-weight:700;color:var(--muted)}
    .meta-bar .count span{color:var(--text)}
    .status-msg{font-size:13px;font-weight:600;min-height:20px}
    .err{color:#ffb3b3}.ok-text{color:#83ffc4}.neutral{color:var(--muted)}

    /* ── table ── */
    .table-scroll{overflow:auto;border-radius:16px;border:1px solid var(--border)}
    table{width:100%;min-width:1200px;border-collapse:collapse}
    thead th{
      position:sticky;top:0;z-index:2;
      background:#0f2028;
      padding:10px 12px;font-size:11px;font-weight:700;
      color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
      border-bottom:1px solid var(--border);white-space:nowrap;
    }
    tbody td{
      padding:10px 12px;font-size:13px;
      border-bottom:1px solid rgba(255,255,255,.06);
      vertical-align:middle;color:var(--text);
    }
    tbody tr:last-child td{border-bottom:none}
    tbody tr:hover td{background:rgba(255,255,255,.03)}

    /* ── pill ── */
    .pill{
      display:inline-flex;align-items:center;justify-content:center;
      padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;
      white-space:nowrap;
    }
    .pill.ok{background:var(--ok-bg);color:var(--ok-color);border:1px solid var(--ok-border)}
    .pill.bad{background:var(--bad-bg);color:var(--bad-color);border:1px solid var(--bad-border)}
    .pill.neutral{background:rgba(255,255,255,.07);color:var(--muted);border:1px solid rgba(255,255,255,.1)}

    /* ── obs btn ── */
    .obs-btn{
      display:inline-flex;align-items:center;gap:5px;
      padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;
      border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.055);
      color:var(--text);cursor:pointer;transition:all .15s ease;white-space:nowrap;
    }
    .obs-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
    .obs-empty{color:rgba(255,255,255,.25);font-size:12px}

    .id-cell{color:var(--muted);font-size:12px;font-weight:600}
    .date-cell{white-space:nowrap;font-size:12px;color:var(--muted)}
    .text-cell{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ── modal ── */
    .modal-backdrop{
      display:none;position:fixed;inset:0;z-index:100;
      background:rgba(0,0,0,.62);backdrop-filter:blur(6px);
      align-items:center;justify-content:center;padding:20px;
    }
    .modal-backdrop.open{display:flex}
    .modal{
      background:linear-gradient(160deg,#122028,#0d1c22);
      border:1px solid var(--border);border-radius:var(--radius);
      box-shadow:0 40px 80px rgba(0,0,0,.5);
      width:min(560px,100%);padding:28px;position:relative;
    }
    .modal h3{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px}
    .modal h3 .modal-badge{
      padding:3px 10px;border-radius:8px;font-size:12px;
      background:rgba(47,91,114,.4);border:1px solid rgba(47,91,114,.6);color:#b5d8e8;
    }
    .modal-body{
      font-size:14px;line-height:1.7;color:#d5e5ea;
      background:rgba(0,0,0,.22);border-radius:12px;
      padding:16px;border:1px solid rgba(255,255,255,.08);
      max-height:340px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
    }
    .modal-close{
      margin-top:18px;width:100%;padding:10px;border-radius:11px;
      background:rgba(255,255,255,.07);border:1px solid var(--border);
      color:var(--text);font-weight:700;font-size:13px;cursor:pointer;
      transition:all .15s ease;font-family:inherit;
    }
    .modal-close:hover{background:rgba(255,255,255,.12)}

    /* ── empty / loading ── */
    .empty-row td{
      padding:32px 16px;text-align:center;
      color:var(--muted);font-size:14px;font-weight:600;
    }

    @media(max-width:900px){
      body{padding:16px 14px 32px}
      .filters{grid-template-columns:1fr}
      .page-header{flex-direction:column;align-items:flex-start}
      .nav-btns{width:100%}
      .nav-btns .btn{flex:1;justify-content:center}
    }
  </style>
</head>
<body>
<main class="shell">

  <!-- header -->
  <header class="page-header">
    <div class="page-header-left">
      <div class="header-icon">P</div>
      <div>
        <h1>Tabla Protocolos</h1>
        <p>Consulta de registros preventivos e intrusivos</p>
      </div>
    </div>
    <nav class="nav-btns">
      <a class="btn" href="/?form=panelSelectorCoordinacion&token={{ token|default('') }}">← Panel</a>
      <a class="btn" href="/?form=coordinacion&token={{ token|default('') }}">Coordinación</a>
    </nav>
  </header>

  <!-- filters -->
  <div class="card">
    <div class="filters">
      <div class="field-group">
        <label for="cliente">Cliente</label>
        <input id="cliente" placeholder="Todos los clientes" />
      </div>
      <div class="field-group">
        <label for="sucursal">Sucursal</label>
        <input id="sucursal" placeholder="Todas las sucursales" />
      </div>
      <div class="field-group">
        <label for="tipo">Tipo</label>
        <select id="tipo">
          <option value="">Todos</option>
          <option>Preventivo</option>
          <option>Intrusivo</option>
        </select>
      </div>
      <div class="field-group">
        <label for="desde">Desde</label>
        <input id="desde" type="date" />
      </div>
      <div class="field-group">
        <label for="hasta">Hasta</label>
        <input id="hasta" type="date" />
      </div>
      <button class="btn btn-primary" type="button" onclick="cargar()">Aplicar</button>
    </div>
  </div>

  <!-- meta bar -->
  <div class="card" style="padding:14px 20px">
    <div class="meta-bar">
      <div class="count">Mostrando <span id="total">0</span> registros</div>
      <div style="display:flex;align-items:center;gap:14px">
        <span id="msg" class="status-msg neutral"></span>
        <button class="btn" type="button" onclick="limpiar()">Limpiar filtros</button>
      </div>
    </div>
  </div>

  <!-- table -->
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Fecha</th>
          <th>Cliente</th>
          <th>Sucursal</th>
          <th>Tipo</th>
          <th>Puesto</th>
          <th>Operador</th>
          <th>Detectado</th>
          <th>Efectivo</th>
          <th>Sirena</th>
          <th>Voz</th>
          <th>Carab.</th>
          <th>Alpha3</th>
          <th>Informado</th>
          <th>Bitácora</th>
          <th>Exitoso</th>
          <th>Observaciones</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr class="empty-row"><td colspan="17">Cargando registros...</td></tr>
      </tbody>
    </table>
  </div>

</main>

<!-- modal observaciones -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal">
    <h3>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      Observaciones
      <span class="modal-badge" id="modalBadge"></span>
    </h3>
    <div class="modal-body" id="modalBody"></div>
    <button class="modal-close" onclick="document.getElementById('modalBackdrop').classList.remove('open')">Cerrar</button>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (m) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

  function pill(value) {
    const v = String(value ?? "").trim().toUpperCase();
    if (!v || v === "-") return `<span class="pill neutral">—</span>`;
    if (v === "SI") return `<span class="pill ok">Sí</span>`;
    if (v === "NO") return `<span class="pill bad">No</span>`;
    return `<span class="pill neutral">${esc(v)}</span>`;
  }

  function obsCell(texto, id, cliente) {
    if (!texto || !texto.trim()) return `<span class="obs-empty">—</span>`;
    return `<button class="obs-btn" onclick="openModal(${id},'${esc(cliente)}')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      Ver
    </button>`;
  }

  const _obsMap = {};

  function openModal(id, cliente) {
    $("modalBody").textContent = _obsMap[id] || "(sin texto)";
    $("modalBadge").textContent = cliente;
    $("modalBackdrop").classList.add("open");
  }

  function closeModal(e) {
    if (e.target === $("modalBackdrop")) $("modalBackdrop").classList.remove("open");
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") $("modalBackdrop").classList.remove("open");
  });

  function params() {
    const qs = new URLSearchParams();
    const cliente = $("cliente").value.trim();
    const sucursal = $("sucursal").value.trim();
    const tipo = $("tipo").value.trim();
    const desde = $("desde").value;
    const hasta = $("hasta").value;
    if (cliente) qs.set("cliente", cliente);
    if (sucursal) qs.set("sucursal", sucursal);
    if (tipo) qs.set("tipo_protocolo", tipo);
    if (desde) qs.set("fecha_desde", desde);
    if (hasta) qs.set("fecha_hasta", hasta);
    qs.set("limit", "1000");
    return qs.toString();
  }

  async function cargar() {
    setMsg("Cargando...", "neutral");
    try {
      const res = await fetch(`/api/protocolos/registros?${params()}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data?.detail || "Error al cargar.");
      const rows = Array.isArray(data) ? data : [];
      $("total").textContent = rows.length;

      Object.keys(_obsMap).forEach(k => delete _obsMap[k]);
      rows.forEach(r => { if (r.observaciones) _obsMap[r.id] = r.observaciones; });

      $("tbody").innerHTML = rows.length ? rows.map((r) => `
        <tr>
          <td class="id-cell">${esc(r.id)}</td>
          <td class="date-cell">${esc(r.fecha)}</td>
          <td class="text-cell" title="${esc(r.cliente)}">${esc(r.cliente)}</td>
          <td class="text-cell" title="${esc(r.sucursal)}">${esc(r.sucursal)}</td>
          <td>${esc(r.tipo_protocolo)}</td>
          <td>${esc(r.puesto)}</td>
          <td>${esc(r.operador)}</td>
          <td>${pill(r.detectado)}</td>
          <td>${pill(r.efectivo)}</td>
          <td>${pill(r.sirena)}</td>
          <td>${pill(r.voz)}</td>
          <td>${pill(r.carabineros)}</td>
          <td>${pill(r.alpha3)}</td>
          <td>${pill(r.informado)}</td>
          <td>${pill(r.bitacora)}</td>
          <td>${pill(r.protocolo_exitoso)}</td>
          <td>${obsCell(r.observaciones, r.id, r.cliente)}</td>
        </tr>`).join("") :
        `<tr class="empty-row"><td colspan="17">Sin registros para los filtros seleccionados.</td></tr>`;

      setMsg("Tabla actualizada.", "ok-text");
    } catch (err) {
      $("tbody").innerHTML = `<tr class="empty-row"><td colspan="17">No se pudo cargar la información.</td></tr>`;
      setMsg(err.message || "Error inesperado.", "err");
    }
  }

  function limpiar() {
    ["cliente","sucursal","desde","hasta"].forEach(id => $(id).value = "");
    $("tipo").value = "";
    cargar();
  }

  function setMsg(text, cls) {
    const el = $("msg");
    el.textContent = text;
    el.className = "status-msg " + cls;
  }

  cargar();
</script>
<script src="/static/auth-guard.js"></script>
</body>
</html>
