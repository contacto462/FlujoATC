<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabla Protocolos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-1:#08161a; --bg-2:#10252c; --bg-3:#17363d;
      --border:rgba(255,255,255,.10);
      --text:#f4f8f9; --muted:#b0c8cf;
      --orange:#ff6e23; --orange-2:#ff8b33;
      --ok:#25c483; --bad:#ff6b6b;
      --radius:18px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%}
    body{
      font-family:'Inter',system-ui,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 10%,rgba(255,118,43,.09),transparent 26%),
        linear-gradient(145deg,var(--bg-1) 0%,var(--bg-2) 48%,var(--bg-3) 100%);
      padding:24px 20px 40px;
    }
    .shell{width:min(1480px,100%);margin:0 auto}

    /* header */
    .page-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
    .hd-left{display:flex;align-items:center;gap:14px}
    .hd-icon{
      width:46px;height:46px;border-radius:14px;flex-shrink:0;
      background:linear-gradient(135deg,#2f5b72,#1e3d4e);
      display:grid;place-items:center;font-size:18px;font-weight:800;
      box-shadow:0 8px 18px rgba(0,0,0,.28);
    }
    .hd-title{font-size:22px;font-weight:800;letter-spacing:-.02em}
    .hd-sub{font-size:13px;color:var(--muted);margin-top:2px}
    .nav-btns{display:flex;gap:8px}
    .btn{
      display:inline-flex;align-items:center;gap:6px;
      padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;
      border:1px solid var(--border);background:rgba(255,255,255,.05);
      color:var(--text);cursor:pointer;text-decoration:none;
      transition:background .15s,border-color .15s;
    }
    .btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18)}
    .btn-primary{background:linear-gradient(135deg,var(--orange),var(--orange-2));border-color:rgba(255,118,43,.4);color:#fff}
    .btn-primary:hover{filter:brightness(1.08)}

    /* filter card */
    .card{
      border:1px solid var(--border);border-radius:var(--radius);
      background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.03));
      padding:18px 20px;margin-bottom:14px;
    }
    .filters{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
    .fg{display:flex;flex-direction:column;gap:6px;flex:1;min-width:120px}
    .fg.narrow{flex:0 0 110px}
    .fg.date{flex:0 0 130px}
    label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
    input,select{
      height:38px;padding:0 11px;border-radius:9px;
      border:1px solid rgba(255,255,255,.12);background:#0b1a1f;
      color:var(--text);font-size:13px;font-family:inherit;outline:none;
      transition:border-color .15s,box-shadow .15s;width:100%;
    }
    input::placeholder{color:rgba(255,255,255,.28)}
    input:focus,select:focus{border-color:rgba(255,118,43,.55);box-shadow:0 0 0 3px rgba(255,118,43,.1)}

    /* meta */
    .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .count{font-size:13px;font-weight:600;color:var(--muted)}
    .count b{color:var(--text)}
    .status{font-size:12px;font-weight:600;min-height:18px}
    .ok-text{color:#6debb0}.err{color:#ff9b9b}.neutral{color:var(--muted)}

    /* table */
    .tbl-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    table{
      width:100%;border-collapse:collapse;
      table-layout:fixed;
    }

    /* column widths — total ~100% */
    col.c-id    {width:44px}
    col.c-fecha {width:118px}
    col.c-cli   {width:13%}
    col.c-suc   {width:11%}
    col.c-tipo  {width:76px}
    col.c-puesto{width:52px}
    col.c-oper  {width:11%}
    col.c-bool  {width:44px}   /* ×9 = 396px */
    col.c-obs   {width:58px}

    thead th{
      background:#0f2028;padding:9px 8px;
      font-size:10px;font-weight:700;color:var(--muted);
      text-transform:uppercase;letter-spacing:.06em;
      border-bottom:1px solid var(--border);
      white-space:nowrap;text-align:center;
    }
    thead th.left{text-align:left;padding-left:12px}

    tbody td{
      padding:9px 8px;font-size:12.5px;
      border-bottom:1px solid rgba(255,255,255,.055);
      vertical-align:middle;text-align:center;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    tbody td.left{text-align:left;padding-left:12px}
    tbody tr:last-child td{border-bottom:none}
    tbody tr:hover td{background:rgba(255,255,255,.03)}

    /* boolean indicators */
    .bi{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font-size:13px}
    .bi.yes{background:rgba(37,196,131,.15);color:#6debb0}
    .bi.no {background:rgba(255,107,107,.13);color:#ffb0b0}
    .bi.nd {color:rgba(255,255,255,.18);font-size:11px}

    /* id / date muted */
    .id-val{font-size:11px;font-weight:600;color:rgba(255,255,255,.35)}
    .date-val{font-size:12px;color:var(--muted);white-space:nowrap}

    /* tipo badge */
    .tipo-badge{
      display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;
    }
    .tipo-badge.prev{background:rgba(31,156,131,.18);color:#7ee8d2;border:1px solid rgba(31,156,131,.3)}
    .tipo-badge.intr{background:rgba(255,110,35,.16);color:#ffb57c;border:1px solid rgba(255,110,35,.28)}

    /* obs button */
    .obs-btn{
      display:inline-flex;align-items:center;gap:4px;
      padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;
      border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);
      color:var(--text);cursor:pointer;transition:all .14s;white-space:nowrap;
    }
    .obs-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
    .nd-text{color:rgba(255,255,255,.2);font-size:12px}

    .empty td{padding:28px 12px;text-align:center;color:var(--muted);font-size:13px;font-weight:600}

    /* modal */
    .backdrop{
      display:none;position:fixed;inset:0;z-index:200;
      background:rgba(0,0,0,.65);backdrop-filter:blur(8px);
      align-items:center;justify-content:center;padding:16px;
    }
    .backdrop.open{display:flex}
    .modal{
      background:linear-gradient(150deg,#122028,#0d1b22);
      border:1px solid var(--border);border-radius:var(--radius);
      box-shadow:0 40px 80px rgba(0,0,0,.55);
      width:min(520px,100%);padding:26px;
    }
    .modal-head{
      display:flex;align-items:center;gap:10px;margin-bottom:14px;
    }
    .modal-head h3{font-size:15px;font-weight:800;flex:1}
    .modal-meta{font-size:12px;color:var(--muted);font-weight:600}
    .modal-body{
      font-size:13.5px;line-height:1.7;color:#cde0e6;
      background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);
      border-radius:10px;padding:14px;
      max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
    }
    .modal-close{
      margin-top:16px;width:100%;padding:9px;border-radius:9px;
      background:rgba(255,255,255,.06);border:1px solid var(--border);
      color:var(--text);font-weight:700;font-size:13px;cursor:pointer;
      font-family:inherit;transition:background .14s;
    }
    .modal-close:hover{background:rgba(255,255,255,.11)}
  </style>
</head>
<body>
<main class="shell">

  <header class="page-header">
    <div class="hd-left">
      <div class="hd-icon">P</div>
      <div>
        <div class="hd-title">Tabla Protocolos</div>
        <div class="hd-sub">Registros preventivos e intrusivos</div>
      </div>
    </div>
    <nav class="nav-btns">
      <a class="btn" href="/?form=panelSelectorCoordinacion&token={{ token|default('') }}">← Panel</a>
      <a class="btn" href="/?form=coordinacion&token={{ token|default('') }}">Coordinación</a>
    </nav>
  </header>

  <div class="card">
    <div class="filters">
      <div class="fg">
        <label for="cliente">Cliente</label>
        <input id="cliente" placeholder="Todos" />
      </div>
      <div class="fg">
        <label for="sucursal">Sucursal</label>
        <input id="sucursal" placeholder="Todas" />
      </div>
      <div class="fg narrow">
        <label for="tipo">Tipo</label>
        <select id="tipo">
          <option value="">Todos</option>
          <option>Preventivo</option>
          <option>Intrusivo</option>
        </select>
      </div>
      <div class="fg date">
        <label for="desde">Desde</label>
        <input id="desde" type="date" />
      </div>
      <div class="fg date">
        <label for="hasta">Hasta</label>
        <input id="hasta" type="date" />
      </div>
      <button class="btn btn-primary" onclick="cargar()">Aplicar</button>
    </div>
  </div>

  <div class="card" style="padding:12px 20px">
    <div class="meta">
      <div class="count">Mostrando <b id="total">0</b> registros</div>
      <div style="display:flex;align-items:center;gap:12px">
        <span id="msg" class="status neutral"></span>
        <button class="btn" onclick="limpiar()">Limpiar</button>
      </div>
    </div>
  </div>

  <div class="tbl-wrap">
    <table>
      <colgroup>
        <col class="c-id">
        <col class="c-fecha">
        <col class="c-cli">
        <col class="c-suc">
        <col class="c-tipo">
        <col class="c-puesto">
        <col class="c-oper">
        <col class="c-bool"><col class="c-bool"><col class="c-bool">
        <col class="c-bool"><col class="c-bool"><col class="c-bool">
        <col class="c-bool"><col class="c-bool"><col class="c-bool">
        <col class="c-obs">
      </colgroup>
      <thead>
        <tr>
          <th class="left">ID</th>
          <th class="left">Fecha</th>
          <th class="left">Cliente</th>
          <th class="left">Sucursal</th>
          <th>Tipo</th>
          <th>Puesto</th>
          <th class="left">Operador</th>
          <th title="Detectado">Det.</th>
          <th title="Efectivo">Efec.</th>
          <th title="Sirena">Sir.</th>
          <th title="Voz">Voz</th>
          <th title="Carabineros">Car.</th>
          <th title="Alpha3">Alp.</th>
          <th title="Informado">Inf.</th>
          <th title="Bitácora">Bit.</th>
          <th title="Exitoso">Exit.</th>
          <th>Obs.</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr class="empty"><td colspan="17">Cargando...</td></tr>
      </tbody>
    </table>
  </div>

</main>

<!-- modal -->
<div class="backdrop" id="backdrop" onclick="bgClose(event)">
  <div class="modal">
    <div class="modal-head">
      <h3>Observaciones</h3>
      <span class="modal-meta" id="mMeta"></span>
    </div>
    <div class="modal-body" id="mBody"></div>
    <button class="modal-close" onclick="document.getElementById('backdrop').classList.remove('open')">Cerrar</button>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

  const obsStore = {};

  function bi(val) {
    const v = String(val ?? "").trim().toUpperCase();
    if (v === "SI") return `<span class="bi yes" title="Sí">✓</span>`;
    if (v === "NO") return `<span class="bi no"  title="No">✕</span>`;
    return `<span class="bi nd">—</span>`;
  }

  function tipoBadge(v) {
    const s = String(v || "").trim();
    if (!s) return "—";
    const cls = s.toLowerCase().startsWith("prev") ? "prev" : "intr";
    return `<span class="tipo-badge ${cls}">${esc(s)}</span>`;
  }

  function obsBtn(text, id, cliente) {
    if (!text?.trim()) return `<span class="nd-text">—</span>`;
    return `<button class="obs-btn" onclick="openModal(${id},'${esc(cliente).replace(/'/g,"\\'")}')">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Ver</button>`;
  }

  function openModal(id, cliente) {
    $("mBody").textContent = obsStore[id] || "";
    $("mMeta").textContent = cliente;
    $("backdrop").classList.add("open");
  }
  function bgClose(e) { if (e.target === $("backdrop")) $("backdrop").classList.remove("open"); }
  document.addEventListener("keydown", e => { if (e.key === "Escape") $("backdrop").classList.remove("open"); });

  function params() {
    const qs = new URLSearchParams();
    const v = id => $(id).value.trim();
    if (v("cliente"))  qs.set("cliente", v("cliente"));
    if (v("sucursal")) qs.set("sucursal", v("sucursal"));
    if (v("tipo"))     qs.set("tipo_protocolo", v("tipo"));
    if (v("desde"))    qs.set("fecha_desde", v("desde"));
    if (v("hasta"))    qs.set("fecha_hasta", v("hasta"));
    qs.set("limit","1000");
    return qs.toString();
  }

  async function cargar() {
    setMsg("Cargando...", "neutral");
    try {
      const res  = await fetch(`/api/protocolos/registros?${params()}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data?.detail || "Error al cargar.");
      const rows = Array.isArray(data) ? data : [];
      $("total").textContent = rows.length;
      Object.keys(obsStore).forEach(k => delete obsStore[k]);
      rows.forEach(r => { if (r.observaciones) obsStore[r.id] = r.observaciones; });

      $("tbody").innerHTML = rows.length
        ? rows.map(r => `<tr>
            <td class="left"><span class="id-val">${esc(r.id)}</span></td>
            <td class="left"><span class="date-val">${esc(r.fecha)}</span></td>
            <td class="left" title="${esc(r.cliente)}">${esc(r.cliente)}</td>
            <td class="left" title="${esc(r.sucursal)}">${esc(r.sucursal)}</td>
            <td>${tipoBadge(r.tipo_protocolo)}</td>
            <td style="color:var(--muted);font-weight:600">${esc(r.puesto)}</td>
            <td class="left" title="${esc(r.operador)}">${esc(r.operador)}</td>
            <td>${bi(r.detectado)}</td>
            <td>${bi(r.efectivo)}</td>
            <td>${bi(r.sirena)}</td>
            <td>${bi(r.voz)}</td>
            <td>${bi(r.carabineros)}</td>
            <td>${bi(r.alpha3)}</td>
            <td>${bi(r.informado)}</td>
            <td>${bi(r.bitacora)}</td>
            <td>${bi(r.protocolo_exitoso)}</td>
            <td>${obsBtn(r.observaciones, r.id, r.cliente)}</td>
          </tr>`).join("")
        : `<tr class="empty"><td colspan="17">Sin resultados.</td></tr>`;

      setMsg("Actualizado.", "ok-text");
    } catch (err) {
      $("tbody").innerHTML = `<tr class="empty"><td colspan="17">No se pudo cargar la información.</td></tr>`;
      setMsg(err.message, "err");
    }
  }

  function limpiar() {
    ["cliente","sucursal","desde","hasta"].forEach(id => $(id).value = "");
    $("tipo").value = "";
    cargar();
  }

  function setMsg(t, cls) {
    const el = $("msg"); el.textContent = t; el.className = "status " + cls;
  }

  cargar();
</script>
<script src="/static/auth-guard.js"></script>
</body>
</html>
