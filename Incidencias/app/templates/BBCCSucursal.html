<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBDD Sucursales — ATC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy-1: #0b1420;
      --navy-2: #162538;
      --navy-3: #1e3248;
      --orange: #ff7a2b;
      --orange-2: #ff9448;
      --bg: #f0f4f8;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
    }

    /* ── HEADER ── */
    .page-header {
      background: linear-gradient(135deg, var(--navy-1) 0%, var(--navy-2) 60%, var(--navy-3) 100%);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,.22);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-brand img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    .header-brand-text strong {
      display: block;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -.02em;
    }

    .header-brand-text span {
      font-size: 12px;
      color: rgba(255,255,255,.55);
    }

    .btn-back {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.82);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: background .18s;
      white-space: nowrap;
    }

    .btn-back:hover { background: rgba(255,255,255,.14); }

    /* ── CONTENT ── */
    .page-content {
      padding: 28px 28px 56px;
    }

    .section-bar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -.02em;
    }

    .section-hint {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
    }

    /* ── TABLE CARD ── */
    .table-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06), 0 8px 28px rgba(0,0,0,.08);
      overflow: hidden;
    }

    .table-scroll {
      overflow-x: auto;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
    }

    /* ── TABLE ── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    /* Main header row */
    thead tr:first-child th {
      background: linear-gradient(135deg, var(--navy-1) 0%, var(--navy-2) 100%);
      color: #fff;
      padding: 13px 12px;
      font-weight: 600;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .05em;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 5;
      border-right: 1px solid rgba(255,255,255,.06);
      text-align: center;
    }

    thead tr:first-child th:last-child { border-right: none; }

    /* Filter row */
    thead tr:nth-child(2) th {
      background: var(--navy-2);
      padding: 6px 8px;
      position: sticky;
      top: 43px;
      z-index: 4;
      border-bottom: 2px solid rgba(255,255,255,.08);
    }

    input.filtro {
      width: 100%;
      padding: 5px 8px;
      font-size: 12px;
      font-family: inherit;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px;
      background: rgba(255,255,255,.1);
      color: #fff;
      text-align: center;
    }

    input.filtro::placeholder { color: rgba(255,255,255,.4); }
    input.filtro:focus { outline: none; border-color: var(--orange); background: rgba(255,255,255,.16); }

    tbody tr:nth-child(even) td { background: #f8fafc; }
    tbody tr:hover td { background: #eff6ff !important; }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid #f1f5f9;
      color: var(--text);
      vertical-align: middle;
      text-align: center;
      word-break: break-word;
    }

    td:last-child { border-right: none; }

    /* ── CELL STATES ── */
    td.editing { background: #fef9c3 !important; cursor: text; }
    td.edited   { background: #fef3c7 !important; outline: 1px solid #f59e0b; }
    td.guardado { background: #dcfce7 !important; transition: background .7s ease; }

    /* ── SAVE BUTTON ── */
    .guardar-btn {
      padding: 5px 13px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      display: none;
      transition: background .18s, transform .12s;
      white-space: nowrap;
    }

    .guardar-btn:hover { background: var(--orange-2); transform: translateY(-1px); }
    .guardar-btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; }
    .visible { display: inline-block !important; }

    /* ── ERROR / STATE ── */
    .mensaje-error {
      padding: 12px 20px;
      color: #dc2626;
      font-size: 13px;
      font-weight: 600;
    }

    .estado-carga {
      padding: 56px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .page-header { padding: 12px 16px; }
      .page-content { padding: 16px 14px 40px; }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <div class="header-brand">
      <img src="/shared-static/img/logo-atc.png" alt="ATC - Alguien Te Cuida">
      <div class="header-brand-text">
        <strong>Alguien Te Cuida</strong>
        <span>Base de Datos — Sucursales</span>
      </div>
    </div>
    <a id="btnVolver" href="#" class="btn-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Volver al panel
    </a>
  </header>

  <main class="page-content">
    <div class="section-bar">
      <div>
        <h1 class="section-title">BBDD Sucursales</h1>
        <p class="section-hint">Haz doble clic sobre las celdas editables para modificarlas. Usa los filtros para encontrar registros rápidamente.</p>
      </div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table id="tablaSucursales">
          <thead>
            <tr id="theadPrincipal"></tr>
            <tr id="theadFiltros"></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="mensajeError" class="mensaje-error"></div>
    </div>
  </main>

  <script>
    const qsToken = new URLSearchParams(window.location.search).get("token") || "";
    const withToken = (url) => {
      const sep = url.includes("?") ? "&" : "?";
      return qsToken ? `${url}${sep}token=${encodeURIComponent(qsToken)}` : url;
    };
    document.getElementById("btnVolver").href = withToken("/venta/panel-selector");

    const filterColumns = [
      { key: "id", label: "ID", index: 0 },
      { key: "rut", label: "RUT", index: 1 },
      { key: "empresa", label: "Nombre Empresa", index: 2 },
      { key: "sucursal", label: "Nombre Sucursal", index: 3 },
      { key: "direccion", label: "Direccion", index: 4 },
    ];

    function construirCabecera(headers) {
      const main = document.getElementById("theadPrincipal");
      const filtros = document.getElementById("theadFiltros");
      main.innerHTML = "";
      filtros.innerHTML = "";

      headers.forEach((header) => {
        const th = document.createElement("th");
        th.textContent = header;
        main.appendChild(th);
      });
      const thAccion = document.createElement("th");
      thAccion.textContent = "Accion";
      main.appendChild(thAccion);

      headers.forEach((_, index) => {
        const th = document.createElement("th");
        const filterDef = filterColumns.find((item) => item.index === index);
        if (filterDef) {
          const input = document.createElement("input");
          input.type = "text";
          input.className = "filtro";
          input.dataset.key = filterDef.key;
          input.placeholder = "Filtrar...";
          input.addEventListener("keyup", filtrarTabla);
          th.appendChild(input);
        }
        filtros.appendChild(th);
      });
      filtros.appendChild(document.createElement("th"));
    }

    function cargarTabla(datos) {
      const tbody = document.querySelector("#tablaSucursales tbody");
      const mensajeError = document.getElementById("mensajeError");

      tbody.innerHTML = "";
      mensajeError.textContent = "";

      const headers = datos.headers || [];
      const rows = datos.rows || [];
      construirCabecera(headers);

      if (rows.length > 0) {
        rows.forEach((fila, i) => {
          const tr = document.createElement("tr");
          tr.dataset.fila = i;
          tr.dataset.rowid = fila[0];
          tr.dataset.id = String(fila[0] || "").toLowerCase();
          tr.dataset.rut = String(fila[1] || "").toLowerCase();
          tr.dataset.empresa = String(fila[2] || "").toLowerCase();
          tr.dataset.sucursal = String(fila[3] || "").toLowerCase();
          tr.dataset.direccion = String(fila[4] || "").toLowerCase();

          fila.forEach((celda, index) => {
            const td = document.createElement("td");
            td.textContent = celda || "";
            td.dataset.fila = i;
            td.dataset.col = index;
            if (index >= 3 && index <= 16) {
              td.style.cursor = "text";
              td.ondblclick = () => editarCelda(td);
            }
            tr.appendChild(td);
          });

          const tdBoton = document.createElement("td");
          const boton = document.createElement("button");
          boton.className = "guardar-btn";
          boton.id = `guardar-${i}`;
          boton.textContent = "Guardar";
          boton.onclick = () => guardarFila(i, boton);
          tdBoton.appendChild(boton);
          tr.appendChild(tdBoton);

          tbody.appendChild(tr);
        });
      } else {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.textContent = "No se encontraron datos.";
        td.colSpan = headers.length + 1;
        td.style.cssText = "text-align:center;padding:40px;color:#64748b;";
        tr.appendChild(td);
        tbody.appendChild(tr);
      }
    }

    function editarCelda(td) {
      if (td.querySelector("input")) return;

      const valorOriginal = td.textContent;
      const input = document.createElement("input");
      input.type = "text";
      input.value = valorOriginal;
      input.style.cssText = 'width:100%;padding:4px 6px;border:1.5px solid #ff7a2b;border-radius:5px;font-size:13px;font-family:inherit;background:#fff;outline:none;text-align:inherit;';
      td.classList.add("editing");
      td.innerHTML = "";
      td.appendChild(input);
      input.focus();

      let edicionTerminada = false;

      function finalizarEdicion(tecla = "") {
        if (edicionTerminada) return;
        edicionTerminada = true;

        const nuevoValor = input.value;
        td.classList.remove("editing");

        if (tecla === "Escape") {
          td.innerHTML = valorOriginal;
          td.classList.remove("edited");
        } else {
          td.innerHTML = nuevoValor;
          if (nuevoValor !== valorOriginal) {
            td.classList.add("edited");
            document.getElementById(`guardar-${td.dataset.fila}`).classList.add("visible");
          } else {
            td.classList.remove("edited");
          }
        }
      }

      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === "Escape") {
          e.preventDefault();
          finalizarEdicion(e.key);
        }
      });

      input.addEventListener("blur", function () {
        finalizarEdicion();
      });
    }

    async function guardarFila(filaIndex, boton) {
      const fila = document.querySelectorAll(`td[data-fila="${filaIndex}"]`);
      const values = [];
      const editadas = [];

      fila.forEach(td => {
        values.push(td.textContent);
        if (td.classList.contains("edited")) {
          editadas.push(td);
        }
      });

      const row = document.querySelector(`tr[data-fila="${filaIndex}"]`);
      const rowId = Number(row.dataset.rowid);

      boton.disabled = true;
      boton.textContent = "Guardando...";

      try {
        const response = await fetch(withToken("/api/venta/sucursales/tabla/guardar-fila"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ row_id: rowId, values })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({ detail: "No se pudo guardar" }));
          throw new Error(typeof err.detail === "string" ? err.detail : "No se pudo guardar");
        }

        editadas.forEach(td => {
          td.classList.remove("edited");
          td.classList.add("guardado");
          setTimeout(() => td.classList.remove("guardado"), 2000);
        });

        boton.textContent = "Guardado ✓";
        setTimeout(() => {
          boton.classList.remove("visible");
          boton.disabled = false;
          boton.textContent = "Guardar";
        }, 2000);
      } catch (error) {
        document.getElementById("mensajeError").textContent = error.message || "Error al guardar.";
        boton.disabled = false;
        boton.textContent = "Guardar";
      }
    }

    function filtrarTabla() {
      const filtros = {};
      document.querySelectorAll("input.filtro").forEach(input => {
        filtros[input.dataset.key] = input.value.toLowerCase().trim();
      });

      document.querySelectorAll("#tablaSucursales tbody tr").forEach(fila => {
        let mostrar = true;
        Object.keys(filtros).forEach(key => {
          const valorFiltro = filtros[key];
          const valorFila = fila.dataset[key] || "";
          if (valorFiltro && !valorFila.includes(valorFiltro)) {
            mostrar = false;
          }
        });
        fila.style.display = mostrar ? "" : "none";
      });
    }

    function mostrarError(error) {
      document.getElementById("mensajeError").textContent = `Error al cargar los datos: ${error.message || error}`;
    }

    async function init() {
      try {
        const response = await fetch(withToken("/api/venta/sucursales/tabla"));
        if (!response.ok) throw new Error("No se pudo cargar la tabla de sucursales.");
        const data = await response.json();
        cargarTabla(data);
      } catch (error) {
        mostrarError(error);
      }
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
