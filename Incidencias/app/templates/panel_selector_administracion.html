<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administracion</title>
  <style>
    :root {
      --bg: #eef2f6;
      --panel: #ffffff;
      --text: #1f2a37;
      --muted: #607080;
      --blue: #2f75b5;
      --line: #d8e0e8;
      --shadow: 0 14px 34px rgba(31, 42, 55, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 28px;
    }

    .shell {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .logo {
      height: 70px;
      width: auto;
      border-radius: 10px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: var(--text);
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #f8fafc;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .option {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 14px;
      align-items: center;
      min-height: 120px;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      color: var(--text);
      text-decoration: none;
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .option:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(31, 42, 55, 0.16);
    }

    .icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
    }

    .option strong {
      display: block;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .option p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 14px;
    }

    @media (max-width: 720px) {
      body { padding: 16px; }
      .header { grid-template-columns: 1fr; text-align: center; }
      .logo { margin: 0 auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <img class="logo" src="https://i.imgur.com/VgLG9Ei.png" alt="ATC">
      <div>
        <h1>Panel Administracion</h1>
        <p class="subtitle">Gestion administrativa de ordenes de servicio.</p>
      </div>
      <a class="btn" href="/venta/panel-selector?token={{ token|default('') }}">Volver</a>
    </header>

    <section class="grid">
      <a class="option" href="/venta/administracion/tabla?token={{ token|default('') }}">
        <div class="icon">T</div>
        <div>
          <strong>Tabla Administracion</strong>
          <p>Seguimiento de recepcion, registros, solicitudes, facturacion, carta de bienvenida y termino.</p>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
