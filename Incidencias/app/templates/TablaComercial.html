<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla Comercial</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:#f4f6f8;
      color:#1f2937;
      padding:24px;
    }
    .shell{
      width:min(760px,100%);
      background:#fff;
      border-radius:18px;
      box-shadow:0 18px 40px rgba(0,0,0,.08);
      padding:44px 36px;
      text-align:center;
      border-top:6px solid #f59e0b;
    }
    h1{
      margin:0 0 10px;
      font-size:34px;
      line-height:1.05;
    }
    p{
      margin:0;
      font-size:16px;
      color:#4b5563;
      line-height:1.6;
    }
    .badge{
      display:inline-block;
      margin-bottom:18px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff7ed;
      color:#c2410c;
      font-weight:700;
      font-size:13px;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="badge">Modulo Comercial</div>
    <h1>Proximamente</h1>
    <p>Esta vista aun no esta disponible. La dejaremos conectada al panel de Venta para avanzar en la siguiente fase sin perder el acceso reservado.</p>
  </main>
<script src="/static/auth-guard.js"></script>
</body>
</html>
