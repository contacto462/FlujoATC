<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tabla Comercial — ODS</title>
<style>
:root {
  --bg:       #f0f4f7;
  --surface:  #ffffff;
  --border:   #dde3ea;
  --border-2: #c8d0da;
  --text:     #1e293b;
  --muted:    #64748b;
  --primary:  #ff6e23;
  --primary-2:#e85e18;
  --shadow:   0 1px 4px rgba(0,0,0,.10);
  --shadow-lg:0 8px 28px rgba(0,0,0,.14);

  --c-comercial:   #ea6d00;
  --c-admin:       #2563eb;
  --c-servicio:    #c05c00;
  --c-soporte:     #16a34a;
  --c-operaciones: #0f766e;
  --c-finanzas:    #15803d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg)}

/* ── Header ── */
.hdr{
  position:sticky;top:0;z-index:200;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow);
  padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:32px;height:32px;border-radius:8px;object-fit:contain}
.brand strong{font-size:14px;font-weight:800;color:var(--text)}
.brand small{font-size:11px;color:var(--muted)}
.hdr-actions{display:flex;align-items:center;gap:8px}

/* ── Buttons ── */
.btn{
  appearance:none;border:1px solid var(--border-2);
  background:var(--surface);color:var(--text);
  padding:7px 14px;border-radius:9px;
  font-size:12px;font-weight:700;cursor:pointer;
  transition:background .13s,border-color .13s,box-shadow .13s;white-space:nowrap;
}
.btn:hover{background:#f1f5f9;border-color:#b0bcc9}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-2);border-color:var(--primary-2)}
.btn-danger{background:#fff1f1;border-color:#fca5a5;color:#dc2626}
.btn-danger:hover{background:#fee2e2}
.btn-danger.active{background:#dc2626;border-color:#dc2626;color:#fff}
.btn-danger.active:hover{background:#b91c1c}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:8px}
.btn-icon{
  width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  font-size:15px;border-radius:7px;line-height:1;
}

/* ── Filters ── */
.filters{
  padding:9px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);background:#f8fafc;
}
.search-box{
  flex:1;min-width:200px;padding:7px 13px;
  border-radius:9px;border:1px solid var(--border-2);
  background:var(--surface);color:var(--text);font-size:13px;outline:none;
  transition:border-color .13s,box-shadow .13s;
}
.search-box:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,110,35,.12)}
.filter-sel{
  padding:7px 11px;border-radius:9px;border:1px solid var(--border-2);
  background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;outline:none;
}
.counter{font-size:12px;color:var(--muted);white-space:nowrap;font-weight:600}

/* ── Table wrap ── */
.tbl-wrap{overflow:auto;height:calc(100vh - 107px)}

table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface)}

thead th{
  padding:11px 14px;text-align:left;font-weight:700;
  font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);border-bottom:2px solid var(--border);
  white-space:nowrap;background:#f8fafc;
  position:sticky;top:0;z-index:10;
}
thead th.c-comercial  {color:var(--c-comercial)}
thead th.c-admin      {color:var(--c-admin)}
thead th.c-servicio   {color:var(--c-servicio)}
thead th.c-soporte    {color:var(--c-soporte)}
thead th.c-operaciones{color:var(--c-operaciones)}
thead th.c-finanzas   {color:var(--c-finanzas)}
thead th.c-contrato   {color:#6d28d9}
thead th.c-anular     {color:#dc2626}

tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:#f8fafc}
tbody tr.anulada{opacity:.45;background:#fff5f5}
tbody tr.hidden{display:none}

td{padding:13px 14px;vertical-align:middle;color:var(--text);line-height:1.4}
td.cod{font-weight:800;font-family:monospace;font-size:13px;color:var(--primary)}
td.dim{color:var(--muted)}
td.center{text-align:center}

/* ── Status badges ── */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;
  cursor:pointer;white-space:nowrap;border:none;outline:none;
  transition:filter .12s,box-shadow .12s;background:none;
}
.badge:hover{filter:brightness(.94);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.badge.ok  {background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
.badge.proc{background:#fef3c7;color:#b45309;border:1px solid #fde68a}
.badge.pend{background:#f1f5f9;color:#94a3b8;border:1px solid #cbd5e1}

/* contrato subido indicator */
.ctrt-ok{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;
  background:#dcfce7;color:#15803d;border:1px solid #bbf7d0;white-space:nowrap;
}

/* ── Popup ── */
.pop-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.35);display:none;place-items:center;
}
.pop-overlay.open{display:grid}
.pop{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:18px 20px;min-width:260px;max-width:360px;
  box-shadow:var(--shadow-lg);
}
.pop-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pop-title{font-size:14px;font-weight:800}
.pop-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 3px;line-height:1}
.pop-x:hover{color:var(--text)}
.pop-sec{margin-bottom:10px}
.pop-sec-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:5px}
.pop-item{font-size:12px;padding:3px 0;display:flex;align-items:center;gap:6px}
.pop-item.done{color:#15803d}
.pop-item.done::before{content:"✓";font-weight:800}
.pop-item.pend{color:#dc2626}
.pop-item.pend::before{content:"·";font-size:18px;line-height:.85}

/* ── Modal ── */
.mod-overlay{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.4);display:none;place-items:center}
.mod-overlay.open{display:grid}
.mod{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:22px 24px;width:min(440px,95vw);
  box-shadow:var(--shadow-lg);
}
.mod h3{font-size:15px;font-weight:800;margin-bottom:14px}
.mod-field{margin-bottom:12px}
.mod-label{display:block;font-size:11px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.mod-input{
  width:100%;padding:8px 11px;border-radius:9px;
  border:1px solid var(--border-2);background:var(--surface);
  color:var(--text);font-size:13px;outline:none;
}
.mod-input:focus{border-color:var(--primary)}
.mod-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.mod-msg{min-height:18px;font-size:12px;margin-top:8px;font-weight:600}
.ok-msg{color:#16a34a}
.err-msg{color:#dc2626}

/* ── Loading ── */
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<!-- Header -->
<header class="hdr">
  <div class="brand">
    <img src="/shared-static/img/logo-atc.png" alt="ATC">
    <div>
      <strong>ATC — Tabla Comercial</strong>
      <small>Vision general de ODS</small>
    </div>
  </div>
  <div class="hdr-actions">
    <button class="btn btn-danger btn-sm" id="btnAnularToggle" onclick="toggleAnularMode()">Modo Anular</button>
    <button class="btn btn-sm" onclick="cerrarSesion()">Cerrar sesion</button>
  </div>
</header>

<!-- Filters -->
<div class="filters">
  <input type="text" class="search-box" id="searchBox" placeholder="Buscar por codigo, cliente, rut, ejecutivo..." oninput="aplicarFiltros()"/>
  <select class="filter-sel" id="filterEstado" onchange="aplicarFiltros()">
    <option value="todos">Todos los estados</option>
    <option value="proceso">En proceso</option>
    <option value="terminado">Terminados</option>
    <option value="anulado">Anuladas</option>
  </select>
  <span class="counter" id="counter">Cargando...</span>
</div>

<!-- Table -->
<div class="tbl-wrap">
  <div class="loading" id="loading">Cargando datos...</div>
  <table id="tabla" style="display:none">
    <thead>
      <tr>
        <th>Cod.</th>
        <th>Fecha</th>
        <th>Ejecutivo</th>
        <th>RUT</th>
        <th>Razon Social</th>
        <th>Direccion Sucursal</th>
        <th>Tipo Servicio</th>
        <th>Plan</th>
        <th class="c-contrato">Contrato / Anexo</th>
        <th class="c-comercial">Comercial</th>
        <th class="c-admin">Administracion</th>
        <th class="c-servicio">Serv. Tecnico</th>
        <th class="c-soporte">Soporte</th>
        <th class="c-operaciones">Operaciones</th>
        <th class="c-finanzas">Finanzas</th>
        <th class="c-anular" id="thAnular" style="display:none">Anular</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- Status popup -->
<div class="pop-overlay" id="popOverlay" onclick="cerrarPop(event)">
  <div class="pop">
    <div class="pop-hdr">
      <span class="pop-title" id="popTitle"></span>
      <button class="pop-x" onclick="cerrarPop()">×</button>
    </div>
    <div id="popBody"></div>
  </div>
</div>

<!-- Upload modal -->
<div class="mod-overlay" id="modOverlay">
  <div class="mod">
    <h3>Subir Contrato / Anexo</h3>
    <input type="hidden" id="modCodigo"/>
    <div class="mod-field">
      <span class="mod-label">ODS</span>
      <div id="modCodigoText" style="font-size:13px;font-weight:700;color:var(--primary)"></div>
    </div>
    <div class="mod-field">
      <label class="mod-label" for="modFile">Archivo (PDF, DOC, JPG, XLS...)</label>
      <input type="file" id="modFile" class="mod-input" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.xls,.xlsx"/>
    </div>
    <div class="mod-msg" id="modMsg"></div>
    <div class="mod-actions">
      <button class="btn btn-sm" onclick="cerrarMod()">Cancelar</button>
      <button class="btn btn-primary btn-sm" id="btnSubir" onclick="subirContrato()">Subir</button>
    </div>
  </div>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
let modoAnular = false;

async function api(url, opts) {
  const sep = url.includes("?") ? "&" : "?";
  const res = await fetch(`${url}${sep}token=${encodeURIComponent(TOKEN)}`, opts);
  if (res.status === 401) { location.href = "/venta/login"; return null; }
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.detail || `Error ${res.status}`);
  }
  return res.json();
}

function badgeCls(estado) {
  if (estado === "Terminado") return "ok";
  if (estado === "En proceso") return "proc";
  return "pend";
}
function badgeSym(estado) {
  if (estado === "Terminado") return "✓";
  if (estado === "En proceso") return "◑";
  return "○";
}

function mkBadge(area, label) {
  const btn = document.createElement("button");
  btn.className = `badge ${badgeCls(area.estado)}`;
  btn.innerHTML = `${badgeSym(area.estado)} ${area.estado}`;
  btn.addEventListener("click", () => abrirPop(label, area));
  return btn;
}

function abrirPop(titulo, area) {
  document.getElementById("popTitle").textContent = titulo;
  const body = document.getElementById("popBody");
  body.innerHTML = "";
  if (area.completados.length) {
    const sec = document.createElement("div");
    sec.className = "pop-sec";
    sec.innerHTML = `<div class="pop-sec-title" style="color:#16a34a">Completado</div>`;
    area.completados.forEach(t => {
      const d = document.createElement("div"); d.className = "pop-item done"; d.textContent = t; sec.appendChild(d);
    });
    body.appendChild(sec);
  }
  if (area.detalles.length) {
    const sec = document.createElement("div");
    sec.className = "pop-sec";
    sec.innerHTML = `<div class="pop-sec-title" style="color:#dc2626">Pendiente</div>`;
    area.detalles.forEach(t => {
      const d = document.createElement("div"); d.className = "pop-item pend"; d.textContent = t; sec.appendChild(d);
    });
    body.appendChild(sec);
  }
  if (!area.completados.length && !area.detalles.length) {
    body.innerHTML = `<div style="font-size:12px;color:var(--muted)">Sin registros.</div>`;
  }
  document.getElementById("popOverlay").classList.add("open");
}

function cerrarPop(e) {
  if (!e || e.target === document.getElementById("popOverlay"))
    document.getElementById("popOverlay").classList.remove("open");
}

function calcEstado(row) {
  if (row.anulada) return "anulado";
  const areas = [row.areaComercial, row.areaAdmin, row.areaServicio, row.areaSoporte, row.areaOperaciones, row.areaFinanzas];
  return areas.every(a => a.estado === "Terminado") ? "terminado" : "proceso";
}

function mkFila(row) {
  const tr = document.createElement("tr");
  if (row.anulada) tr.classList.add("anulada");
  tr.dataset.codigo = (row.codigo || "").toLowerCase();
  tr.dataset.rs     = (row.razonSocial || "").toLowerCase();
  tr.dataset.rut    = (row.rutCliente || "").toLowerCase();
  tr.dataset.ej     = (row.ejecutivo || "").toLowerCase();
  tr.dataset.estado = calcEstado(row);

  const td = (content, cls) => {
    const el = document.createElement("td");
    if (cls) el.className = cls;
    if (typeof content === "string") el.textContent = content;
    else if (content) el.appendChild(content);
    tr.appendChild(el); return el;
  };

  td(row.codigo, "cod");
  td(row.fecha, "dim");
  td(row.ejecutivo);
  td(row.rutCliente, "dim");
  td(row.razonSocial);
  td(row.direccionSucursal || row.nombreSucursal || "", "dim");
  td(row.tipoServicio, "dim");
  td(row.tipoPlan, "dim");

  // Contrato / Anexo column (always visible)
  const tdCtrt = document.createElement("td");
  tdCtrt.className = "center";
  if (row.carpeta) {
    const lbl = document.createElement("span");
    lbl.className = "ctrt-ok";
    lbl.textContent = "✓ Subido";
    tdCtrt.appendChild(lbl);
  } else {
    const btnUp = document.createElement("button");
    btnUp.className = "btn btn-sm";
    btnUp.style.cssText = "background:#f3f0ff;border-color:#c4b5fd;color:#6d28d9";
    btnUp.textContent = "↑ Subir archivo";
    btnUp.addEventListener("click", () => abrirMod(row.codigo));
    tdCtrt.appendChild(btnUp);
  }
  tr.appendChild(tdCtrt);

  td(mkBadge(row.areaComercial,   "Comercial"));
  td(mkBadge(row.areaAdmin,       "Administracion"));
  td(mkBadge(row.areaServicio,    "Serv. Tecnico"));
  td(mkBadge(row.areaSoporte,     "Soporte"));
  td(mkBadge(row.areaOperaciones, "Operaciones"));
  td(mkBadge(row.areaFinanzas,    "Finanzas"));

  // Anular column
  const tdAn = document.createElement("td");
  tdAn.className = "center col-anular";
  tdAn.style.display = modoAnular ? "" : "none";
  if (!row.anulada) {
    const btnAn = document.createElement("button");
    btnAn.className = "btn btn-icon btn-danger anular-btn";
    btnAn.title = `Anular ODS ${row.codigo}`;
    btnAn.textContent = "✕";
    btnAn.addEventListener("click", () => anularODS(row.codigo, tr));
    tdAn.appendChild(btnAn);
  }
  tr.appendChild(tdAn);
  return tr;
}

function aplicarFiltros() {
  const txt = (document.getElementById("searchBox").value || "").toLowerCase();
  const est = document.getElementById("filterEstado").value;
  let vis = 0;
  document.querySelectorAll("#tbody tr").forEach(tr => {
    const m = (!txt || tr.dataset.codigo.includes(txt) || tr.dataset.rs.includes(txt) ||
                        tr.dataset.rut.includes(txt)   || tr.dataset.ej.includes(txt));
    const e = (est === "todos" || tr.dataset.estado === est);
    tr.classList.toggle("hidden", !(m && e));
    if (m && e) vis++;
  });
  document.getElementById("counter").textContent = `${vis} ODS`;
}

function toggleAnularMode() {
  modoAnular = !modoAnular;
  const btn = document.getElementById("btnAnularToggle");
  btn.classList.toggle("active", modoAnular);
  btn.textContent = modoAnular ? "✕ Salir modo anular" : "Modo Anular";
  const show = modoAnular ? "" : "none";
  document.getElementById("thAnular").style.display = show;
  document.querySelectorAll(".col-anular").forEach(td => td.style.display = show);
}

async function anularODS(codigo, tr) {
  if (!confirm(`¿Seguro que deseas anular la ODS ${codigo}?\nEsta accion no se puede deshacer.`)) return;
  try {
    await api("/api/venta/ods/anular", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ codigo }),
    });
    tr.classList.add("anulada");
    tr.dataset.estado = "anulado";
    tr.querySelectorAll(".anular-btn").forEach(b => b.remove());
    aplicarFiltros();
  } catch (err) { alert(`Error: ${err.message}`); }
}

function abrirMod(codigo) {
  document.getElementById("modCodigo").value = codigo;
  document.getElementById("modCodigoText").textContent = codigo;
  document.getElementById("modFile").value = "";
  document.getElementById("modMsg").textContent = "";
  document.getElementById("modMsg").className = "mod-msg";
  document.getElementById("modOverlay").classList.add("open");
}
function cerrarMod() { document.getElementById("modOverlay").classList.remove("open"); }

async function subirContrato() {
  const codigo = document.getElementById("modCodigo").value;
  const file   = document.getElementById("modFile").files[0];
  const msgEl  = document.getElementById("modMsg");
  if (!file) { msgEl.textContent = "Selecciona un archivo."; msgEl.className = "mod-msg err-msg"; return; }
  const btn = document.getElementById("btnSubir");
  btn.disabled = true; btn.textContent = "Subiendo..."; msgEl.textContent = "";
  try {
    const b64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res((r.result || "").split(",")[1] || r.result);
      r.onerror = rej; r.readAsDataURL(file);
    });
    await api("/api/venta/ods/subir-contrato", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ codigo, nombre: file.name, data: b64 }),
    });
    msgEl.textContent = "Archivo subido correctamente.";
    msgEl.className = "mod-msg ok-msg";
    setTimeout(cerrarMod, 1800);
  } catch (err) {
    msgEl.textContent = err.message || "Error al subir.";
    msgEl.className = "mod-msg err-msg";
  } finally { btn.disabled = false; btn.textContent = "Subir"; }
}

async function cerrarSesion() {
  try { await fetch(`/api/logout?token=${encodeURIComponent(TOKEN)}`, { method: "POST" }); } catch (_) {}
  location.href = "/venta/login";
}

async function cargarDatos() {
  try {
    const data = await api("/api/venta/comercial-todo");
    if (!data) return;
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";
    (data.rows || []).forEach(row => tbody.appendChild(mkFila(row)));
    document.getElementById("loading").style.display = "none";
    document.getElementById("tabla").style.display = "";
    aplicarFiltros();
  } catch (err) {
    document.getElementById("loading").textContent = `Error al cargar: ${err.message}`;
  }
}

cargarDatos();
</script>
</body>
</html>
