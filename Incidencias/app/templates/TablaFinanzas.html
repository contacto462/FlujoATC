<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabla Area Finanzas</title>
  <style>
    :root {
      /* Paleta login.html */
      --bg-1: #0a1c20;
      --bg-2: #10272d;
      --bg-3: #17363d;
      --panel-border: rgba(255, 255, 255, 0.10);
      --text-main: #f4f8f9;
      --text-soft: #c0cfd4;
      --surface: rgba(9, 22, 26, 0.92);
      --surface-2: rgba(255,255,255,.04);
      --line: rgba(255,255,255,.12);
      --shadow-main: rgba(0, 0, 0, 0.32);

      --green: #8CC27E;
      --ok: #28a745;
      --bad: #dc3545;
      --warn-bg: rgba(255, 235, 238, 0.10);
      --warn: #ff8787;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 18% 22%, rgba(255, 255, 255, 0.05), transparent 24%),
        radial-gradient(circle at 78% 12%, rgba(255, 125, 53, 0.08), transparent 18%),
        linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 42%, var(--bg-3) 100%);
      padding: 22px;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent 82%);
    }

    body::after {
      background:
        radial-gradient(circle at 30% 65%, rgba(255, 255, 255, 0.03), transparent 28%),
        radial-gradient(circle at 76% 78%, rgba(140, 194, 126, 0.12), transparent 18%);
    }

    .shell{
      width: min(1400px, 100%);
      margin: 0 auto;
      border-radius: 28px;
      border: 1px solid var(--panel-border);
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.04));
      backdrop-filter: blur(12px);
      box-shadow: 0 30px 70px var(--shadow-main);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .header{
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background:
        radial-gradient(580px 320px at 0% 0%, rgba(140,194,126,.18), transparent 70%),
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
    }

    .header img{
      height: 62px;
      width: 62px;
      border-radius: 16px;
      padding: 8px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      object-fit: contain;
    }

    .header h1{
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.02em;
      font-weight: 800;
      flex: 1;
    }

    .header .actions{
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn{
      appearance: none;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.05);
      color: var(--text-main);
      padding: 9px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .btn:hover{
      background: rgba(255,255,255,.09);
      border-color: rgba(255,255,255,.20);
      transform: translateY(-1px);
    }

    .content{ padding: 14px 16px 18px; }

    .alerta{
      text-align: right;
      margin-bottom: 8px;
      min-height: 34px;
    }

    .alerta .pill{
      display: inline-block;
      padding: 7px 12px;
      background: var(--warn-bg);
      color: var(--warn);
      border: 1px solid rgba(255, 135, 135, 0.40);
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
    }

    .tabla-container{
      max-height: 76vh;
      overflow: auto;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(9, 22, 26, 0.70);
    }

    table{
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: transparent;
    }

    thead th{
      position: sticky;
      top: 0;
      background: rgba(140,194,126,0.95);
      color: #0b171a;
      font-weight: 900;
      font-size: 13px;
      padding: 10px 8px;
      text-align: center;
      z-index: 2;
      border-bottom: 1px solid rgba(0,0,0,0.18);
    }

    td{
      padding: 9px 8px;
      font-size: 13px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,.06);
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    tbody tr:nth-child(even){ background: rgba(255,255,255,0.02); }
    tbody tr:hover{ background: rgba(255,255,255,0.04); }

    .filtro-container { margin-top: 6px; }
    select.filtro{
      width: 100%;
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.18);
      background: rgba(255,255,255,0.92);
      color: #0b171a;
      outline: none;
    }

    .boton-estado{
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 900;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      width: 96px;
    }
    .completado{ background-color: var(--ok); }
    .pendiente{ background-color: var(--bad); }

    tr.anulada td{
      background-color: rgba(245, 198, 198, 0.18) !important;
      color: rgba(255,255,255,0.72);
    }
    tr.anulada a{
      pointer-events:none;
      color: rgba(255,255,255,0.55) !important;
      text-decoration:none !important;
      cursor: default !important;
    }
    tr.anulada .boton-estado{
      pointer-events:none;
      opacity:0.55;
      cursor:not-allowed;
    }

    .detalle-vineta td{
      padding: 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .detalle-box{
      margin: 16px auto;
      padding: 18px;
      max-width: 1040px;
      text-align: left;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(9, 18, 23, 0.88);
      box-shadow: 0 18px 42px rgba(0,0,0,.26);
      line-height: 1.55;
      color: var(--text-main);
    }
    .detalle-box .title{
      text-align:center;
      font-weight: 900;
      margin-bottom: 10px;
    }
    .detalle-box pre{
      white-space: pre-wrap;
      font-family: inherit;
      margin: 8px 0 0;
      color: rgba(244,248,249,0.92);
    }

    a.link{
      color: #9ad0ff;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <img src="/shared-static/img/logo-atc.png" alt="ATC">
      <h1>Tabla Area Finanzas</h1>
      <div class="actions">
        <a class="btn" href="/venta/finanzas?token={{ token|default('') }}">Panel</a>
        <button class="btn" type="button" onclick="cerrarSesion()">Cerrar sesion</button>
      </div>
    </header>

    <section class="content">
      <div id="alertaAnuladas" class="alerta"></div>

      <div class="tabla-container">
        <table>
          <thead>
            <tr>
              <th>Codigo<div class="filtro-container"><select id="filtro-codigo" class="filtro"><option value="Todos">Todos</option></select></div></th>
              <th>Fecha<div class="filtro-container"><select id="filtro-fecha" class="filtro"><option value="Todos">Todos</option></select></div></th>
              <th>Ejecutivo<div class="filtro-container"><select id="filtro-ejecutivo" class="filtro"><option value="Todos">Todos</option></select></div></th>
              <th>Rut Cliente<div class="filtro-container"><select id="filtro-rut" class="filtro"><option value="Todos">Todos</option></select></div></th>
              <th>Razon Social<div class="filtro-container"><select id="filtro-razon" class="filtro"><option value="Todos">Todos</option></select></div></th>
              <th>Direccion Sucursal<div class="filtro-container"><select id="filtro-direccion" class="filtro"><option value="Todos">Todos</option></select></div></th>
              <th>Tipo Servicio<div class="filtro-container"><select id="filtro-servicio" class="filtro"><option value="Todos">Todos</option></select></div></th>
              <th>Tipo Plan<div class="filtro-container"><select id="filtro-plan" class="filtro"><option value="Todos">Todos</option></select></div></th>
              <th>Carpeta</th>
              <th>Fecha inicio servicio</th>
              <th>Recepcion datos facturacion</th>
              <th>Creacion clientes Piriod</th>
              <th>Creacion clientes BD</th>
              <th>Facturacion Instalacion</th>
              <th>Facturacion Servicio</th>
              <th>Terminado
                <div class="filtro-container">
                  <select id="filtro-terminado" class="filtro">
                    <option value="Pendiente" selected>Pendiente</option>
                    <option value="✓">✓</option>
                    <option value="Anuladas">Anuladas</option>
                    <option value="Todos">Todos</option>
                  </select>
                </div>
              </th>
            </tr>
          </thead>
          <tbody id="tablaDatos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const token = new URLSearchParams(window.location.search).get("token") || "";
    const tbody = document.getElementById("tablaDatos");

    async function cerrarSesion(){
      try{
        if(token){
          await fetch(`/api/logout?token=${encodeURIComponent(token)}`, {method:"POST"});
        }
      }catch(e){
      }finally{
        window.location.href = "/venta/finanzas/login";
      }
    }

    function setAlertaAnuladas(cantidad){
      const cont = document.getElementById("alertaAnuladas");
      cont.innerHTML = "";
      if (!cantidad || cantidad <= 0) return;
      const pill = document.createElement("div");
      pill.className = "pill";
      pill.textContent = `Hay ${cantidad} ODS anuladas`;
      cont.appendChild(pill);
    }

    function buildSelectOptions(selectId, values){
      const select = document.getElementById(selectId);
      if(!select) return;
      const current = select.value;
      select.innerHTML = "<option value='Todos'>Todos</option>";
      [...values].filter(v => v !== null && v !== undefined).map(v => String(v).trim()).sort().forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v || "(vacio)";
        select.appendChild(opt);
      });
      if ([...select.options].some(o => o.value === current)) select.value = current;
      select.addEventListener("change", aplicarTodosLosFiltros);
    }

    function mkBtn(anulada, estado, codigo, campo){
      const btn = document.createElement("button");
      btn.className = "boton-estado " + (estado ? "completado" : "pendiente");
      btn.textContent = estado ? "✓" : "Pendiente";
      btn.disabled = !!anulada;
      if(!anulada){
        btn.addEventListener("click", async () => {
          const nuevo = btn.textContent === "✓" ? false : true;
          const res = await fetch("/api/venta/finanzas-ods/estado?token=" + encodeURIComponent(token), {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ codigo, campo, valor: nuevo })
          });
          const data = await res.json();
          if(!res.ok || !data?.ok){
            alert(data?.detail || "No se pudo actualizar.");
            return;
          }
          btn.textContent = nuevo ? "✓" : "Pendiente";
          btn.className = "boton-estado " + (nuevo ? "completado" : "pendiente");
          aplicarFiltroTerminado();
        });
      }
      return btn;
    }

    async function toggleDetalle(codigo, direccion, tr){
      const next = tr.nextSibling;
      if(next && next.classList && next.classList.contains("detalle-vineta")){
        next.remove();
        return;
      }

      const res = await fetch(`/api/venta/finanzas-ods/${encodeURIComponent(codigo)}/detalle?token=${encodeURIComponent(token)}`);
      const data = await res.json();

      const trd = document.createElement("tr");
      trd.className = "detalle-vineta";
      const td = document.createElement("td");
      td.colSpan = 16;
      const comuna = data?.comuna || "No disponible";

      td.innerHTML = `
        <div class="detalle-box">
          <div class="title">Detalle de la Orden</div>
          <div><strong>Comuna:</strong> ${comuna}</div>
          <div><strong>Camaras a Instalar:</strong> ${data?.numeroCamaras || "No informado"}</div>
          <div><strong>Camaras a Vigilar:</strong> ${data?.camarasVigilar || "No informado"}</div>
          <div><strong>Monto a Cobrar:</strong> ${data?.montosACobrar || "No informado"}</div>
          <div><strong>Observacion:</strong><pre>${data?.observacion || "No disponible"}</pre></div>
          <div><strong>Requiere OC:</strong> ${data?.requiereOC || "Si, aun no enviada"}</div>
        </div>
      `;
      trd.appendChild(td);
      tr.parentNode.insertBefore(trd, tr.nextSibling);
    }

    function aplicarTodosLosFiltros(){
      const filtros = {
        0: document.getElementById("filtro-codigo").value,
        1: document.getElementById("filtro-fecha").value,
        2: document.getElementById("filtro-ejecutivo").value,
        3: document.getElementById("filtro-rut").value,
        4: document.getElementById("filtro-razon").value,
        5: document.getElementById("filtro-direccion").value,
        6: document.getElementById("filtro-servicio").value,
        7: document.getElementById("filtro-plan").value,
        15: document.getElementById("filtro-terminado").value
      };
      const rows = document.querySelectorAll("#tablaDatos tr");
      rows.forEach(r => {
        if(r.classList.contains("detalle-vineta")) return;
        let visible = true;
        Object.entries(filtros).forEach(([idx, val]) => {
          if(!visible) return;
          if(val && val !== "Todos"){
            const i = parseInt(idx, 10);
            const cell = r.cells[i];
            if(!cell){
              visible = false;
              return;
            }
            const txt = cell.textContent.trim();
            if(i === 15 && val === "Anuladas"){
              visible = r.classList.contains("anulada");
              return;
            }
            if(i === 15 && val === "✓"){
              visible = txt === "✓" && !r.classList.contains("anulada");
              return;
            }
            if(i === 15 && val === "Pendiente"){
              visible = txt !== "✓" && !r.classList.contains("anulada");
              return;
            }
            if(i !== 15 && txt !== val.trim()){
              visible = false;
            }
          }
        });
        r.style.display = visible ? "" : "none";
      });
    }

    function aplicarFiltroTerminado(){ aplicarTodosLosFiltros(); }

    async function cargarDatos(){
      tbody.innerHTML = "";
      const res = await fetch("/api/venta/finanzas-ods?token=" + encodeURIComponent(token));
      const data = await res.json();
      const rows = Array.isArray(data?.rows) ? data.rows : [];
      setAlertaAnuladas(data?.totalAnuladas || 0);

      if(rows.length === 0){
        tbody.innerHTML = "<tr><td colspan='16'>No hay datos disponibles</td></tr>";
        return;
      }

      const opts = {
        codigo: new Set(),
        fecha: new Set(),
        ejecutivo: new Set(),
        rut: new Set(),
        razon: new Set(),
        direccion: new Set(),
        servicio: new Set(),
        plan: new Set(),
      };

      rows.forEach((r) => {
        opts.codigo.add(r.codigo || "");
        opts.fecha.add(r.fecha || "");
        opts.ejecutivo.add(r.ejecutivo || "");
        opts.rut.add(r.rutCliente || "");
        opts.razon.add(r.razonSocial || "");
        opts.direccion.add(r.direccionSucursal || "");
        opts.servicio.add(r.tipoServicio || "");
        opts.plan.add(r.tipoPlan || "");

        const tr = document.createElement("tr");
        if(r.anulada) tr.classList.add("anulada");

        const tdCodigo = document.createElement("td");
        const a = document.createElement("a");
        a.className = "link";
        a.textContent = r.codigo || "Sin codigo";
        a.href = "#";
        a.addEventListener("click", (e) => {
          e.preventDefault();
          if(r.anulada) return;
          toggleDetalle(r.codigo, r.direccionSucursal || "", tr);
        });
        tdCodigo.appendChild(a);
        tr.appendChild(tdCodigo);

        const cols = [
          r.fecha, r.ejecutivo, r.rutCliente, r.razonSocial, r.direccionSucursal, r.tipoServicio, r.tipoPlan
        ];
        cols.forEach(v => {
          const td = document.createElement("td");
          td.textContent = v || "";
          tr.appendChild(td);
        });

        const tdCarpeta = document.createElement("td");
        if(typeof r.carpeta === "string" && r.carpeta.startsWith("http")){
          if(r.anulada){
            tdCarpeta.textContent = "Ver Carpeta";
          }else{
            const link = document.createElement("a");
            link.className = "link";
            link.href = r.carpeta;
            link.target = "_blank";
            link.textContent = "Ver Carpeta";
            tdCarpeta.appendChild(link);
          }
        }else{
          tdCarpeta.textContent = "";
        }
        tr.appendChild(tdCarpeta);

        const tdInicio = document.createElement("td");
        tdInicio.textContent = r.fechaInicioServicio || "-";
        tr.appendChild(tdInicio);

        const estados = r.estados || {};
        const botones = [
          ["recepcion_datos_facturacion", !!estados.recepcion_datos_facturacion],
          ["creacion_clientes_piriod", !!estados.creacion_clientes_piriod],
          ["creacion_clientes_bd", !!estados.creacion_clientes_bd],
          ["facturacion_instalacion", !!estados.facturacion_instalacion],
          ["facturacion_servicio", !!estados.facturacion_servicio],
          ["finalizado", !!estados.finalizado],
        ];

        botones.forEach(([campo, val]) => {
          const td = document.createElement("td");
          td.appendChild(mkBtn(r.anulada, val, r.codigo, campo));
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });

      buildSelectOptions("filtro-codigo", opts.codigo);
      buildSelectOptions("filtro-fecha", opts.fecha);
      buildSelectOptions("filtro-ejecutivo", opts.ejecutivo);
      buildSelectOptions("filtro-rut", opts.rut);
      buildSelectOptions("filtro-razon", opts.razon);
      buildSelectOptions("filtro-direccion", opts.direccion);
      buildSelectOptions("filtro-servicio", opts.servicio);
      buildSelectOptions("filtro-plan", opts.plan);

      aplicarFiltroTerminado();
    }

    document.getElementById("filtro-terminado").addEventListener("change", aplicarFiltroTerminado);
    cargarDatos();
  </script>
</body>
</html>
