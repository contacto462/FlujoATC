<style>
  :root {
    --client-notes-accent: var(--header-1, var(--orange-2, #2563eb));
    --client-notes-accent-strong: var(--header-2, var(--orange-3, #1d4ed8));
    --client-notes-card: var(--panel-strong, var(--panel, var(--panel-bg, rgba(7, 18, 28, 0.98))));
    --client-notes-card-soft: var(--cell-bg, var(--cell, rgba(255, 255, 255, 0.045)));
    --client-notes-text: var(--text, var(--text-main, #eef6ff));
    --client-notes-muted: var(--muted, var(--text-soft, #9fb0c9));
    --client-notes-border: var(--border, var(--panel-border, var(--line, rgba(148, 163, 184, 0.22))));
    --client-notes-input: var(--input-bg, var(--field-bg, var(--field, rgba(2, 8, 23, 0.72))));
    --client-notes-shadow: var(--shadow-lg, var(--shadow, 0 28px 70px rgba(0, 0, 0, 0.34)));
  }

  .client-notes-fab {
    display: none;
  }

  .client-notes-fab:hover {
    transform: translateY(-1px);
    box-shadow: 0 22px 42px rgba(11, 31, 100, 0.38);
  }

  .client-notes-link {
    appearance: none;
    border: 0;
    background: transparent;
    color: #8ec5ff;
    font: inherit;
    font-weight: 800;
    text-align: inherit;
    text-decoration: underline;
    text-decoration-color: rgba(142, 197, 255, 0.45);
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 0;
  }

  .client-notes-link:hover {
    color: #bfdbfe;
    text-decoration-color: currentColor;
  }

  .client-notes-table-btn {
    min-width: 68px;
    min-height: 30px;
    border: 1px solid rgba(96, 165, 250, 0.28);
    border-radius: 10px;
    background: rgba(37, 99, 235, 0.14);
    color: #dbeafe;
    font: 800 12px/1 "Segoe UI", Inter, sans-serif;
    cursor: pointer;
  }

  .client-notes-table-btn:hover {
    background: rgba(37, 99, 235, 0.24);
  }

  .client-notes-panel {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    border: 0;
    border-radius: 0;
    background: color-mix(in srgb, var(--client-notes-card) 35%, rgba(2, 6, 23, 0.68));
    color: var(--client-notes-text);
    box-shadow: none;
    backdrop-filter: blur(8px);
    font-family: "Segoe UI", Inter, sans-serif;
  }

  .client-notes-panel.open {
    display: flex;
  }

  .client-notes-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    width: min(720px, calc(100vw - 32px));
    box-sizing: border-box;
    padding: 18px 20px 14px;
    border: 1px solid var(--client-notes-border);
    border-bottom: 0;
    border-radius: 18px 18px 0 0;
    background: var(--client-notes-card);
    box-shadow: var(--client-notes-shadow);
  }

  .client-notes-title {
    margin: 0;
    font-size: 15px;
    font-weight: 900;
  }

  .client-notes-subtitle {
    display: block;
    margin-top: 4px;
    color: var(--client-notes-muted);
    font-size: 12px;
    line-height: 1.35;
  }

  .client-notes-close {
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 10px;
    background: color-mix(in srgb, var(--client-notes-text) 8%, transparent);
    color: var(--client-notes-text);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
  }

  .client-notes-body {
    display: grid;
    gap: 12px;
    width: min(720px, calc(100vw - 32px));
    max-height: min(72vh, 640px);
    box-sizing: border-box;
    padding: 16px 20px 20px;
    overflow: auto;
    border-radius: 0 0 18px 18px;
    border: 1px solid var(--client-notes-border);
    border-top: 0;
    background: var(--client-notes-card);
    box-shadow: var(--client-notes-shadow);
  }

  .client-notes-field {
    display: grid;
    gap: 6px;
  }

  .client-notes-field label {
    margin: 0;
    color: var(--client-notes-muted);
    font-size: 12px;
    font-weight: 800;
  }

  .client-notes-field input,
  .client-notes-field textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--client-notes-border);
    border-radius: 12px;
    background: var(--client-notes-input);
    color: var(--client-notes-text);
    padding: 10px 11px;
    font: 500 13px/1.4 "Segoe UI", Inter, sans-serif;
    outline: none;
  }

  .client-notes-field textarea {
    min-height: 82px;
    resize: vertical;
  }

  .client-notes-field input[readonly] {
    cursor: default;
    opacity: .86;
  }

  .client-notes-field input:focus,
  .client-notes-field textarea:focus {
    border-color: color-mix(in srgb, var(--client-notes-accent) 58%, var(--client-notes-border));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--client-notes-accent) 16%, transparent);
  }

  .client-notes-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .client-notes-btn {
    border: 0;
    border-radius: 12px;
    padding: 10px 13px;
    background: color-mix(in srgb, var(--client-notes-text) 9%, transparent);
    color: var(--client-notes-text);
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }

  .client-notes-btn.primary {
    background: var(--button-bg, linear-gradient(135deg, var(--client-notes-accent), var(--client-notes-accent-strong)));
    color: #fff;
  }

  .client-notes-feed {
    display: grid;
    gap: 9px;
    min-height: 54px;
    max-height: 320px;
    overflow: auto;
  }

  .client-notes-empty,
  .client-notes-status {
    padding: 12px;
    border: 1px dashed var(--client-notes-border);
    border-radius: 12px;
    color: var(--client-notes-muted);
    font-size: 12px;
    line-height: 1.45;
  }

  .client-notes-note {
    padding: 11px 12px;
    border: 1px solid var(--client-notes-border);
    border-radius: 13px;
    background: var(--client-notes-card-soft);
  }

  .client-notes-note p {
    margin: 0;
    color: var(--client-notes-text);
    font-size: 13px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .client-notes-meta {
    margin-top: 8px;
    color: var(--client-notes-muted);
    font-size: 11px;
    font-weight: 700;
  }

  .client-notes-note-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(150px, auto);
    gap: 10px;
    margin-bottom: 10px;
  }

  .client-notes-note-label {
    display: block;
    margin-bottom: 3px;
    color: var(--client-notes-muted);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .client-notes-note-value {
    color: var(--client-notes-text);
    font-size: 13px;
    font-weight: 900;
  }

  .client-notes-note-text {
    padding-top: 10px;
    border-top: 1px solid var(--client-notes-border);
  }

  body.dark-mode {
    --client-notes-card: var(--panel-strong, rgba(15, 26, 46, 0.96));
    --client-notes-card-soft: var(--obs-bg, rgba(17, 32, 56, 0.92));
    --client-notes-text: var(--text, #e5eefb);
    --client-notes-muted: var(--muted, #9fb1c8);
    --client-notes-border: var(--border, rgba(148, 163, 184, 0.20));
    --client-notes-input: var(--input-bg, rgba(9, 18, 33, 0.92));
    --client-notes-shadow: var(--shadow-lg, 0 24px 60px rgba(2, 6, 23, 0.45));
  }

  body.dark-mode .client-notes-panel {
    background: rgba(2, 6, 23, 0.72);
    color: var(--client-notes-text);
  }

  body.dark-mode .client-notes-head,
  body.dark-mode .client-notes-body {
    background: var(--client-notes-card);
    border-color: var(--client-notes-border);
    box-shadow: var(--client-notes-shadow);
  }

  body.dark-mode .client-notes-field input,
  body.dark-mode .client-notes-field textarea {
    background: var(--client-notes-input);
    color: var(--client-notes-text);
    border-color: var(--client-notes-border);
  }

  body.dark-mode .client-notes-note {
    background: var(--client-notes-card-soft);
    border-color: var(--obs-border, var(--client-notes-border));
  }

  body.dark-mode .client-notes-close,
  body.dark-mode .client-notes-btn {
    background: rgba(255, 255, 255, 0.07);
    color: var(--client-notes-text);
  }

  body.dark-mode .client-notes-btn.primary {
    background: var(--button-bg, linear-gradient(135deg, #2563eb, #1d4ed8));
    color: #fff;
  }

  body.dark-mode .client-notes-subtitle,
  body.dark-mode .client-notes-meta,
  body.dark-mode .client-notes-empty,
  body.dark-mode .client-notes-status,
  body.dark-mode .client-notes-field label,
  body.dark-mode .client-notes-note-label {
    color: var(--client-notes-muted);
  }

  body.dark-mode .client-notes-note p,
  body.dark-mode .client-notes-note-value {
    color: var(--client-notes-text);
  }

  body[data-theme="light"] .client-notes-panel {
    background: rgba(15, 23, 42, 0.22);
    color: #102033;
  }

  body[data-theme="light"] .client-notes-head,
  body[data-theme="light"] .client-notes-body {
    background: rgba(248, 250, 252, 0.99);
    box-shadow: 0 24px 54px rgba(15, 23, 42, 0.20);
  }

  body[data-theme="light"] .client-notes-subtitle,
  body[data-theme="light"] .client-notes-meta,
  body[data-theme="light"] .client-notes-empty,
  body[data-theme="light"] .client-notes-status {
    color: #64748b;
  }

  body[data-theme="light"] .client-notes-field label {
    color: #334155;
  }

  body[data-theme="light"] .client-notes-field input,
  body[data-theme="light"] .client-notes-field textarea {
    background: #fff;
    color: #0f172a;
    border-color: rgba(15, 23, 42, 0.14);
  }

  body[data-theme="light"] .client-notes-note {
    background: #fff;
    border-color: rgba(15, 23, 42, 0.10);
  }

  body[data-theme="light"] .client-notes-note p {
    color: #0f172a;
  }

  body[data-theme="light"] .client-notes-note-label {
    color: #64748b;
  }

  body[data-theme="light"] .client-notes-note-value {
    color: #0f172a;
  }

  body[data-theme="light"] .client-notes-table-btn {
    background: rgba(37, 99, 235, 0.10);
    color: #1e3a8a;
    border-color: rgba(37, 99, 235, 0.22);
  }
</style>

<button id="clientNotesFab" class="client-notes-fab" type="button">Notas internas</button>
<aside id="clientNotesPanel" class="client-notes-panel" aria-hidden="true">
  <div class="client-notes-head">
    <div>
      <p class="client-notes-title">Notas internas</p>
      <span id="clientNotesSubtitle" class="client-notes-subtitle">Selecciona un cliente o sucursal.</span>
    </div>
    <button id="clientNotesClose" class="client-notes-close" type="button" aria-label="Cerrar">&times;</button>
  </div>
  <div class="client-notes-body">
    <div class="client-notes-field">
      <label for="clientNotesClientInput">Cliente / sucursal</label>
      <input id="clientNotesClientInput" type="text" placeholder="Nombre del cliente..." autocomplete="off" readonly aria-readonly="true" />
    </div>
    <div id="clientNotesFeed" class="client-notes-feed">
      <div class="client-notes-empty">El panel mostrara las notas del cliente seleccionado.</div>
    </div>
    <div class="client-notes-field">
      <label for="clientNotesTextInput">Nueva nota</label>
      <textarea id="clientNotesTextInput" placeholder="Escribe una nota interna para este cliente..."></textarea>
    </div>
    <div class="client-notes-actions">
      <button id="clientNotesReload" class="client-notes-btn" type="button">Actualizar</button>
      <button id="clientNotesSave" class="client-notes-btn primary" type="button">Guardar nota</button>
    </div>
    <div id="clientNotesStatus" class="client-notes-status" hidden></div>
  </div>
</aside>

<script>
(function () {
  const fab = document.getElementById("clientNotesFab");
  const panel = document.getElementById("clientNotesPanel");
  const closeBtn = document.getElementById("clientNotesClose");
  const clientInput = document.getElementById("clientNotesClientInput");
  const noteInput = document.getElementById("clientNotesTextInput");
  const feed = document.getElementById("clientNotesFeed");
  const statusBox = document.getElementById("clientNotesStatus");
  const subtitle = document.getElementById("clientNotesSubtitle");
  const reloadBtn = document.getElementById("clientNotesReload");
  const saveBtn = document.getElementById("clientNotesSave");
  const defaultAuthor = {{ (user.name if user is defined and user else "")|tojson }};

  if (!fab || !panel || !clientInput || !noteInput || !feed || !statusBox || !subtitle || !reloadBtn || !saveBtn) return;
  clientInput.readOnly = true;

  let currentClient = "";

  function esc(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function clean(value) {
    return String(value || "").replace(/\s+/g, " ").trim();
  }

  function setStatus(message, isError) {
    const text = clean(message);
    statusBox.hidden = !text;
    statusBox.textContent = text;
    statusBox.style.borderColor = isError ? "rgba(239,68,68,.38)" : "rgba(148,163,184,.24)";
    statusBox.style.color = isError ? "#fecaca" : "";
  }

  function openPanel() {
    panel.classList.add("open");
    panel.setAttribute("aria-hidden", "false");
  }

  function closePanel() {
    panel.classList.remove("open");
    panel.setAttribute("aria-hidden", "true");
  }

  function renderNotes(notes) {
    if (!Array.isArray(notes) || !notes.length) {
      feed.innerHTML = '<div class="client-notes-empty">Sin notas internas para este cliente.</div>';
      return;
    }
    feed.innerHTML = notes.map((note) => {
      const author = esc(note.author || "Agente");
      const date = esc(note.created_at_display || "Sin fecha");
      return `
        <article class="client-notes-note">
          <p>${esc(note.text || "")}</p>
          <div class="client-notes-meta">${author} · ${date}</div>
        </article>
      `;
    }).join("");
    feed.querySelectorAll(".client-notes-note").forEach((card) => {
      const meta = card.querySelector(".client-notes-meta");
      const noteText = card.querySelector("p")?.textContent || "";
      const parts = (meta?.textContent || "").split("·").map((part) => clean(part));
      const author = esc(parts[0] || "Agente");
      const date = esc(parts.slice(1).join(" - ") || "Sin fecha");
      card.innerHTML = `
        <div class="client-notes-note-grid">
          <div>
            <span class="client-notes-note-label">Usuario</span>
            <div class="client-notes-note-value">${author}</div>
          </div>
          <div>
            <span class="client-notes-note-label">Fecha</span>
            <div class="client-notes-note-value">${date}</div>
          </div>
        </div>
        <div class="client-notes-note-text">
          <span class="client-notes-note-label">Nota</span>
          <p>${esc(noteText)}</p>
        </div>
      `;
    });
  }

  async function loadNotes(clientName) {
    const client = clean(clientName || clientInput.value);
    currentClient = client;
    clientInput.value = client;
    subtitle.textContent = client ? client : "Selecciona un cliente o sucursal.";
    if (!client) {
      renderNotes([]);
      setStatus("Indica un cliente para cargar notas.", false);
      return;
    }
    setStatus("Cargando notas...", false);
    try {
      const response = await fetch(`/api/client-notes?client=${encodeURIComponent(client)}`, {
        credentials: "same-origin",
        cache: "no-store",
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.detail || "No se pudieron cargar las notas.");
      renderNotes(payload.notes || []);
      setStatus("", false);
    } catch (err) {
      renderNotes([]);
      setStatus(err.message || "No se pudieron cargar las notas.", true);
    }
  }

  async function saveNote() {
    const client = clean(clientInput.value || currentClient);
    const note = String(noteInput.value || "").trim();
    if (!client) {
      setStatus("Indica un cliente antes de guardar.", true);
      clientInput.focus();
      return;
    }
    if (!note) {
      setStatus("Escribe una nota antes de guardar.", true);
      noteInput.focus();
      return;
    }
    setStatus("Guardando nota...", false);
    try {
      const author = clean(defaultAuthor || localStorage.getItem("ATC_USER_NAME") || "");
      const response = await fetch("/api/client-notes", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          client,
          note,
          author,
          token: localStorage.getItem("ATC_TOKEN") || localStorage.getItem("atc_token") || "",
        }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.detail || "No se pudo guardar la nota.");
      noteInput.value = "";
      renderNotes(payload.notes || []);
      setStatus("Nota guardada.", false);
    } catch (err) {
      setStatus(err.message || "No se pudo guardar la nota.", true);
    }
  }

  function inferClientFromElement(target) {
    if (!target || !(target instanceof Element)) return "";
    const field = target.closest("input, select, textarea");
    if (field) {
      const hint = `${field.name || ""} ${field.id || ""} ${field.placeholder || ""}`;
      if (/cliente|sucursal/i.test(hint) && clean(field.value)) return clean(field.value);
    }

    const tr = target.closest("tr");
    if (!tr) return "";
    if (clean(tr.dataset.cliente || tr.dataset.client || tr.dataset.sucursal)) {
      return clean(tr.dataset.cliente || tr.dataset.client || tr.dataset.sucursal);
    }

    const tableRules = [
      { selector: "#tablaRegistro", index: 2 },
      { selector: "#registrosExistentes", index: 2 },
      { selector: "#cuerpoTabla", index: 2 },
      { selector: "#tablaIncidenciasPendientes", index: 3 },
    ];
    for (const rule of tableRules) {
      if (tr.closest(rule.selector)) {
        return clean(tr.children[rule.index]?.textContent || "");
      }
    }
    return "";
  }

  function selectClient(clientName, shouldOpen) {
    const client = clean(clientName);
    if (!client) return;
    const sameClient = client === currentClient;
    currentClient = client;
    clientInput.value = client;
    clientInput.readOnly = true;
    subtitle.textContent = client;
    if (shouldOpen) openPanel();
    if (!sameClient || shouldOpen) loadNotes(client);
  }

  fab.addEventListener("click", () => {
    openPanel();
    if (clean(clientInput.value || currentClient)) loadNotes(clientInput.value || currentClient);
  });
  closeBtn?.addEventListener("click", closePanel);
  reloadBtn.addEventListener("click", () => loadNotes(clientInput.value || currentClient));
  saveBtn.addEventListener("click", saveNote);
  clientInput.addEventListener("change", () => loadNotes(clientInput.value));

  document.addEventListener("click", (event) => {
    if (panel.contains(event.target) || fab.contains(event.target)) return;
    const client = inferClientFromElement(event.target);
    const shouldOpen = Boolean(event.target.closest?.("[data-client-notes-open='1'], .client-notes-client-cell"));
    if (client) selectClient(client, shouldOpen);
  }, true);

  panel.addEventListener("click", (event) => {
    if (event.target === panel) closePanel();
  });

  document.addEventListener("change", (event) => {
    const client = inferClientFromElement(event.target);
    if (client) selectClient(client, false);
  }, true);

  const paramsClient = clean(new URLSearchParams(window.location.search).get("cliente") || "");
  if (paramsClient) selectClient(paramsClient, false);
})();
</script>
