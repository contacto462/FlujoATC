<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tabla Area Operaciones</title>
<style>
:root{
  --bg:#0b1822;
  --surface:rgba(255,255,255,.05);
  --border:rgba(255,255,255,.10);
  --text:#e8f0f5;
  --muted:#7fa8bc;
  --teal:#0d9488;
  --teal-2:#0f766e;
  --red:#dc2626;
  --green:#16a34a;
  --btn-pending-bg:rgba(255,255,255,.08);
  --btn-pending-border:rgba(255,255,255,.16);
  --radius:14px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,.22);
  position:sticky;
  top:0;
  z-index:40;
}

.topbar-left{display:flex;align-items:center;gap:14px}
.back-link{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;
  padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.10);transition:all .18s;
}
.back-link:hover{color:var(--text);background:rgba(255,255,255,.10)}

.topbar h1{font-size:16px;font-weight:800;letter-spacing:-.01em}

.badge-count{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;
  border-radius:10px;background:rgba(13,148,136,.15);border:1px solid rgba(13,148,136,.30);
  color:#5eead4;font-size:12px;font-weight:700;
}

.filter-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 20px;border-bottom:1px solid var(--border);
  background:rgba(0,0,0,.12);
}

.filter-bar label{font-size:12px;font-weight:700;color:var(--muted)}

.filter-bar select,
.filter-bar input[type=text]{
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  color:var(--text);border-radius:10px;padding:7px 10px;font-size:13px;
  outline:none;transition:border-color .18s;
}
.filter-bar select:focus,.filter-bar input[type=text]:focus{border-color:var(--teal)}
.filter-bar option{background:#1a2e3a}

.content{padding:16px 20px}

.table-wrap{
  overflow-x:auto;
  border-radius:16px;
  border:1px solid var(--border);
  background:rgba(0,0,0,.18);
}

table{width:100%;border-collapse:collapse;font-size:13px}

thead th{
  padding:11px 12px;text-align:left;font-size:11px;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
  border-bottom:1px solid var(--border);white-space:nowrap;
  background:rgba(0,0,0,.18);position:sticky;top:0;
}

tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.03)}
tbody tr.anulada{opacity:.42}

td{padding:10px 12px;vertical-align:middle}

.cell-text{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.cell-code{font-weight:700;color:#a8d4e6;font-size:12px;white-space:nowrap}
.cell-date{white-space:nowrap;color:var(--muted);font-size:12px}

/* Estado buttons */
.btn-estado{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;
  cursor:pointer;border:1px solid;transition:all .18s;white-space:nowrap;
}
.btn-estado.completado{
  background:rgba(22,163,74,.18);border-color:rgba(22,163,74,.40);color:#4ade80;
}
.btn-estado.pendiente{
  background:var(--btn-pending-bg);border-color:var(--btn-pending-border);color:var(--muted);
}
.btn-estado:disabled{opacity:.4;cursor:not-allowed}
.btn-estado.loading{opacity:.6;cursor:wait}

/* Date input cell */
.date-input-wrap{display:flex;align-items:center;gap:6px;white-space:nowrap}
.date-input-wrap input[type=date]{
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:5px 8px;font-size:12px;
  outline:none;transition:border-color .18s;
}
.date-input-wrap input[type=date]:focus{border-color:var(--teal)}
.date-input-wrap input:disabled{opacity:.4;cursor:not-allowed}
.date-attempts{font-size:10px;color:var(--muted)}

/* Disabled text input */
td input[type=text].campo-deshabilitado{
  background:transparent;border:none;color:var(--muted);
  font-size:12px;width:100%;outline:none;cursor:default;padding:0;
}

/* anulada badge */
.badge-anulada{
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;
  background:rgba(220,38,38,.18);color:#f87171;border:1px solid rgba(220,38,38,.30);
  white-space:nowrap;
}

/* soporte-pending badge */
.badge-soporte{
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;
  background:rgba(234,179,8,.14);color:#fcd34d;border:1px solid rgba(234,179,8,.28);
}

.empty-msg{
  text-align:center;color:var(--muted);padding:40px;font-size:14px;
}

.spinner{
  display:flex;align-items:center;justify-content:center;padding:60px;gap:12px;color:var(--muted);
}
.spin{
  width:22px;height:22px;border:3px solid rgba(255,255,255,.12);
  border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{
  position:fixed;bottom:20px;right:20px;z-index:999;
  background:#1e3a2f;border:1px solid rgba(22,163,74,.40);color:#4ade80;
  padding:11px 16px;border-radius:12px;font-size:13px;font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;transform:translateY(8px);
  transition:all .25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:#3a1e1e;border-color:rgba(220,38,38,.40);color:#f87171}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a class="back-link" href="javascript:history.back()">&#8592; Panel</a>
    <h1>Tabla Area Operaciones</h1>
  </div>
  <div id="badgeCount" class="badge-count" style="display:none"></div>
</div>

<div class="filter-bar">
  <label>Filtrar:</label>
  <input type="text" id="filtroTexto" placeholder="Buscar codigo, cliente, ejecutivo..." style="width:240px">
  <label>Terminado:</label>
  <select id="filtroTerminado">
    <option value="">Todos</option>
    <option value="no">Solo pendientes</option>
    <option value="si">Solo terminados</option>
  </select>
  <label>Soporte:</label>
  <select id="filtroSoporte">
    <option value="">Todos</option>
    <option value="si">Soporte terminado</option>
    <option value="no">Soporte pendiente</option>
  </select>
  <label>Anuladas:</label>
  <select id="filtroAnuladas">
    <option value="no">Ocultar</option>
    <option value="si">Mostrar</option>
  </select>
</div>

<div class="content">
  <div class="table-wrap">
    <div id="spinnerWrap" class="spinner"><div class="spin"></div> Cargando...</div>
    <table id="tablaOp" style="display:none">
      <thead>
        <tr>
          <th>Codigo</th>
          <th>Fecha</th>
          <th>Ejecutivo</th>
          <th>Rut Cliente</th>
          <th>Razon Social</th>
          <th>Nombre Sucursal</th>
          <th>Direccion Sucursal</th>
          <th>Tipo Servicio</th>
          <th>Tipo Plan</th>
          <th>Term. Soporte</th>
          <th>Req. Puesto</th>
          <th>N. Central</th>
          <th>Fecha Inicio</th>
          <th>Fecha Coord.</th>
          <th>Reunion Coord.</th>
          <th>Coord. Oper.</th>
          <th>Coord. Equipo</th>
          <th>Terminado</th>
        </tr>
      </thead>
      <tbody id="tbodyOp"></tbody>
    </table>
    <div id="emptyMsg" class="empty-msg" style="display:none">Sin resultados.</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function () {
  const TOKEN = new URLSearchParams(location.search).get("token") || "";
  const MAX_INTENTOS_FECHA = 2;

  // intentos de edicion de fecha por codigo ODS (en sesion)
  const intentosPorFila = {};

  // ── Filas cargadas ──────────────────────────────────────────────────────
  let todasLasFilas = [];

  // ── API helpers ─────────────────────────────────────────────────────────
  async function apiGet(url) {
    const sep = url.includes("?") ? "&" : "?";
    const res = await fetch(`${url}${sep}token=${encodeURIComponent(TOKEN)}`);
    if (res.status === 401) { location.href = "/venta/operaciones/login"; throw new Error("401"); }
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  async function apiPost(url, body) {
    const sep = url.includes("?") ? "&" : "?";
    const res = await fetch(`${url}${sep}token=${encodeURIComponent(TOKEN)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (res.status === 401) { location.href = "/venta/operaciones/login"; throw new Error("401"); }
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  // ── Toast ────────────────────────────────────────────────────────────────
  let toastTimer = null;
  function showToast(msg, ok = true) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = `toast show${ok ? "" : " error"}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
  }

  // ── Render ───────────────────────────────────────────────────────────────
  function renderTabla(filas) {
    const tbody = document.getElementById("tbodyOp");
    tbody.innerHTML = "";

    if (!filas.length) {
      document.getElementById("tablaOp").style.display = "none";
      document.getElementById("emptyMsg").style.display = "";
      return;
    }

    document.getElementById("tablaOp").style.display = "";
    document.getElementById("emptyMsg").style.display = "none";

    filas.forEach(fila => {
      const tr = document.createElement("tr");
      if (fila.anulada) tr.classList.add("anulada");

      const estados = fila.estados || {};
      const soporteOk = !!fila.terminadoSoporte;

      // Intentos de fecha para esta fila
      if (!(fila.codigo in intentosPorFila)) intentosPorFila[fila.codigo] = 0;
      const intentos = intentosPorFila[fila.codigo];
      const fechaAgotada = intentos >= MAX_INTENTOS_FECHA;

      tr.innerHTML = `
        <td><span class="cell-code">${esc(fila.codigo)}${fila.anulada ? ' <span class="badge-anulada">Anulada</span>' : ""}</span></td>
        <td class="cell-date">${esc(fila.fecha)}</td>
        <td class="cell-text" title="${esc(fila.ejecutivo)}">${esc(fila.ejecutivo)}</td>
        <td class="cell-text">${esc(fila.rutCliente)}</td>
        <td class="cell-text" title="${esc(fila.razonSocial)}">${esc(fila.razonSocial)}</td>
        <td class="cell-text" title="${esc(fila.nombreSucursal)}">${esc(fila.nombreSucursal)}</td>
        <td class="cell-text" title="${esc(fila.direccionSucursal)}">${esc(fila.direccionSucursal)}</td>
        <td class="cell-text">${esc(fila.tipoServicio)}</td>
        <td class="cell-text">${esc(fila.tipoPlan)}</td>
        <td>${soporteOk
          ? '<span class="btn-estado completado">&#10003; Completado</span>'
          : '<span class="badge-soporte">Pendiente</span>'
        }</td>
        <td><input type="text" class="campo-deshabilitado" value="${esc(fila.requierePuestoNuevo)}" disabled readonly></td>
        <td><input type="text" class="campo-deshabilitado" value="${esc(fila.numeroCentralAsignado)}" disabled readonly></td>
        <td>
          <div class="date-input-wrap">
            <input type="date" id="fecha-${esc(fila.codigo)}"
              value="${isoFecha(fila.fechaInicioServicio)}"
              ${!soporteOk || fila.anulada || fechaAgotada ? "disabled" : ""}
            >
            <span class="date-attempts">${intentos}/${MAX_INTENTOS_FECHA}</span>
          </div>
        </td>
        <td>${btnEstado(fila.codigo, "fecha_coordinacion", estados.fecha_coordinacion, !soporteOk || fila.anulada, "Fecha Coord.")}</td>
        <td>${btnEstado(fila.codigo, "reunion_coordinacion", estados.reunion_coordinacion, !soporteOk || fila.anulada, "Reunion")}</td>
        <td>${btnEstado(fila.codigo, "coord_apertura_puesto", estados.coord_apertura_puesto, !soporteOk || fila.anulada, "Oper.")}</td>
        <td>${btnEstado(fila.codigo, "coord_equipo", estados.coord_equipo, !soporteOk || fila.anulada, "Equipo")}</td>
        <td>${btnEstado(fila.codigo, "terminado", estados.terminado, !soporteOk || fila.anulada, "Terminado")}</td>
      `;

      // Fecha inicio handler
      const fechaInput = tr.querySelector(`#fecha-${CSS.escape(fila.codigo)}`);
      if (fechaInput && !fechaInput.disabled) {
        fechaInput.addEventListener("change", () => cambiarFecha(fila.codigo, fechaInput));
      }

      // Estado buttons handlers
      tr.querySelectorAll(".btn-estado[data-codigo]").forEach(btn => {
        if (!btn.disabled) {
          btn.addEventListener("click", () => toggleEstado(btn));
        }
      });

      tbody.appendChild(tr);
    });
  }

  function btnEstado(codigo, campo, completado, deshabilitado, label) {
    const cls = completado ? "completado" : "pendiente";
    const icon = completado ? "&#10003;" : "&#8203;";
    const dis = deshabilitado ? "disabled" : "";
    return `<button class="btn-estado ${cls}" data-codigo="${esc(codigo)}" data-campo="${esc(campo)}" ${dis}>${icon} ${label}</button>`;
  }

  // ── Acciones ─────────────────────────────────────────────────────────────
  async function toggleEstado(btn) {
    const codigo = btn.dataset.codigo;
    const campo = btn.dataset.campo;
    const esCompletado = btn.classList.contains("completado");
    const nuevoValor = !esCompletado;

    btn.classList.add("loading");
    btn.disabled = true;
    try {
      await apiPost("/api/venta/operaciones-ods/actualizar-estado", { codigo, campo, valor: nuevoValor });
      btn.classList.remove("loading", "completado", "pendiente");
      btn.classList.add(nuevoValor ? "completado" : "pendiente");
      if (nuevoValor) btn.innerHTML = "&#10003; " + btn.textContent.trim().replace(/^\S+\s*/, "");
      else btn.innerHTML = "&#8203;" + btn.textContent.trim().replace(/^\S+\s*/, "");
      showToast(nuevoValor ? "Marcado como Completado" : "Marcado como Pendiente");

      // Actualizar en memoria
      const fila = todasLasFilas.find(f => f.codigo === codigo);
      if (fila) fila.estados[campo] = nuevoValor;

      btn.disabled = false;
    } catch (e) {
      showToast("Error al actualizar estado", false);
      btn.classList.remove("loading");
      btn.disabled = false;
    }
  }

  async function cambiarFecha(codigo, input) {
    const fecha = input.value;
    if (!fecha) return;

    input.disabled = true;
    try {
      await apiPost("/api/venta/operaciones-ods/actualizar-fecha", { codigo, fecha });

      intentosPorFila[codigo] = (intentosPorFila[codigo] || 0) + 1;
      const intentos = intentosPorFila[codigo];

      // Update attempts counter in same row
      const wrap = input.closest(".date-input-wrap");
      if (wrap) {
        const counter = wrap.querySelector(".date-attempts");
        if (counter) counter.textContent = `${intentos}/${MAX_INTENTOS_FECHA}`;
      }

      if (intentos >= MAX_INTENTOS_FECHA) {
        input.disabled = true;
        showToast("Limite de cambios de fecha alcanzado");
      } else {
        input.disabled = false;
        showToast("Fecha de inicio actualizada");
      }

      // Notificar inicio de servicio
      apiPost("/api/venta/operaciones-ods/notificar-inicio", { codigo, fecha }).catch(() => {});

      // Actualizar en memoria
      const fila = todasLasFilas.find(f => f.codigo === codigo);
      if (fila) fila.fechaInicioServicio = fecha;
    } catch (e) {
      showToast("Error al guardar fecha", false);
      input.disabled = false;
    }
  }

  // ── Filtros ──────────────────────────────────────────────────────────────
  function aplicarFiltros() {
    const texto = document.getElementById("filtroTexto").value.trim().toLowerCase();
    const filtroTerm = document.getElementById("filtroTerminado").value;
    const filtroSop = document.getElementById("filtroSoporte").value;
    const mostrarAnuladas = document.getElementById("filtroAnuladas").value === "si";

    const visibles = todasLasFilas.filter(fila => {
      if (fila.anulada && !mostrarAnuladas) return false;
      if (texto) {
        const haystack = [fila.codigo, fila.ejecutivo, fila.razonSocial, fila.rutCliente, fila.nombreSucursal].join(" ").toLowerCase();
        if (!haystack.includes(texto)) return false;
      }
      if (filtroTerm === "si" && !fila.estados.terminado) return false;
      if (filtroTerm === "no" && fila.estados.terminado) return false;
      if (filtroSop === "si" && !fila.terminadoSoporte) return false;
      if (filtroSop === "no" && fila.terminadoSoporte) return false;
      return true;
    });

    renderTabla(visibles);
  }

  ["filtroTexto", "filtroTerminado", "filtroSoporte", "filtroAnuladas"].forEach(id => {
    document.getElementById(id).addEventListener("input", aplicarFiltros);
    document.getElementById(id).addEventListener("change", aplicarFiltros);
  });

  // ── Helpers ──────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function isoFecha(s) {
    if (!s) return "";
    // Accept YYYY-MM-DD or DD/MM/YYYY
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    const m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    if (m) return `${m[3]}-${m[2]}-${m[1]}`;
    return "";
  }

  // ── Carga inicial ────────────────────────────────────────────────────────
  async function cargar() {
    try {
      const data = await apiGet("/api/venta/operaciones-ods");
      todasLasFilas = data.rows || [];

      document.getElementById("spinnerWrap").style.display = "none";

      const badge = document.getElementById("badgeCount");
      badge.textContent = `${todasLasFilas.length} ODS`;
      badge.style.display = "";

      aplicarFiltros();
    } catch (e) {
      document.getElementById("spinnerWrap").innerHTML = '<span style="color:#f87171">Error al cargar datos.</span>';
    }
  }

  cargar();
})();
</script>
</body>
</html>
