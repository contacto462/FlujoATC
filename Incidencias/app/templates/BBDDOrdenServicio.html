<!DOCTYPE html>
<html>
<head>
  <title>Edicion ODS</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    color: #000;
  }

  .contenedor {
    max-width: 1200px;
    margin: auto;
    background: #fff;
    padding: 30px 40px;
    border-radius: 10px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
    border-left: 6px solid #f57c00;
  }

  h1 {
    text-align: center;
    color: #000000;
    font-size: 24px;
    margin-bottom: 30px;
  }

  .fila {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 20px;
  }

  label {
    font-weight: bold;
    color: #333;
    margin-bottom: 6px;
    display: block;
    font-size: 13px;
  }

  input[type="text"],
  select,
  textarea {
    width: 100%;
    padding: 9px 11px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    box-sizing: border-box;
    transition: border-color .2s ease;
    white-space: pre-wrap;
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: #f57c00;
  }

  textarea {
    resize: vertical;
    min-height: 60px;
    display: block;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  textarea[style*="display:none"] {
    display: none !important;
  }

  input[type="file"] {
    appearance: none;
    background: #2d2f33;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    width: auto;
    box-sizing: border-box;
    min-width: 160px;
  }

  .boton-ver,
  .boton-anular {
    background: #f57c00;
    color: #fff;
    padding: 6px 12px;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 6px;
    transition: background .2s ease;
  }

  .boton-ver:hover,
  .boton-anular:hover,
  .guardar:hover {
    background: #e06b00;
  }

  .centered-row {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 20px;
  }

  .centered-row > div {
    flex: 1;
    max-width: 300px;
  }

  .guardar {
    background: #f57c00;
    color: #fff;
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: block;
    margin: 30px auto 0;
    transition: background .2s ease;
  }

  .checkbox-grid {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 12px;
    margin-top: 8px;
  }

  .checkbox-grid label {
    font-weight: normal;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  @media (max-width: 1024px) {
    .fila {
      grid-template-columns: repeat(2, 1fr);
    }

    .centered-row {
      flex-direction: column;
      align-items: center;
    }
  }

  @media (max-width: 600px) {
    .fila {
      grid-template-columns: 1fr;
    }

    .contenedor {
      padding: 20px;
    }

    h1 {
      font-size: 20px;
    }
  }
</style>
</head>
<body>
  <div class="contenedor">
    <h1>Edicion ODS</h1>

    <div class="fila">
      <div><label>ODS</label>
        <select id="selectorODS" onchange="cargarODSSeleccionada()">
          <option value="">Seleccione...</option>
        </select>
      </div>
      <div><label>RUT</label><textarea id="rut" style="min-height: 40px;"></textarea></div>
      <div><label>Razon Social</label><textarea id="razonSocial" style="min-height: 40px;"></textarea></div>
      <div><label>Direccion Sucursal</label><textarea id="direccionSucursal" style="min-height: 40px;"></textarea></div>
    </div>

    <div class="fila">
      <div><label>Nombre Sucursal</label><textarea id="nombreSucursal" style="min-height: 40px;"></textarea></div>
      <div><label>Tipo Plan</label>
        <select id="tipoPlan" disabled>
          <option value="">Seleccione...</option>
          <option>Plan Full</option>
          <option>Plan Mixto</option>
        </select>
      </div>
      <div><label>Tipo Cliente</label>
        <select id="tipoCliente" disabled>
          <option value="">Seleccione...</option>
          <option>EMPRESA</option>
          <option>DOMICILIO</option>
          <option>STRIP CENTER</option>
          <option>MUNICIPALIDAD</option>
          <option>CONDOMINIO</option>
        </select>
      </div>
      <div><label>Monto a Cobrar</label><textarea id="montoACobrar" style="min-height: 40px;"></textarea></div>
    </div>

    <div class="fila">
      <div>
        <label>Materiales</label>
        <button class="boton-ver" id="btn-materiales" onclick="toggleField('materiales','btn-materiales')" type="button">Ver Materiales</button>
        <textarea id="materiales" style="display: none;"></textarea>
        <button class="boton-anular" id="anular-materiales" style="display:none;" onclick="toggleField('materiales','btn-materiales')" type="button">Ocultar</button>
      </div>
      <div>
        <label>Consideraciones</label>
        <button class="boton-ver" id="btn-consideraciones" onclick="toggleField('consideraciones','btn-consideraciones')" type="button">Ver Consideraciones</button>
        <textarea id="consideraciones" style="display: none;"></textarea>
        <button class="boton-anular" id="anular-consideraciones" style="display:none;" onclick="toggleField('consideraciones','btn-consideraciones')" type="button">Ocultar</button>
      </div>
      <div>
        <label>Observacion</label>
        <button class="boton-ver" id="btn-observacion" onclick="toggleField('observacion','btn-observacion')" type="button">Ver Observacion</button>
        <textarea id="observacion" style="display: none;"></textarea>
        <button class="boton-anular" id="anular-observacion" style="display:none;" onclick="toggleField('observacion','btn-observacion')" type="button">Ocultar</button>
      </div>
      <div>
        <label>Tipo Servicio</label>
        <button class="boton-ver" onclick="toggleServicio()" type="button">Seleccionar</button>
        <div id="servicios-wrapper" class="checkbox-grid">
          <label><input type="checkbox" value="Televigilancia"> Televigilancia</label>
          <label><input type="checkbox" value="Alarma"> Alarma</label>
          <label><input type="checkbox" value="Guardia"> Guardia</label>
          <label><input type="checkbox" value="Instalacion"> Instalacion</label>
          <label><input type="checkbox" value="Upgrade"> Upgrade</label>
          <label><input type="checkbox" value="Downgrade"> Downgrade</label>
          <label><input type="checkbox" value="Servicio Tecnico"> Servicio Tecnico</label>
          <label><input type="checkbox" value="Monitoreo Adicional"> Monitoreo Adicional</label>
          <label><input type="checkbox" value="Desinstalacion"> Desinstalacion</label>
        </div>
      </div>
    </div>

    <div class="fila">
      <div><label>N Camara a Instalar</label><textarea id="camInstalar" style="min-height: 40px;"></textarea></div>
      <div><label>N Camara a Vigilar</label><textarea id="camVigilar" style="min-height: 40px;"></textarea></div>
      <div><label>Horario Nuevo Monitoreo</label><textarea id="horario" style="min-height: 40px;"></textarea></div>
      <div><label>Dias Monitoreo Adicional</label><textarea id="diasAdicional" style="min-height: 40px;"></textarea></div>
    </div>

    <div class="centered-row">
      <div>
        <label>Cotizacion</label>
        <input type="file" id="cotizacion" accept=".pdf,.doc,.docx" /><br/>
      </div>
      <div>
        <label>Layout</label>
        <input type="file" id="layout" accept="image/*,.pdf" /><br/>
      </div>
      <div>
        <label>OC</label>
        <input type="file" id="oc" accept=".pdf,.doc,.docx" /><br/>
      </div>
    </div>
    <button class="guardar" onclick="guardarCambiosODS()" type="button">Guardar Cambios</button>
  </div>
  <script>
  const qsToken = new URLSearchParams(window.location.search).get("token") || "";
  const withToken = (url) => {
    const sep = url.includes("?") ? "&" : "?";
    return qsToken ? `${url}${sep}token=${encodeURIComponent(qsToken)}` : url;
  };

  document.addEventListener("DOMContentLoaded", async () => {
    try {
      const response = await fetch(withToken("/api/venta/ods/lista"));
      if (!response.ok) {
        throw new Error("No se pudo cargar la lista de ODS.");
      }
      const data = await response.json();
      popularSelectorODS(data.ods || []);
    } catch (error) {
      alert(error?.message || "No se pudo cargar la lista de ODS.");
    }
  });

  function popularSelectorODS(lista) {
    const selector = document.getElementById("selectorODS");
    selector.innerHTML = '<option value="">Seleccione...</option>';
    lista.forEach((ods) => {
      const option = document.createElement("option");
      option.value = ods;
      option.textContent = ods;
      selector.appendChild(option);
    });
  }

  async function cargarODSSeleccionada() {
    const ods = document.getElementById("selectorODS").value;
    if (!ods) return;
    ["tipoPlan", "tipoCliente"].forEach((id) => {
      const select = document.getElementById(id);
      if (select) select.disabled = false;
    });

    try {
      const response = await fetch(withToken("/api/venta/ods/detalle?codigo=" + encodeURIComponent(ods)));
      if (!response.ok) {
        const err = await response.json().catch(() => ({ detail: "No se pudo cargar la ODS." }));
        throw new Error(typeof err?.detail === "string" ? err.detail : "No se pudo cargar la ODS.");
      }
      const datos = await response.json();
      poblarFormulario(datos);
    } catch (error) {
      alert(error?.message || "No se pudo cargar la ODS.");
    }
  }

  function poblarFormulario(datos) {
    const campos = [
      "rut","razonSocial","direccionSucursal","nombreSucursal",
      "tipoPlan","tipoCliente","camInstalar","camVigilar",
      "montoACobrar","diasAdicional","horario",
      "materiales","consideraciones","observacion"
    ];
    campos.forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.value = datos[id] || "";
    });
    document
      .querySelectorAll('#servicios-wrapper input[type="checkbox"]')
      .forEach((cb) => cb.checked = (datos.tipoServicio || "").split("|").map((s) => s.trim()).includes(cb.value));
  }

  async function archivoABase64(input) {
    return new Promise((resolve) => {
      if (!input || !input.files || !input.files.length) {
        resolve(null);
        return;
      }
      const archivo = input.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        resolve({
          nombre: archivo.name,
          tipo: archivo.type || "application/octet-stream",
          data: String(e.target?.result || ""),
        });
      };
      reader.readAsDataURL(archivo);
    });
  }

  async function guardarCambiosODS() {
    const btn = document.querySelector(".guardar");
    btn.disabled = true;
    btn.textContent = "Guardando...";

    try {
      const codigo = document.getElementById("selectorODS").value;
      if (!codigo) {
        throw new Error("Selecciona una ODS.");
      }

      const datos = { selectorODS: codigo };
      const campos = [
        "rut","razonSocial","direccionSucursal","nombreSucursal",
        "tipoPlan","tipoCliente","camInstalar","camVigilar",
        "montoACobrar","diasAdicional","horario",
        "materiales","consideraciones","observacion"
      ];
      campos.forEach((id) => datos[id] = document.getElementById(id).value || "");
      datos.tipoServicio = Array.from(
        document.querySelectorAll('#servicios-wrapper input[type="checkbox"]:checked')
      ).map((cb) => cb.value).join(", ");

      const cotizacion = await archivoABase64(document.getElementById("cotizacion"));
      const layout = await archivoABase64(document.getElementById("layout"));
      const oc = await archivoABase64(document.getElementById("oc"));
      if (cotizacion) datos.cotizacion = cotizacion;
      if (layout) datos.layout = layout;
      if (oc) datos.oc = oc;

      const response = await fetch(withToken("/api/venta/ods/guardar"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos),
      });
      if (!response.ok) {
        const err = await response.json().catch(() => ({ detail: "No se pudo guardar la ODS." }));
        throw new Error(typeof err?.detail === "string" ? err.detail : "No se pudo guardar la ODS.");
      }
      alert("Guardado correctamente");
    } catch (error) {
      alert(error?.message || "No se pudo guardar la ODS.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Guardar Cambios";
    }
  }

  function toggleField(f, b) {
    const field = document.getElementById(f);
    const btn = document.getElementById(b);
    const an = document.getElementById("anular-" + b.split("-")[1]);
    const visible = field.style.display === "block";
    field.style.display = visible ? "none" : "block";
    btn.style.display = visible ? "inline-block" : "none";
    if (an) an.style.display = visible ? "none" : "inline-block";
  }

  function toggleServicio() {
    const div = document.getElementById("servicios-wrapper");
    div.style.display = div.style.display === "grid" ? "none" : "grid";
  }
</script>
</body>
</html>
