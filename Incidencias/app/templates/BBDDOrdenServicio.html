<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBDD Orden de Servicio — ATC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy-1: #0b1420;
      --navy-2: #162538;
      --navy-3: #1e3248;
      --orange: #ff7a2b;
      --orange-2: #ff9448;
      --orange-dark: #e8691f;
      --bg: #f0f4f8;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --label: #374151;
      --radius: 10px;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
    }

    /* ── HEADER ── */
    .page-header {
      background: linear-gradient(135deg, var(--navy-1) 0%, var(--navy-2) 60%, var(--navy-3) 100%);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,.22);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-brand img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    .header-brand-text strong {
      display: block;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -.02em;
    }

    .header-brand-text span {
      font-size: 12px;
      color: rgba(255,255,255,.55);
    }

    .btn-back {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.82);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: background .18s;
      white-space: nowrap;
    }

    .btn-back:hover { background: rgba(255,255,255,.14); }

    /* ── PAGE ── */
    .page-content {
      padding: 28px 28px 64px;
      max-width: 1240px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -.02em;
      margin-bottom: 20px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.07);
      padding: 24px 28px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
      flex-shrink: 0;
    }

    /* ── GRID ── */
    .form-grid {
      display: grid;
      gap: 16px 20px;
    }

    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .col-span-2 { grid-column: span 2; }
    .col-span-full { grid-column: 1 / -1; }

    /* ── FIELD ── */
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--label);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 9px 12px;
      font-size: 13.5px;
      font-family: inherit;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      transition: border-color .18s, box-shadow .18s;
      white-space: pre-wrap;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,122,43,.12);
    }

    select { cursor: pointer; }

    textarea {
      resize: vertical;
      min-height: 64px;
      overflow-wrap: break-word;
    }

    textarea[style*="display:none"] { display: none !important; }

    /* ── SELECTOR ODS ── */
    .ods-selector-card {
      background: linear-gradient(135deg, var(--navy-1) 0%, var(--navy-2) 70%);
      border-radius: 16px;
      padding: 20px 28px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      box-shadow: 0 4px 20px rgba(0,0,0,.18);
    }

    .ods-selector-label {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255,255,255,.7);
      text-transform: uppercase;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .ods-selector-card select {
      flex: 1;
      min-width: 200px;
      max-width: 380px;
      background: rgba(255,255,255,.1);
      border: 1.5px solid rgba(255,255,255,.2);
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
    }

    .ods-selector-card select:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,122,43,.2);
    }

    .ods-selector-card select option { background: var(--navy-2); color: #fff; }

    /* ── TOGGLE BUTTON ── */
    .btn-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: #f1f5f9;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      transition: all .18s;
      margin-bottom: 8px;
    }

    .btn-toggle:hover {
      background: #e8f0fe;
      border-color: var(--orange);
      color: var(--orange-dark);
    }

    .btn-toggle-hide {
      background: #fff5f0;
      border-color: rgba(255,122,43,.35);
      color: var(--orange-dark);
    }

    .btn-toggle-hide:hover {
      background: #ffe8d6;
    }

    /* ── CHECKBOX GRID ── */
    .checkbox-grid {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 14px;
      margin-top: 10px;
      padding: 14px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .checkbox-grid label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      text-transform: none;
      letter-spacing: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checkbox-grid input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--orange);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ── FILE UPLOADS ── */
    .file-upload-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px 20px;
    }

    .file-upload-field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--label);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    input[type="file"] {
      width: 100%;
      padding: 9px 14px;
      font-size: 13px;
      font-family: inherit;
      background: var(--navy-2);
      color: rgba(255,255,255,.85);
      border: 1.5px solid rgba(255,255,255,.1);
      border-radius: 10px;
      cursor: pointer;
      transition: background .18s;
    }

    input[type="file"]:hover { background: var(--navy-3); }
    input[type="file"]:focus { outline: none; border-color: var(--orange); }

    /* ── SAVE BUTTON ── */
    .btn-guardar {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--orange) 0%, var(--orange-2) 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .18s, transform .14s, box-shadow .18s;
      box-shadow: 0 6px 20px rgba(255,122,43,.30);
      letter-spacing: -.01em;
    }

    .btn-guardar:hover { opacity: .92; transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,122,43,.38); }
    .btn-guardar:disabled { background: var(--muted); box-shadow: none; cursor: not-allowed; transform: none; }

    /* Alias - kept for JS compatibility */
    .guardar { }

    @media (max-width: 1024px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .file-upload-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .page-header { padding: 12px 16px; }
      .page-content { padding: 16px 14px 48px; }
      .card { padding: 18px; }
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .col-span-2 { grid-column: span 1; }
      .ods-selector-card { padding: 16px; }
      .checkbox-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <div class="header-brand">
      <img src="/shared-static/img/logo-atc.png" alt="ATC - Alguien Te Cuida">
      <div class="header-brand-text">
        <strong>Alguien Te Cuida</strong>
        <span>Órdenes de Servicio</span>
      </div>
    </div>
    <a id="btnVolver" href="#" class="btn-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Volver al panel
    </a>
  </header>

  <main class="page-content">
    <h1 class="page-title">BBDD Orden de Servicio</h1>

    <!-- ODS SELECTOR -->
    <div class="ods-selector-card">
      <span class="ods-selector-label">Seleccionar ODS</span>
      <select id="selectorODS" onchange="cargarODSSeleccionada()">
        <option value="">Seleccione una ODS...</option>
      </select>
    </div>

    <!-- DATOS GENERALES -->
    <div class="card">
      <div class="card-title"><span class="card-title-dot"></span>Datos del Cliente</div>
      <div class="form-grid grid-4">
        <div class="field">
          <label>RUT</label>
          <textarea id="rut" style="min-height:42px;"></textarea>
        </div>
        <div class="field">
          <label>Razón Social</label>
          <textarea id="razonSocial" style="min-height:42px;"></textarea>
        </div>
        <div class="field">
          <label>Nombre Sucursal</label>
          <textarea id="nombreSucursal" style="min-height:42px;"></textarea>
        </div>
        <div class="field">
          <label>Dirección Sucursal</label>
          <textarea id="direccionSucursal" style="min-height:42px;"></textarea>
        </div>
      </div>
    </div>

    <!-- DATOS COMERCIALES -->
    <div class="card">
      <div class="card-title"><span class="card-title-dot"></span>Datos Comerciales</div>
      <div class="form-grid grid-4">
        <div class="field">
          <label>Tipo Plan</label>
          <select id="tipoPlan" disabled>
            <option value="">Seleccione...</option>
            <option>Plan Full</option>
            <option>Plan Mixto</option>
          </select>
        </div>
        <div class="field">
          <label>Tipo Cliente</label>
          <select id="tipoCliente" disabled>
            <option value="">Seleccione...</option>
            <option>EMPRESA</option>
            <option>DOMICILIO</option>
            <option>STRIP CENTER</option>
            <option>MUNICIPALIDAD</option>
            <option>CONDOMINIO</option>
          </select>
        </div>
        <div class="field">
          <label>Monto a Cobrar</label>
          <textarea id="montoACobrar" style="min-height:42px;"></textarea>
        </div>
        <div class="field">
          <label>Tipo Servicio</label>
          <button class="btn-toggle" onclick="toggleServicio()" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            Seleccionar
          </button>
          <div id="servicios-wrapper" class="checkbox-grid">
            <label><input type="checkbox" value="Televigilancia"> Televigilancia</label>
            <label><input type="checkbox" value="Alarma"> Alarma</label>
            <label><input type="checkbox" value="Guardia"> Guardia</label>
            <label><input type="checkbox" value="Instalacion"> Instalación</label>
            <label><input type="checkbox" value="Upgrade"> Upgrade</label>
            <label><input type="checkbox" value="Downgrade"> Downgrade</label>
            <label><input type="checkbox" value="Servicio Tecnico"> Servicio Técnico</label>
            <label><input type="checkbox" value="Monitoreo Adicional"> Monitoreo Adicional</label>
            <label><input type="checkbox" value="Desinstalacion"> Desinstalación</label>
          </div>
        </div>
      </div>
    </div>

    <!-- TÉCNICO / MONITOREO -->
    <div class="card">
      <div class="card-title"><span class="card-title-dot"></span>Parámetros de Servicio</div>
      <div class="form-grid grid-4">
        <div class="field">
          <label>N° Cámaras a Instalar</label>
          <textarea id="camInstalar" style="min-height:42px;"></textarea>
        </div>
        <div class="field">
          <label>N° Cámaras a Vigilar</label>
          <textarea id="camVigilar" style="min-height:42px;"></textarea>
        </div>
        <div class="field">
          <label>Horario Nuevo Monitoreo</label>
          <textarea id="horario" style="min-height:42px;"></textarea>
        </div>
        <div class="field">
          <label>Días Monitoreo Adicional</label>
          <textarea id="diasAdicional" style="min-height:42px;"></textarea>
        </div>
      </div>
    </div>

    <!-- OBSERVACIONES -->
    <div class="card">
      <div class="card-title"><span class="card-title-dot"></span>Información Adicional</div>
      <div class="form-grid grid-3">
        <div class="field">
          <label>Materiales</label>
          <button class="btn-toggle" id="btn-materiales" onclick="toggleField('materiales','btn-materiales')" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            Ver Materiales
          </button>
          <textarea id="materiales" style="display:none;"></textarea>
          <button class="btn-toggle btn-toggle-hide" id="anular-btn-materiales" style="display:none;" onclick="toggleField('materiales','btn-materiales')" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
            Ocultar
          </button>
        </div>
        <div class="field">
          <label>Consideraciones</label>
          <button class="btn-toggle" id="btn-consideraciones" onclick="toggleField('consideraciones','btn-consideraciones')" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            Ver Consideraciones
          </button>
          <textarea id="consideraciones" style="display:none;"></textarea>
          <button class="btn-toggle btn-toggle-hide" id="anular-btn-consideraciones" style="display:none;" onclick="toggleField('consideraciones','btn-consideraciones')" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
            Ocultar
          </button>
        </div>
        <div class="field">
          <label>Observación</label>
          <button class="btn-toggle" id="btn-observacion" onclick="toggleField('observacion','btn-observacion')" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            Ver Observación
          </button>
          <textarea id="observacion" style="display:none;"></textarea>
          <button class="btn-toggle btn-toggle-hide" id="anular-btn-observacion" style="display:none;" onclick="toggleField('observacion','btn-observacion')" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
            Ocultar
          </button>
        </div>
      </div>
    </div>

    <!-- ARCHIVOS -->
    <div class="card">
      <div class="card-title"><span class="card-title-dot"></span>Archivos Adjuntos</div>
      <div class="file-upload-row">
        <div class="file-upload-field">
          <label>Cotización</label>
          <input type="file" id="cotizacion" accept=".pdf,.doc,.docx">
        </div>
        <div class="file-upload-field">
          <label>Layout</label>
          <input type="file" id="layout" accept="image/*,.pdf">
        </div>
        <div class="file-upload-field">
          <label>Orden de Compra (OC)</label>
          <input type="file" id="oc" accept=".pdf,.doc,.docx">
        </div>
      </div>
    </div>

    <!-- SAVE -->
    <button class="btn-guardar guardar" onclick="guardarCambiosODS()" type="button">Guardar Cambios</button>
  </main>

  <script>
    const qsToken = new URLSearchParams(window.location.search).get("token") || "";
    const withToken = (url) => {
      const sep = url.includes("?") ? "&" : "?";
      return qsToken ? `${url}${sep}token=${encodeURIComponent(qsToken)}` : url;
    };
    document.getElementById("btnVolver").href = withToken("/venta/panel-selector");

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch(withToken("/api/venta/ods/lista"));
        if (!response.ok) {
          throw new Error("No se pudo cargar la lista de ODS.");
        }
        const data = await response.json();
        popularSelectorODS(data.ods || []);
      } catch (error) {
        alert(error?.message || "No se pudo cargar la lista de ODS.");
      }
    });

    function popularSelectorODS(lista) {
      const selector = document.getElementById("selectorODS");
      selector.innerHTML = '<option value="">Seleccione una ODS...</option>';
      lista.forEach((ods) => {
        const option = document.createElement("option");
        option.value = ods;
        option.textContent = ods;
        selector.appendChild(option);
      });
    }

    async function cargarODSSeleccionada() {
      const ods = document.getElementById("selectorODS").value;
      if (!ods) return;
      ["tipoPlan", "tipoCliente"].forEach((id) => {
        const select = document.getElementById(id);
        if (select) select.disabled = false;
      });

      try {
        const response = await fetch(withToken("/api/venta/ods/detalle?codigo=" + encodeURIComponent(ods)));
        if (!response.ok) {
          const err = await response.json().catch(() => ({ detail: "No se pudo cargar la ODS." }));
          throw new Error(typeof err?.detail === "string" ? err.detail : "No se pudo cargar la ODS.");
        }
        const datos = await response.json();
        poblarFormulario(datos);
      } catch (error) {
        alert(error?.message || "No se pudo cargar la ODS.");
      }
    }

    function poblarFormulario(datos) {
      const campos = [
        "rut","razonSocial","direccionSucursal","nombreSucursal",
        "tipoPlan","tipoCliente","camInstalar","camVigilar",
        "montoACobrar","diasAdicional","horario",
        "materiales","consideraciones","observacion"
      ];
      campos.forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.value = datos[id] || "";
      });
      document
        .querySelectorAll('#servicios-wrapper input[type="checkbox"]')
        .forEach((cb) => cb.checked = (datos.tipoServicio || "").split("|").map((s) => s.trim()).includes(cb.value));
    }

    async function archivoABase64(input) {
      return new Promise((resolve) => {
        if (!input || !input.files || !input.files.length) {
          resolve(null);
          return;
        }
        const archivo = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          resolve({
            nombre: archivo.name,
            tipo: archivo.type || "application/octet-stream",
            data: String(e.target?.result || ""),
          });
        };
        reader.readAsDataURL(archivo);
      });
    }

    async function guardarCambiosODS() {
      const btn = document.querySelector(".guardar");
      btn.disabled = true;
      btn.textContent = "Guardando...";

      try {
        const codigo = document.getElementById("selectorODS").value;
        if (!codigo) {
          throw new Error("Selecciona una ODS.");
        }

        const datos = { selectorODS: codigo };
        const campos = [
          "rut","razonSocial","direccionSucursal","nombreSucursal",
          "tipoPlan","tipoCliente","camInstalar","camVigilar",
          "montoACobrar","diasAdicional","horario",
          "materiales","consideraciones","observacion"
        ];
        campos.forEach((id) => datos[id] = document.getElementById(id).value || "");
        datos.tipoServicio = Array.from(
          document.querySelectorAll('#servicios-wrapper input[type="checkbox"]:checked')
        ).map((cb) => cb.value).join(", ");

        const cotizacion = await archivoABase64(document.getElementById("cotizacion"));
        const layout = await archivoABase64(document.getElementById("layout"));
        const oc = await archivoABase64(document.getElementById("oc"));
        if (cotizacion) datos.cotizacion = cotizacion;
        if (layout) datos.layout = layout;
        if (oc) datos.oc = oc;

        const response = await fetch(withToken("/api/venta/ods/guardar"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos),
        });
        if (!response.ok) {
          const err = await response.json().catch(() => ({ detail: "No se pudo guardar la ODS." }));
          throw new Error(typeof err?.detail === "string" ? err.detail : "No se pudo guardar la ODS.");
        }
        alert("Guardado correctamente");
      } catch (error) {
        alert(error?.message || "No se pudo guardar la ODS.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Guardar Cambios";
      }
    }

    function toggleField(f, b) {
      const field = document.getElementById(f);
      const btn = document.getElementById(b);
      const an = document.getElementById("anular-" + b);
      const visible = field.style.display === "block";
      field.style.display = visible ? "none" : "block";
      btn.style.display = visible ? "inline-flex" : "none";
      if (an) an.style.display = visible ? "none" : "inline-flex";
    }

    function toggleServicio() {
      const div = document.getElementById("servicios-wrapper");
      div.style.display = div.style.display === "grid" ? "none" : "grid";
    }
  </script>
</body>
</html>
