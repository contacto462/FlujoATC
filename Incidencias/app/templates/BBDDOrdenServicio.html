<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBDD Orden de Servicio — ATC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy-1: #0b1420;
      --navy-2: #162538;
      --navy-3: #1e3248;
      --orange: #ff7a2b;
      --orange-2: #ff9448;
      --orange-dark: #e8691f;
      --bg: #f0f4f8;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --label: #374151;
      --radius: 10px;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    .page-header {
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--navy-1) 0%, var(--navy-2) 60%, var(--navy-3) 100%);
      padding: 13px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,.22);
      z-index: 50;
    }

    .header-brand { display: flex; align-items: center; gap: 12px; }
    .header-brand img { height: 38px; width: auto; object-fit: contain; }
    .header-brand-text strong { display: block; font-size: 14px; font-weight: 800; color: #fff; letter-spacing: -.02em; }
    .header-brand-text span { font-size: 12px; color: rgba(255,255,255,.55); }

    .btn-back {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 10px;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.82); font-size: 13px; font-weight: 700;
      text-decoration: none; transition: background .18s; white-space: nowrap;
    }
    .btn-back:hover { background: rgba(255,255,255,.14); }

    /* ── LAYOUT ── */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--label);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      transition: border-color .18s;
      outline: none;
    }
    .search-input:focus { border-color: var(--orange); }

    .sidebar-count {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .sidebar-item {
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background .14s;
      margin-bottom: 2px;
    }
    .sidebar-item:hover { background: #f1f5f9; }
    .sidebar-item.active {
      background: linear-gradient(135deg, var(--navy-1), var(--navy-2));
      color: #fff;
    }

    .item-name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── DETAIL PANEL ── */
    .detail-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 12px;
    }
    .detail-empty svg { opacity: .25; }
    .detail-empty p { font-size: 14px; }

    .detail-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px 48px;
    }

    .detail-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .detail-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--text);
    }

    .btn-guardar {
      display: flex; align-items: center; gap: 7px;
      padding: 10px 22px; border-radius: 10px;
      background: linear-gradient(135deg, var(--orange), var(--orange-2));
      border: none; color: #fff;
      font-size: 13px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      transition: opacity .18s, transform .12s;
      box-shadow: 0 4px 14px rgba(255,122,43,.28);
      white-space: nowrap;
    }
    .btn-guardar:hover { opacity: .9; transform: translateY(-1px); }
    .btn-guardar:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .guardar { }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border-radius: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.07);
      padding: 20px 24px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--orange);
      flex-shrink: 0;
    }

    /* ── FORM GRID ── */
    .form-grid {
      display: grid;
      gap: 14px 18px;
    }

    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .col-span-2 { grid-column: span 2; }
    .col-span-full { grid-column: 1 / -1; }

    /* ── FIELD ── */
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--label);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 8px 11px;
      font-size: 13px;
      font-family: inherit;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      transition: border-color .18s, box-shadow .18s;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,122,43,.12);
    }

    select { cursor: pointer; }

    textarea {
      resize: vertical;
      min-height: 60px;
      overflow-wrap: break-word;
    }

    textarea[style*="display:none"] { display: none !important; }

    /* ── TOGGLE BUTTON ── */
    .btn-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px;
      background: #f1f5f9; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 13px; font-weight: 600;
      font-family: inherit; color: var(--text);
      cursor: pointer; transition: all .18s;
      margin-bottom: 6px;
    }
    .btn-toggle:hover { background: #e8f0fe; border-color: var(--orange); color: var(--orange-dark); }
    .btn-toggle-hide { background: #fff5f0; border-color: rgba(255,122,43,.35); color: var(--orange-dark); }
    .btn-toggle-hide:hover { background: #ffe8d6; }

    /* ── CHECKBOX GRID ── */
    .checkbox-grid {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 14px;
      margin-top: 8px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .checkbox-grid label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      text-transform: none;
      letter-spacing: 0;
      display: flex; align-items: center; gap: 8px;
      cursor: pointer;
    }

    .checkbox-grid input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: var(--orange);
      cursor: pointer; flex-shrink: 0;
    }

    /* ── FILE UPLOADS ── */
    .file-upload-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px 18px;
    }

    .file-upload-field label {
      display: block;
      font-size: 11px; font-weight: 700;
      color: var(--label); margin-bottom: 7px;
      text-transform: uppercase; letter-spacing: .04em;
    }

    input[type="file"] {
      width: 100%; padding: 8px 12px;
      font-size: 13px; font-family: inherit;
      background: var(--navy-2);
      color: rgba(255,255,255,.85);
      border: 1.5px solid rgba(255,255,255,.1);
      border-radius: 10px; cursor: pointer;
      transition: background .18s;
    }
    input[type="file"]:hover { background: var(--navy-3); }
    input[type="file"]:focus { outline: none; border-color: var(--orange); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 28px; right: 28px;
      padding: 12px 20px; border-radius: 12px;
      font-size: 13px; font-weight: 600;
      color: #fff; z-index: 200;
      transform: translateY(20px); opacity: 0;
      transition: transform .25s, opacity .25s;
      pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok { background: #16a34a; }
    .toast.err { background: #dc2626; }

    /* ── LOADING ── */
    .loading-state {
      flex: 1; display: flex; align-items: center;
      justify-content: center; color: var(--muted);
      font-size: 14px; gap: 10px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid var(--border);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @media (max-width: 1024px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .file-upload-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .sidebar { width: 240px; }
      .detail-content { padding: 16px 14px 48px; }
      .card { padding: 16px; }
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .col-span-2 { grid-column: span 1; }
      .checkbox-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <div class="header-brand">
      <img src="/shared-static/img/logo-atc.png" alt="ATC - Alguien Te Cuida">
      <div class="header-brand-text">
        <strong>Alguien Te Cuida</strong>
        <span>Órdenes de Servicio</span>
      </div>
    </div>
    <a id="btnVolver" href="#" class="btn-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Volver al panel
    </a>
  </header>

  <div class="workspace" id="workspace">
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      Cargando órdenes de servicio…
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const qsToken = new URLSearchParams(window.location.search).get("token") || "";
    const withToken = (url) => {
      const sep = url.includes("?") ? "&" : "?";
      return qsToken ? `${url}${sep}token=${encodeURIComponent(qsToken)}` : url;
    };
    document.getElementById("btnVolver").href = withToken("/venta/panel-selector");

    let allODS = [];
    let activeODS = null;

    /* ── TOAST ── */
    let toastTimer = null;
    function showToast(msg, type = "ok") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = `toast ${type} show`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
    }

    /* ── INIT ── */
    async function init() {
      try {
        const res = await fetch(withToken("/api/venta/ods/lista"));
        if (!res.ok) throw new Error("No se pudo cargar la lista de ODS.");
        const data = await res.json();
        allODS = data.ods || [];
        buildUI();
      } catch (e) {
        document.getElementById("workspace").innerHTML =
          `<div class="loading-state" style="color:#dc2626">${e.message}</div>`;
      }
    }

    /* ── BUILD UI ── */
    function buildUI() {
      const ws = document.getElementById("workspace");
      ws.innerHTML = `
        <aside class="sidebar">
          <div class="sidebar-header">
            <div class="sidebar-title">Órdenes de Servicio</div>
            <input class="search-input" id="searchInput" type="text" placeholder="Buscar ODS…" autocomplete="off">
            <div class="sidebar-count" id="sidebarCount"></div>
          </div>
          <div class="sidebar-list" id="sidebarList"></div>
        </aside>
        <div class="detail-panel" id="detailPanel">
          <div class="detail-empty" id="detailEmpty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <p>Selecciona una ODS para editarla</p>
          </div>
          <div class="detail-content" id="detailContent" style="display:none">
            <div class="detail-topbar">
              <div class="detail-title" id="detailTitle">—</div>
              <button class="btn-guardar guardar" type="button" onclick="guardarCambiosODS()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                Guardar cambios
              </button>
            </div>

            <!-- DATOS DEL CLIENTE -->
            <div class="card">
              <div class="card-title"><span class="card-title-dot"></span>Datos del Cliente</div>
              <div class="form-grid grid-4">
                <div class="field"><label>RUT</label><textarea id="rut" style="min-height:42px;"></textarea></div>
                <div class="field"><label>Razón Social</label><textarea id="razonSocial" style="min-height:42px;"></textarea></div>
                <div class="field"><label>Nombre Sucursal</label><textarea id="nombreSucursal" style="min-height:42px;"></textarea></div>
                <div class="field"><label>Dirección Sucursal</label><textarea id="direccionSucursal" style="min-height:42px;"></textarea></div>
              </div>
            </div>

            <!-- DATOS COMERCIALES -->
            <div class="card">
              <div class="card-title"><span class="card-title-dot"></span>Datos Comerciales</div>
              <div class="form-grid grid-4">
                <div class="field">
                  <label>Tipo Plan</label>
                  <select id="tipoPlan">
                    <option value="">Seleccione...</option>
                    <option>Plan Full</option>
                    <option>Plan Mixto</option>
                  </select>
                </div>
                <div class="field">
                  <label>Tipo Cliente</label>
                  <select id="tipoCliente">
                    <option value="">Seleccione...</option>
                    <option>EMPRESA</option>
                    <option>DOMICILIO</option>
                    <option>STRIP CENTER</option>
                    <option>MUNICIPALIDAD</option>
                    <option>CONDOMINIO</option>
                  </select>
                </div>
                <div class="field"><label>Monto a Cobrar</label><textarea id="montoACobrar" style="min-height:42px;"></textarea></div>
                <div class="field">
                  <label>Tipo Servicio</label>
                  <button class="btn-toggle" onclick="toggleServicio()" type="button">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                    Seleccionar
                  </button>
                  <div id="servicios-wrapper" class="checkbox-grid">
                    <label><input type="checkbox" value="Televigilancia"> Televigilancia</label>
                    <label><input type="checkbox" value="Alarma"> Alarma</label>
                    <label><input type="checkbox" value="Guardia"> Guardia</label>
                    <label><input type="checkbox" value="Instalacion"> Instalación</label>
                    <label><input type="checkbox" value="Upgrade"> Upgrade</label>
                    <label><input type="checkbox" value="Downgrade"> Downgrade</label>
                    <label><input type="checkbox" value="Servicio Tecnico"> Servicio Técnico</label>
                    <label><input type="checkbox" value="Monitoreo Adicional"> Monitoreo Adicional</label>
                    <label><input type="checkbox" value="Desinstalacion"> Desinstalación</label>
                  </div>
                </div>
              </div>
            </div>

            <!-- PARÁMETROS DE SERVICIO -->
            <div class="card">
              <div class="card-title"><span class="card-title-dot"></span>Parámetros de Servicio</div>
              <div class="form-grid grid-4">
                <div class="field"><label>N° Cámaras a Instalar</label><textarea id="camInstalar" style="min-height:42px;"></textarea></div>
                <div class="field"><label>N° Cámaras a Vigilar</label><textarea id="camVigilar" style="min-height:42px;"></textarea></div>
                <div class="field"><label>Horario Nuevo Monitoreo</label><textarea id="horario" style="min-height:42px;"></textarea></div>
                <div class="field"><label>Días Monitoreo Adicional</label><textarea id="diasAdicional" style="min-height:42px;"></textarea></div>
              </div>
            </div>

            <!-- INFORMACIÓN ADICIONAL -->
            <div class="card">
              <div class="card-title"><span class="card-title-dot"></span>Información Adicional</div>
              <div class="form-grid grid-3">
                <div class="field">
                  <label>Materiales</label>
                  <button class="btn-toggle" id="btn-materiales" onclick="toggleField('materiales','btn-materiales')" type="button">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                    Ver Materiales
                  </button>
                  <textarea id="materiales" style="display:none;"></textarea>
                  <button class="btn-toggle btn-toggle-hide" id="anular-btn-materiales" style="display:none;" onclick="toggleField('materiales','btn-materiales')" type="button">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
                    Ocultar
                  </button>
                </div>
                <div class="field">
                  <label>Consideraciones</label>
                  <button class="btn-toggle" id="btn-consideraciones" onclick="toggleField('consideraciones','btn-consideraciones')" type="button">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                    Ver Consideraciones
                  </button>
                  <textarea id="consideraciones" style="display:none;"></textarea>
                  <button class="btn-toggle btn-toggle-hide" id="anular-btn-consideraciones" style="display:none;" onclick="toggleField('consideraciones','btn-consideraciones')" type="button">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
                    Ocultar
                  </button>
                </div>
                <div class="field">
                  <label>Observación</label>
                  <button class="btn-toggle" id="btn-observacion" onclick="toggleField('observacion','btn-observacion')" type="button">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                    Ver Observación
                  </button>
                  <textarea id="observacion" style="display:none;"></textarea>
                  <button class="btn-toggle btn-toggle-hide" id="anular-btn-observacion" style="display:none;" onclick="toggleField('observacion','btn-observacion')" type="button">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
                    Ocultar
                  </button>
                </div>
              </div>
            </div>

            <!-- ARCHIVOS -->
            <div class="card">
              <div class="card-title"><span class="card-title-dot"></span>Archivos Adjuntos</div>
              <div class="file-upload-row">
                <div class="file-upload-field">
                  <label>Cotización</label>
                  <input type="file" id="cotizacion" accept=".pdf,.doc,.docx">
                </div>
                <div class="file-upload-field">
                  <label>Layout</label>
                  <input type="file" id="layout" accept="image/*,.pdf">
                </div>
                <div class="file-upload-field">
                  <label>Orden de Compra (OC)</label>
                  <input type="file" id="oc" accept=".pdf,.doc,.docx">
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
      document.getElementById("searchInput").addEventListener("input", filtrarLista);
      renderList(allODS);
    }

    /* ── RENDER LIST ── */
    function renderList(items) {
      const list = document.getElementById("sidebarList");
      const count = document.getElementById("sidebarCount");
      list.innerHTML = "";

      if (!items.length) {
        list.innerHTML = '<div class="sidebar-empty">Sin resultados</div>';
        count.textContent = "";
        return;
      }

      count.textContent = `${items.length} ODS`;

      items.forEach((ods) => {
        const item = document.createElement("div");
        item.className = "sidebar-item" + (ods === activeODS ? " active" : "");
        item.dataset.ods = ods;
        item.innerHTML = `<div class="item-name">${ods}</div>`;
        item.addEventListener("click", () => selectODS(ods));
        list.appendChild(item);
      });
    }

    /* ── FILTER ── */
    function filtrarLista() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      renderList(q ? allODS.filter(o => o.toLowerCase().includes(q)) : allODS);
    }

    /* ── SELECT ODS ── */
    async function selectODS(ods) {
      activeODS = ods;
      document.querySelectorAll(".sidebar-item").forEach(el => {
        el.classList.toggle("active", el.dataset.ods === ods);
      });

      document.getElementById("detailTitle").textContent = ods;
      document.getElementById("detailEmpty").style.display = "none";
      document.getElementById("detailContent").style.display = "flex";
      document.getElementById("detailContent").style.flexDirection = "column";

      /* reset toggleable fields */
      ["materiales","consideraciones","observacion"].forEach(f => {
        const ta = document.getElementById(f);
        const btn = document.getElementById("btn-" + f);
        const anular = document.getElementById("anular-btn-" + f);
        if (ta) { ta.style.display = "none"; ta.value = ""; }
        if (btn) btn.style.display = "inline-flex";
        if (anular) anular.style.display = "none";
      });

      try {
        const res = await fetch(withToken("/api/venta/ods/detalle?codigo=" + encodeURIComponent(ods)));
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: "No se pudo cargar la ODS." }));
          throw new Error(typeof err?.detail === "string" ? err.detail : "No se pudo cargar la ODS.");
        }
        const datos = await res.json();
        poblarFormulario(datos);
      } catch (e) {
        showToast(e.message || "Error al cargar la ODS.", "err");
      }
    }

    /* ── POPULATE FORM ── */
    function poblarFormulario(datos) {
      const campos = [
        "rut","razonSocial","direccionSucursal","nombreSucursal",
        "tipoPlan","tipoCliente","camInstalar","camVigilar",
        "montoACobrar","diasAdicional","horario",
        "materiales","consideraciones","observacion"
      ];
      campos.forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.value = datos[id] || "";
      });
      document.querySelectorAll('#servicios-wrapper input[type="checkbox"]')
        .forEach((cb) => cb.checked = (datos.tipoServicio || "").split("|").map(s => s.trim()).includes(cb.value));
    }

    /* ── FILE TO BASE64 ── */
    async function archivoABase64(input) {
      return new Promise((resolve) => {
        if (!input || !input.files || !input.files.length) { resolve(null); return; }
        const archivo = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => resolve({ nombre: archivo.name, tipo: archivo.type || "application/octet-stream", data: String(e.target?.result || "") });
        reader.readAsDataURL(archivo);
      });
    }

    /* ── SAVE ── */
    async function guardarCambiosODS() {
      const btn = document.querySelector(".guardar");
      btn.disabled = true;
      btn.textContent = "Guardando…";

      try {
        if (!activeODS) throw new Error("Selecciona una ODS.");

        const datos = { selectorODS: activeODS };
        const campos = [
          "rut","razonSocial","direccionSucursal","nombreSucursal",
          "tipoPlan","tipoCliente","camInstalar","camVigilar",
          "montoACobrar","diasAdicional","horario",
          "materiales","consideraciones","observacion"
        ];
        campos.forEach((id) => datos[id] = document.getElementById(id)?.value || "");
        datos.tipoServicio = Array.from(
          document.querySelectorAll('#servicios-wrapper input[type="checkbox"]:checked')
        ).map(cb => cb.value).join(", ");

        const cotizacion = await archivoABase64(document.getElementById("cotizacion"));
        const layout = await archivoABase64(document.getElementById("layout"));
        const oc = await archivoABase64(document.getElementById("oc"));
        if (cotizacion) datos.cotizacion = cotizacion;
        if (layout) datos.layout = layout;
        if (oc) datos.oc = oc;

        const res = await fetch(withToken("/api/venta/ods/guardar"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: "No se pudo guardar la ODS." }));
          throw new Error(typeof err?.detail === "string" ? err.detail : "No se pudo guardar la ODS.");
        }

        showToast("Guardado correctamente", "ok");
      } catch (e) {
        showToast(e.message || "Error al guardar", "err");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Guardar cambios
        `;
      }
    }

    /* ── TOGGLE HELPERS ── */
    function toggleField(f, b) {
      const field = document.getElementById(f);
      const btn = document.getElementById(b);
      const an = document.getElementById("anular-" + b);
      const visible = field.style.display === "block";
      field.style.display = visible ? "none" : "block";
      btn.style.display = visible ? "inline-flex" : "none";
      if (an) an.style.display = visible ? "none" : "inline-flex";
    }

    function toggleServicio() {
      const div = document.getElementById("servicios-wrapper");
      div.style.display = div.style.display === "grid" ? "none" : "grid";
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
