<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBDD Orden de Servicio — ATC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy-1: #0b1420;
      --navy-2: #162538;
      --navy-3: #1e3248;
      --orange: #ff7a2b;
      --orange-2: #ff9448;
      --orange-dark: #e8691f;
      --bg: #f0f4f8;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --label: #374151;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    .page-header {
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--navy-1) 0%, var(--navy-2) 60%, var(--navy-3) 100%);
      padding: 13px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,.22);
      z-index: 50;
    }

    .header-brand { display: flex; align-items: center; gap: 12px; }
    .header-brand img { height: 38px; width: auto; object-fit: contain; }
    .header-brand-text strong { display: block; font-size: 14px; font-weight: 800; color: #fff; }
    .header-brand-text span { font-size: 11px; color: rgba(255,255,255,.55); }

    .btn-back {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: 10px;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.82); font-size: 13px; font-weight: 700;
      text-decoration: none; transition: background .18s; white-space: nowrap;
    }
    .btn-back:hover { background: rgba(255,255,255,.14); }

    /* ── LAYOUT ── */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      overflow: hidden;
    }

    /* ── SIDEBAR (list) ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-top {
      flex-shrink: 0;
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .sidebar-top-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 10px;
    }

    .search-wrap { position: relative; }

    .search-wrap svg {
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      font-size: 13px; font-family: inherit;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg); color: var(--text);
      transition: border-color .18s, box-shadow .18s;
    }
    .search-input:focus {
      outline: none; border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,122,43,.1);
      background: #fff;
    }

    .sidebar-count {
      font-size: 11px; color: var(--muted);
      margin-top: 8px; text-align: right;
    }

    .client-list {
      flex: 1; overflow-y: auto; padding: 8px 8px;
    }
    .client-list::-webkit-scrollbar { width: 4px; }
    .client-list::-webkit-scrollbar-track { background: transparent; }
    .client-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

    .client-item {
      padding: 10px 12px; border-radius: 10px;
      cursor: pointer; transition: background .14s;
      border: 1.5px solid transparent; margin-bottom: 3px;
    }
    .client-item:hover { background: #f1f5f9; }
    .client-item.active { background: #fff5ef; border-color: rgba(255,122,43,.35); }

    .client-item-name {
      font-size: 13.5px; font-weight: 600; color: var(--text);
      line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .client-item.active .client-item-name { color: var(--orange); }

    .client-item-sub {
      font-size: 11.5px; color: var(--muted);
      margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .list-empty {
      padding: 40px 16px; text-align: center;
      color: var(--muted); font-size: 13px;
    }

    /* ── DETAIL PANEL ── */
    .detail-panel { display: flex; flex-direction: column; overflow: hidden; }

    .detail-panel-inner {
      flex: 1; overflow-y: auto; padding: 28px 32px 48px;
    }
    .detail-panel-inner::-webkit-scrollbar { width: 5px; }
    .detail-panel-inner::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

    .empty-state {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; color: var(--muted); text-align: center; padding: 40px;
    }
    .empty-state-icon {
      width: 64px; height: 64px; border-radius: 18px;
      background: #f1f5f9; display: flex; align-items: center; justify-content: center;
    }
    .empty-state h3 { font-size: 17px; font-weight: 700; color: var(--text); }
    .empty-state p { font-size: 13px; max-width: 280px; line-height: 1.5; }

    /* Detail header */
    .detail-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
    }

    .detail-title { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }

    .detail-id-badge {
      font-size: 11.5px; font-weight: 700; color: var(--muted);
      background: #f1f5f9; border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 10px; margin-top: 4px; display: inline-block;
    }

    .btn-save {
      padding: 10px 22px;
      background: linear-gradient(135deg, var(--orange) 0%, var(--orange-2) 100%);
      color: #fff; border: none; border-radius: 10px;
      font-size: 13.5px; font-weight: 800; font-family: inherit;
      cursor: pointer; transition: opacity .18s, transform .12s, box-shadow .18s;
      box-shadow: 0 4px 14px rgba(255,122,43,.28); white-space: nowrap;
    }
    .btn-save:hover { opacity: .9; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,122,43,.36); }
    .btn-save:disabled { background: #94a3b8; box-shadow: none; cursor: not-allowed; transform: none; }
    .guardar { }

    /* ── SECTION DIVIDER ── */
    .section-sep {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
      margin: 28px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 7px;
      grid-column: 1 / -1;
    }
    .section-sep-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--orange); flex-shrink: 0;
    }

    /* ── FIELD GRID ── */
    .fields-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px 18px;
    }

    .field { display: flex; flex-direction: column; }

    .field label {
      font-size: 11.5px; font-weight: 700; color: var(--label);
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%; padding: 9px 12px;
      font-size: 13.5px; font-family: inherit;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: #fff; color: var(--text);
      transition: border-color .18s, box-shadow .18s;
    }
    .field textarea { resize: vertical; min-height: 60px; overflow-wrap: break-word; }
    textarea[style*="display:none"] { display: none !important; }

    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,122,43,.1);
    }
    .field input.changed, .field select.changed, .field textarea.changed {
      border-color: #f59e0b; background: #fffbeb;
    }
    .field select { cursor: pointer; }

    /* ── single-line input style shared with textarea ── */
    .field input.short {
      width: 100%; padding: 9px 12px;
      font-size: 13.5px; font-family: inherit;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: #fff; color: var(--text);
      transition: border-color .18s, box-shadow .18s;
    }
    .field input.short:focus {
      outline: none; border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,122,43,.1);
    }

    /* ── TOGGLE BUTTON ── */
    .btn-toggle {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 13px; background: #f8fafc;
      border: 1.5px solid var(--border); border-radius: 9px;
      font-size: 13px; font-weight: 600; font-family: inherit;
      color: var(--muted); cursor: pointer; transition: all .18s;
      width: auto;
    }
    .btn-toggle svg { flex-shrink: 0; }
    .btn-toggle:hover { background: #fff5ef; border-color: var(--orange); color: var(--orange); }
    .btn-toggle-hide {
      background: #fff5ef; border-color: rgba(255,122,43,.4);
      color: var(--orange); margin-top: 6px;
    }
    .btn-toggle-hide:hover { background: #ffe8d6; }

    /* ── CHECKBOX GRID ── */
    .checkbox-grid {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px 8px; margin-top: 8px; padding: 8px 10px;
      background: #fafbfc; border-radius: 10px;
      border: 1.5px solid var(--border);
      max-width: 100%;
    }
    .checkbox-grid label {
      font-size: 12.5px; font-weight: 500; color: var(--text);
      text-transform: none; letter-spacing: 0;
      display: flex; align-items: center; gap: 7px; cursor: pointer;
      padding: 4px 6px; border-radius: 6px; transition: background .14s;
    }
    .checkbox-grid label:hover { background: #f1f5f9; }
    .checkbox-grid input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 15px; height: 15px; flex-shrink: 0;
      border: 2px solid #cbd5e1; border-radius: 4px;
      background: #fff; cursor: pointer;
      transition: border-color .15s, background .15s;
      position: relative;
    }
    .checkbox-grid input[type="checkbox"]:checked {
      background: var(--orange); border-color: var(--orange);
    }
    .checkbox-grid input[type="checkbox"]:checked::after {
      content: '';
      position: absolute; left: 50%; top: 45%;
      width: 4px; height: 8px;
      border: 2px solid #fff; border-top: none; border-left: none;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    /* ── FILE PICKER ── */
    .file-picker { position: relative; }
    .file-picker input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 2; width: 100%; height: 100%;
    }
    .file-picker-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; border-radius: 10px;
      border: 1.5px dashed var(--border);
      background: #fafbfc; cursor: pointer;
      transition: border-color .18s, background .18s;
      pointer-events: none;
    }
    .file-picker:hover .file-picker-btn {
      border-color: var(--orange); background: #fff5ef;
    }
    .file-picker-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--bg); display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--muted);
    }
    .file-picker-text { min-width: 0; }
    .file-picker-name {
      font-size: 13px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .file-picker-hint { font-size: 11px; color: var(--muted); margin-top: 1px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 12px 20px; border-radius: 12px;
      font-size: 13.5px; font-weight: 700; color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      transform: translateY(80px); opacity: 0;
      transition: transform .28s cubic-bezier(.34,1.56,.64,1), opacity .24s;
      z-index: 999; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: #16a34a; }
    .toast.error   { background: #dc2626; }

    @media (max-width: 1024px) {
      .file-upload-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 280px; }
      .detail-panel-inner { padding: 20px 18px 40px; }
    }

    @media (max-width: 640px) {
      .fields-grid { grid-template-columns: 1fr; }
      .checkbox-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <div class="header-brand">
      <img src="/shared-static/img/logo-atc.png" alt="ATC">
      <div class="header-brand-text">
        <strong>Alguien Te Cuida</strong>
        <span>Base de Datos — Órdenes de Servicio</span>
      </div>
    </div>
    <a id="btnVolver" href="#" class="btn-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Volver al panel
    </a>
  </header>

  <div class="workspace">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <p class="sidebar-top-title">Órdenes de Servicio</p>
        <div class="search-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="searchInput" class="search-input" type="text" placeholder="Buscar ODS..." oninput="filtrarLista()">
        </div>
        <p class="sidebar-count" id="sidebarCount"></p>
      </div>
      <div class="client-list" id="clientList">
        <div class="list-empty">Cargando...</div>
      </div>
    </aside>

    <!-- DETAIL -->
    <section class="detail-panel">
      <div class="detail-panel-inner" id="detailPanel">
        <div class="empty-state">
          <div class="empty-state-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </div>
          <h3>Selecciona una ODS</h3>
          <p>Elige una orden de servicio de la lista para ver y editar sus datos.</p>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const qsToken = new URLSearchParams(window.location.search).get("token") || "";
    const withToken = (url) => {
      const sep = url.includes("?") ? "&" : "?";
      return qsToken ? `${url}${sep}token=${encodeURIComponent(qsToken)}` : url;
    };
    document.getElementById("btnVolver").href = withToken("/venta/panel-selector");

    let allODS = [];
    let activeODS = null;

    /* ── TOAST ── */
    function showToast(msg, type = "success") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.classList.remove("show"), 3000);
    }

    /* ── LOAD DATA ── */
    async function init() {
      try {
        const res = await fetch(withToken("/api/venta/ods/lista"));
        if (!res.ok) throw new Error("No se pudo cargar la lista de ODS.");
        const data = await res.json();
        allODS = data.ods || [];
        renderList(allODS);
      } catch (err) {
        document.getElementById("clientList").innerHTML =
          `<div class="list-empty">${err.message || "Error cargando datos."}</div>`;
      }
    }

    /* ── RENDER LIST ── */
    function renderList(items) {
      const container = document.getElementById("clientList");
      const count = document.getElementById("sidebarCount");
      if (!items.length) {
        container.innerHTML = '<div class="list-empty">Sin resultados</div>';
        count.textContent = "";
        return;
      }
      count.textContent = `${items.length} ODS`;
      container.innerHTML = items.map(ods => `
        <div class="client-item${activeODS === ods ? ' active' : ''}" data-ods="${escAttr(ods)}" onclick="selectODS('${escAttr(ods)}')">
          <div class="client-item-name">${escHTML(ods)}</div>
        </div>
      `).join('');
    }

    /* ── FILTER ── */
    function filtrarLista() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      renderList(q ? allODS.filter(o => o.toLowerCase().includes(q)) : allODS);
    }

    /* ── SELECT ODS ── */
    async function selectODS(ods) {
      activeODS = ods;
      filtrarLista();

      const panel = document.getElementById("detailPanel");
      panel.innerHTML = `
        <div class="detail-header">
          <div>
            <div class="detail-title">${escHTML(ods)}</div>
            <span class="detail-id-badge">ODS ${escHTML(ods)}</span>
          </div>
          <button class="btn-save guardar" id="btnSave" onclick="guardarCambiosODS()" type="button">Guardar cambios</button>
        </div>

        <div class="fields-grid">
          <div class="section-sep" style="margin-top:0"><span class="section-sep-dot"></span>Datos del Cliente</div>

          <div class="field"><label>RUT</label><input type="text" id="rut"></div>
          <div class="field"><label>Razón Social</label><input type="text" id="razonSocial"></div>
          <div class="field"><label>Nombre Sucursal</label><input type="text" id="nombreSucursal"></div>
          <div class="field"><label>Dirección Sucursal</label><input type="text" id="direccionSucursal"></div>

          <div class="section-sep"><span class="section-sep-dot"></span>Datos Comerciales</div>

          <div class="field">
            <label>Tipo Plan</label>
            <select id="tipoPlan">
              <option value="">Seleccione...</option>
              <option>Plan Full</option>
              <option>Plan Mixto</option>
            </select>
          </div>
          <div class="field">
            <label>Tipo Cliente</label>
            <select id="tipoCliente">
              <option value="">Seleccione...</option>
              <option>EMPRESA</option>
              <option>DOMICILIO</option>
              <option>STRIP CENTER</option>
              <option>MUNICIPALIDAD</option>
              <option>CONDOMINIO</option>
            </select>
          </div>
          <div class="field"><label>Monto a Cobrar</label><input type="text" id="montoACobrar"></div>
          <div class="field" style="grid-column:span 2">
            <label>Tipo Servicio</label>
            <button class="btn-toggle" onclick="toggleServicio()" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
              Seleccionar
            </button>
            <div id="servicios-wrapper" class="checkbox-grid">
              <label><input type="checkbox" value="Televigilancia"> Televigilancia</label>
              <label><input type="checkbox" value="Alarma"> Alarma</label>
              <label><input type="checkbox" value="Guardia"> Guardia</label>
              <label><input type="checkbox" value="Instalacion"> Instalación</label>
              <label><input type="checkbox" value="Upgrade"> Upgrade</label>
              <label><input type="checkbox" value="Downgrade"> Downgrade</label>
              <label><input type="checkbox" value="Servicio Tecnico"> Servicio Técnico</label>
              <label><input type="checkbox" value="Monitoreo Adicional"> Monitoreo Adicional</label>
              <label><input type="checkbox" value="Desinstalacion"> Desinstalación</label>
            </div>
          </div>

          <div class="section-sep"><span class="section-sep-dot"></span>Parámetros de Servicio</div>

          <div class="field"><label>N° Cámaras a Instalar</label><input type="text" id="camInstalar"></div>
          <div class="field"><label>N° Cámaras a Vigilar</label><input type="text" id="camVigilar"></div>
          <div class="field"><label>Horario Nuevo Monitoreo</label><input type="text" id="horario"></div>
          <div class="field"><label>Días Monitoreo Adicional</label><input type="text" id="diasAdicional"></div>

          <div class="section-sep"><span class="section-sep-dot"></span>Información Adicional</div>

          <div class="field">
            <label>Materiales</label>
            <button class="btn-toggle" id="btn-materiales" onclick="toggleField('materiales','btn-materiales')" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
              Ver Materiales
            </button>
            <textarea id="materiales" style="display:none;"></textarea>
            <button class="btn-toggle btn-toggle-hide" id="anular-btn-materiales" style="display:none;" onclick="toggleField('materiales','btn-materiales')" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
              Ocultar
            </button>
          </div>
          <div class="field">
            <label>Consideraciones</label>
            <button class="btn-toggle" id="btn-consideraciones" onclick="toggleField('consideraciones','btn-consideraciones')" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
              Ver Consideraciones
            </button>
            <textarea id="consideraciones" style="display:none;"></textarea>
            <button class="btn-toggle btn-toggle-hide" id="anular-btn-consideraciones" style="display:none;" onclick="toggleField('consideraciones','btn-consideraciones')" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
              Ocultar
            </button>
          </div>
          <div class="field">
            <label>Observación</label>
            <button class="btn-toggle" id="btn-observacion" onclick="toggleField('observacion','btn-observacion')" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
              Ver Observación
            </button>
            <textarea id="observacion" style="display:none;"></textarea>
            <button class="btn-toggle btn-toggle-hide" id="anular-btn-observacion" style="display:none;" onclick="toggleField('observacion','btn-observacion')" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
              Ocultar
            </button>
          </div>

          <div class="section-sep"><span class="section-sep-dot"></span>Archivos Adjuntos</div>

          <div class="field">
            <label>Cotización</label>
            <div class="file-picker">
              <input type="file" id="cotizacion" accept=".pdf,.doc,.docx" onchange="updateFilePicker(this,'cotizacion-name')">
              <div class="file-picker-btn">
                <div class="file-picker-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                </div>
                <div class="file-picker-text">
                  <div class="file-picker-name" id="cotizacion-name">Seleccionar archivo</div>
                  <div class="file-picker-hint">PDF, DOC, DOCX</div>
                </div>
              </div>
            </div>
          </div>
          <div class="field">
            <label>Layout</label>
            <div class="file-picker">
              <input type="file" id="layout" accept="image/*,.pdf" onchange="updateFilePicker(this,'layout-name')">
              <div class="file-picker-btn">
                <div class="file-picker-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                </div>
                <div class="file-picker-text">
                  <div class="file-picker-name" id="layout-name">Seleccionar archivo</div>
                  <div class="file-picker-hint">Imagen o PDF</div>
                </div>
              </div>
            </div>
          </div>
          <div class="field">
            <label>Orden de Compra (OC)</label>
            <div class="file-picker">
              <input type="file" id="oc" accept=".pdf,.doc,.docx" onchange="updateFilePicker(this,'oc-name')">
              <div class="file-picker-btn">
                <div class="file-picker-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                </div>
                <div class="file-picker-text">
                  <div class="file-picker-name" id="oc-name">Seleccionar archivo</div>
                  <div class="file-picker-hint">PDF, DOC, DOCX</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      /* load data into form */
      try {
        const res = await fetch(withToken("/api/venta/ods/detalle?codigo=" + encodeURIComponent(ods)));
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: "No se pudo cargar la ODS." }));
          throw new Error(typeof err?.detail === "string" ? err.detail : "No se pudo cargar la ODS.");
        }
        const datos = await res.json();
        poblarFormulario(datos);
      } catch (e) {
        showToast(e.message || "Error al cargar la ODS.", "error");
      }
    }

    /* ── POPULATE FORM ── */
    function poblarFormulario(datos) {
      const campos = [
        "rut","razonSocial","direccionSucursal","nombreSucursal",
        "tipoPlan","tipoCliente","camInstalar","camVigilar",
        "montoACobrar","diasAdicional","horario",
        "materiales","consideraciones","observacion"
      ];
      campos.forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.value = datos[id] || "";
      });
      document.querySelectorAll('#servicios-wrapper input[type="checkbox"]')
        .forEach((cb) => cb.checked = (datos.tipoServicio || "").split("|").map(s => s.trim()).includes(cb.value));
    }

    /* ── FILE TO BASE64 ── */
    async function archivoABase64(input) {
      return new Promise((resolve) => {
        if (!input || !input.files || !input.files.length) { resolve(null); return; }
        const archivo = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => resolve({ nombre: archivo.name, tipo: archivo.type || "application/octet-stream", data: String(e.target?.result || "") });
        reader.readAsDataURL(archivo);
      });
    }

    /* ── SAVE ── */
    async function guardarCambiosODS() {
      const btn = document.getElementById("btnSave");
      btn.disabled = true;
      btn.textContent = "Guardando...";

      try {
        if (!activeODS) throw new Error("Selecciona una ODS.");

        const datos = { selectorODS: activeODS };
        const campos = [
          "rut","razonSocial","direccionSucursal","nombreSucursal",
          "tipoPlan","tipoCliente","camInstalar","camVigilar",
          "montoACobrar","diasAdicional","horario",
          "materiales","consideraciones","observacion"
        ];
        campos.forEach((id) => datos[id] = document.getElementById(id)?.value || "");
        datos.tipoServicio = Array.from(
          document.querySelectorAll('#servicios-wrapper input[type="checkbox"]:checked')
        ).map(cb => cb.value).join(", ");

        const cotizacion = await archivoABase64(document.getElementById("cotizacion"));
        const layout = await archivoABase64(document.getElementById("layout"));
        const oc = await archivoABase64(document.getElementById("oc"));
        if (cotizacion) datos.cotizacion = cotizacion;
        if (layout) datos.layout = layout;
        if (oc) datos.oc = oc;

        const res = await fetch(withToken("/api/venta/ods/guardar"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: "No se pudo guardar la ODS." }));
          throw new Error(typeof err?.detail === "string" ? err.detail : "No se pudo guardar la ODS.");
        }

        showToast("Guardado correctamente ✓", "success");
      } catch (e) {
        showToast(e.message || "Error al guardar", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Guardar cambios";
      }
    }

    /* ── TOGGLE HELPERS ── */
    function toggleField(f, b) {
      const field = document.getElementById(f);
      const btn = document.getElementById(b);
      const an = document.getElementById("anular-" + b);
      const visible = field.style.display === "block";
      field.style.display = visible ? "none" : "block";
      btn.style.display = visible ? "inline-flex" : "none";
      if (an) an.style.display = visible ? "none" : "inline-flex";
    }

    function toggleServicio() {
      const div = document.getElementById("servicios-wrapper");
      div.style.display = div.style.display === "grid" ? "none" : "grid";
    }

    /* ── FILE PICKER LABEL ── */
    function updateFilePicker(input, labelId) {
      const label = document.getElementById(labelId);
      if (!label) return;
      if (input.files && input.files.length) {
        label.textContent = input.files[0].name;
        label.style.color = "var(--orange)";
      } else {
        label.textContent = "Seleccionar archivo";
        label.style.color = "";
      }
    }

    function escHTML(str) {
      return String(str || '').replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
      );
    }
    function escAttr(str) {
      return String(str || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    init();
  </script>
</body>
</html>
